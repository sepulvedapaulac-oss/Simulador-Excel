<body>

<main class="app ev caso" id="app"></main>
<script>
(function(){
const PASS_PCT=80;
const CASO={
 tipo:'actividad',codigo:'M5_AP1',
 curso:'LEGISLACIÓN LABORAL · MÓDULO 5 · ACTIVIDAD PRÁCTICA 1',
 eyebrow:'Actividad práctica 1 · Caso ramificado',
 titulo:'La reestructuración del área de facturación',
 contexto:'<p>Horizonte Servicios automatizará su facturación y suprimirá cargos del área de facturación manual. La gerencia le pide a Camila "desvincular por necesidades de la empresa" a tres personas, y aprovechar de incluir a alguien con quien "ya no hay confianza". Acompaña a Camila desde la elección de la causal hasta la carta y sus plazos, y hasta el día en que la <b>Inspección del Trabajo</b> pide los antecedentes del despido: cada decisión cambia lo que pasa después.</p>',
 objetivos:['<b>Analizar</b> si los hechos permiten sostener la causal de necesidades de la empresa para cada persona.','<b>Revisar</b> la carta de término: causal, hechos, cotizaciones y monto a pagar.','<b>Demostrar</b> ante la Inspección del Trabajo, con evidencia real y coherente, cómo se hizo el despido y, si algo falla, corregir el caso y su causa.','<b>Explicar</b> a la gerencia los plazos, la copia a la Inspección y los riesgos de una causal mal aplicada.'],
 tiempo:'25–35 min',resumen:'5 decisiones · 2 respuestas de desarrollo',
 expediente:[
  {titulo:'Correo de la gerencia (lunes 5 de octubre)',html:'<p>"Camila: con la facturación automatizada, el área de facturación manual se suprime desde noviembre. Hay que desvincular a <b>Rodrigo Fuentes</b> y a <b>Marcela Soto</b>. Aprovechemos de incluir a <b>Pablo Reyes</b>, de cobranzas: con su jefatura ya no hay confianza. Usa necesidades de la empresa para los tres; es lo más rápido. Rodrigo sale el viernes 16 de octubre: no alcanzamos a darle 30 días de aviso."</p>'},
  {titulo:'Ficha de las personas mencionadas',html:'<table><tr><th>Persona</th><th>Cargo y área</th><th>Situación</th></tr><tr><td>Rodrigo Fuentes</td><td>Analista de facturación manual (cargo suprimido)</td><td>Contrato indefinido desde marzo de 2019. Activo.</td></tr><tr><td>Marcela Soto</td><td>Asistente de facturación manual (cargo suprimido)</td><td>Contrato indefinido desde 2021. <b>Con licencia médica</b> del 28 de septiembre al 25 de octubre.</td></tr><tr><td>Pablo Reyes</td><td>Analista de cobranzas (su área no cambia)</td><td>Contrato indefinido desde 2020. Sin amonestaciones ni registros de incumplimiento.</td></tr></table>'},
  {titulo:'Acta de la gerencia general (15 de septiembre)',html:'<p>Se aprueba implementar la facturación electrónica automatizada. A contar del 1 de noviembre se suprimen los cargos de <b>Analista de facturación manual</b> y <b>Asistente de facturación manual</b>, cuyas tareas pasan a ser realizadas por el nuevo sistema.</p>'},
  {titulo:'Estado de cotizaciones de Rodrigo (sistema de pago previsional)',html:'<table><tr><th>Mes</th><th>Estado</th></tr><tr><td>Julio</td><td>Pagadas</td></tr><tr><td>Agosto</td><td>Pagadas</td></tr><tr><td>Septiembre</td><td><b>Declaradas y no pagadas</b> (error en la transferencia bancaria)</td></tr></table>'},
  {titulo:'Reglas legales (arts. 161 y 162 del Código del Trabajo)',html:'<p><b>Art. 161:</b> necesidades de la empresa, como la racionalización o modernización, que hagan necesaria la separación. Se funda en hechos objetivos de la organización; no sirve para problemas de desempeño, conducta o relaciones personales. No puede invocarse respecto de personas con licencia médica.</p><p><b>Art. 162:</b> comunicación escrita (personalmente o por carta certificada al domicilio del contrato) con la causal, los hechos y el estado de pago de las cotizaciones devengadas hasta el último día del mes anterior, con comprobantes. Plazo: 3 días hábiles desde la separación; copia a la Inspección del Trabajo en el mismo plazo. En el art. 161, aviso de 30 días o indemnización sustitutiva (la carta indica el monto total a pagar). Si las cotizaciones no están pagadas, el despido no pone término al contrato hasta que se convalide.</p>'},
  {titulo:'Fiscalización y evidencia (lecciones 5.7 a 5.9)',html:'<p>La Dirección del Trabajo fiscaliza el cumplimiento de la legislación laboral (art. 476) y puede requerir contratos, anexos, liquidaciones, registros, comprobantes de cotizaciones, cartas de término y finiquitos. Sus inspectores son ministros de fe: los hechos que constatan se presumen verdaderos.</p><p>En juicio, el empleador no puede alegar hechos distintos de los señalados en la carta (art. 454 N°1): sin antecedentes que los respalden, la causal es difícil de probar. El finiquito no prueba por sí solo los hechos de la causal.</p><p>Si se cursa una multa y el empleador corrige dentro de los 15 días siguientes a la notificación, se rebaja al menos en 50% (art. 511). Corregir el caso resuelve el incumplimiento; revisar el proceso que lo causó evita que se repita.</p>'}
 ],
 competencias:[
  {id:'causal',nombre:'Elegir la causal según los hechos',fortaleza:'vinculas la causal con hechos objetivos y reconoces cuándo no puede invocarse.',mejora:'repasa los requisitos del art. 161, sus límites (licencia médica, problemas de desempeño o de relación) y la diferencia con las causales del art. 160.',repasar:'Lecciones 5.1 y 5.3'},
  {id:'carta',nombre:'Redactar y comunicar el término',fortaleza:'sabes qué debe contener la carta para servir como evidencia y cómo y cuándo se comunica.',mejora:'repasa las menciones de la carta del art. 162, el plazo de 3 días hábiles, la copia a la Inspección y por qué en juicio solo pueden alegarse los hechos señalados en la carta.',repasar:'Lección 5.4'},
  {id:'prev',nombre:'Cotizaciones y Ley Bustos',fortaleza:'verificas las cotizaciones antes del despido.',mejora:'repasa el efecto de despedir con cotizaciones impagas y cómo se convalida el despido.',repasar:'Lección 5.4'},
  {id:'evid',nombre:'Demostrar el proceso ante la fiscalización',fortaleza:'presentas evidencia real y coherente y, si algo falla, corriges el caso y su causa.',mejora:'repasa qué documentos puede requerir la Inspección, por qué no se construyen documentos al llegar una citación y la diferencia entre corregir el caso y el proceso.',repasar:'Lecciones 5.7, 5.8 y 5.9'}
 ],
 inicio:'e1',
 etapas:[
  {id:'e1',tipo:'decision',titulo:'¿A quién y por qué causal?',corto:'Elegir la causal',competencia:'causal',
   escena:'<p>Camila abre el <b>expediente</b>: el correo de la gerencia, la ficha de las tres personas y el acta del 15 de septiembre. La gerencia quiere la nómina hoy.</p>',
   pregunta:'¿Qué propuesta lleva Camila a la gerencia?',
   ideal:'aplicar el art. 161 solo a Rodrigo, cuyo cargo se suprime por un hecho objetivo documentado; no incluir a Marcela mientras esté con licencia médica, ni a Pablo, cuya situación no se relaciona con la reestructuración.',
   opciones:[
    {texto:'Incluir a los tres por necesidades de la empresa: como se les pagará indemnización, nadie tendrá motivo para reclamar.',pts:0,fb:'El pago no "repara" una causal mal elegida. La causal del art. 161 exige hechos objetivos de la organización: no los hay respecto de Pablo, y no puede invocarse respecto de Marcela mientras esté con licencia médica. Si un tribunal la declara improcedente, la indemnización por años de servicio se recarga en 30%.',siguiente:'e2x'},
    {texto:'Aplicar el art. 161 solo a Rodrigo, fundado en la supresión de su cargo aprobada en el acta; dejar fuera a Marcela mientras esté con licencia médica y a Pablo, cuya área no cambia.',pts:2,fb:'Correcto: la causal se elige según los hechos reales. La supresión del cargo de Rodrigo es un hecho objetivo y documentado. La licencia médica de Marcela impide invocar el art. 161, y una relación tensa con la jefatura no es una necesidad de la empresa.',siguiente:'e2'},
    {texto:'Aplicar el art. 161 a Rodrigo y a Marcela, porque ambos cargos se suprimen, y dejar fuera a Pablo.',pts:1,fb:'Bien al excluir a Pablo: su situación no tiene relación con la reestructuración. Pero el art. 161 no puede invocarse respecto de una persona con licencia médica, como Marcela.',siguiente:'e2x'}]},
  {id:'e2x',tipo:'decision',titulo:'La nómina vuelve con observaciones',corto:'Corregir el rumbo',competencia:'causal',
   escena:'<p>La abogada externa de Horizonte revisa la nómina antes de que se firme y la devuelve con una nota: <i>"Revisen la situación de Marcela (ver ficha) y la de cualquier persona que no pertenezca al área suprimida. Si un tribunal declara improcedente la causal del art. 161, la indemnización por años de servicio se recarga en 30%."</i></p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'retirar a Marcela mientras dure su licencia y a Pablo, dejando registro de los motivos; si existen problemas con Pablo, se analizan aparte, con sus propios hechos y evidencia.',
   opciones:[
    {texto:'Mantener a Marcela, pero entregarle la carta con una fecha de término posterior al fin de su licencia.',pts:0,fb:'Mientras Marcela está con licencia médica no puede invocarse respecto de ella el art. 161. Cambiar la fecha de término en la carta no resuelve ese límite.',siguiente:'e3'},
    {texto:'Retirar de la nómina a Marcela (mientras esté con licencia) y a Pablo, y dejar por escrito los motivos de cada exclusión; si hay problemas con Pablo, se analizarán aparte con sus propios hechos.',pts:2,fb:'Correcto: corriges el rumbo antes de que el error produzca efectos y dejas respaldo de por qué cada persona queda o no en la nómina.',siguiente:'e3'},
    {texto:'Retirar a Marcela y a Pablo de la nómina, sin dejar registro de los motivos para no "complicar" a la gerencia.',pts:1,fb:'La decisión de fondo es correcta, pero sin registro no queda evidencia de cómo se aplicó la causal ni de por qué se excluyó a cada persona.',siguiente:'e3'}]},
  {id:'e2',tipo:'decision',titulo:'La jefatura de Pablo insiste',corto:'Otra causal para Pablo',competencia:'causal',
   escena:'<p>La jefatura de cobranzas reacciona: <i>"Si no puede ser por necesidades de la empresa, despidámoslo por incumplimiento grave de sus obligaciones (art. 160 N°7). Así además no se le paga indemnización."</i> La ficha de Pablo no registra amonestaciones ni incumplimientos.</p>',
   pregunta:'¿Qué responde Camila?',
   ideal:'explicar que una causal se elige según hechos reales y comprobados, y que sin hechos documentados no hay incumplimiento grave; los problemas de desempeño se gestionan y registran antes de cualquier decisión.',
   opciones:[
    {texto:'Que aplique el art. 160 N°7: es la causal que no genera indemnización.',pts:0,fb:'Elegir la causal por su costo es "construirla" después de decidir. Sin hechos comprobados no hay incumplimiento grave; si un tribunal declara injustificado un despido por art. 160, la indemnización por años de servicio se recarga en 80%, y hasta 100% si no había motivo plausible.',siguiente:'e3'},
    {texto:'Que no se puede hacer nada con Pablo, sin más explicación.',pts:1,fb:'Es cierto que hoy no hay causal, pero la respuesta no orienta a la jefatura: si existen problemas de desempeño, deben gestionarse y registrarse con hechos concretos.',siguiente:'e3'},
    {texto:'Que una causal disciplinaria exige hechos graves y comprobados; hoy no existen. Si hay problemas de desempeño, deben gestionarse y registrarse antes de evaluar cualquier decisión.',pts:2,fb:'Correcto: la causal se elige según los hechos reales y debe poder probarse. Sin registros, invocar el art. 160 expone a la empresa a que el despido se declare injustificado.',siguiente:'e3'}]},
  {id:'e3',tipo:'abierta',titulo:'¿Los hechos sostienen la causal?',corto:'Analizar los hechos',verbo:'Analiza',
   escena:'<p>Revisa el <b>acta de la gerencia general</b> y la <b>ficha</b> de Rodrigo en el expediente.</p>',
   consigna:'si los hechos permiten sostener la causal de necesidades de la empresa respecto de Rodrigo y qué antecedentes conservarías como respaldo de la decisión.',minPalabras:40,
   modelo:'La causal del art. 161 se funda en hechos objetivos de la organización. Aquí existe un hecho concreto y documentado: el acta del 15 de septiembre aprueba la automatización y suprime el cargo de Analista de facturación manual desde el 1 de noviembre, que es el de Rodrigo. No hay licencia médica que impida invocarla. Conservaría el acta, la descripción del nuevo proceso, el organigrama antes y después, la carta, los comprobantes de cotizaciones y el cálculo del finiquito.',
   criterios:['Relaciona la causal con un hecho objetivo de la organización (supresión del cargo por modernización).','Verifica que no exista un impedimento (por ejemplo, licencia médica).','Enumera respaldos concretos: acta, nuevo proceso, carta, cotizaciones, cálculo.'],siguiente:'e4'},
  {id:'e4',tipo:'decision',titulo:'El borrador y la entrega de la carta',corto:'Carta y plazo',competencia:'carta',
   escena:'<p>La gerencia envía este borrador para Rodrigo, que dejará de prestar servicios el viernes 16 de octubre sin aviso de 30 días:</p><p style="border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)"><i>"Santiago, 16 de octubre de 2026. Por medio de la presente comunicamos a usted que se pone término a su contrato de trabajo a contar de esta fecha, por la causal del artículo 161 del Código del Trabajo. Saluda atentamente, Gerencia de Horizonte Servicios."</i></p><p>Y agrega: <i>"Se la mandamos cuando podamos; la copia a la Inspección, a fin de mes."</i></p>',
   pregunta:'¿Qué hace Camila con el borrador y con su entrega?',
   ideal:'completar la carta con los hechos concretos, el estado de pago de las cotizaciones con sus comprobantes y el monto total a pagar (incluida la sustitutiva del aviso previo), entregarla personalmente o por carta certificada al domicilio del contrato dentro de los 3 días hábiles siguientes a la separación, y enviar copia a la Inspección del Trabajo en el mismo plazo.',
   opciones:[
    {texto:'La completa con los hechos y el estado de las cotizaciones, la entrega dentro de 3 días hábiles y envía la copia a la Inspección a fin de mes, junto con el finiquito.',pts:1,fb:'El contenido y el plazo para Rodrigo van bien, pero falta el monto total a pagar (no hubo aviso de 30 días) y la copia a la Inspección debe enviarse dentro del mismo plazo de 3 días hábiles (puede hacerse electrónicamente en el sitio de la Dirección del Trabajo).',siguiente:'e5'},
    {texto:'La completa: hechos concretos (supresión del cargo aprobada en el acta), estado de pago de las cotizaciones con comprobantes y monto total a pagar, incluida la sustitutiva; la entrega personalmente o por carta certificada dentro de 3 días hábiles desde la separación, con copia a la Inspección en el mismo plazo.',pts:2,fb:'Correcto: así se cumple el art. 162. En juicio, la empresa no puede alegar hechos distintos de los señalados en la carta (art. 454 N°1), y la copia a la Inspección deja constancia del término.',siguiente:'e5'},
    {texto:'La deja tal cual (citar el art. 161 basta) y le envía una foto por mensajería cuando haya tiempo.',pts:0,fb:'Citar el artículo no basta: la carta debe explicar los hechos, informar las cotizaciones y, sin aviso de 30 días, el monto total. Se entrega personalmente o por carta certificada al domicilio del contrato, dentro de 3 días hábiles, con copia a la Inspección.',siguiente:'e5'}]},
  {id:'e5',tipo:'decision',titulo:'Las cotizaciones de septiembre',corto:'Cotizaciones',competencia:'prev',
   escena:'<p>Al reunir los comprobantes, Camila revisa el <b>estado de cotizaciones</b> del expediente: las de septiembre de Rodrigo figuran <b>declaradas y no pagadas</b> por un error en la transferencia. La gerencia dice: <i>"Despidámoslo igual el viernes y lo pagamos con el finiquito."</i></p>',
   pregunta:'¿Qué decide Camila?',
   ideal:'pagar las cotizaciones de septiembre antes del despido y adjuntar los comprobantes a la carta.',
   opciones:[
    {texto:'Despedir el viernes como pide la gerencia; las cotizaciones se pagan después, con el finiquito.',pts:0,fb:'Si al momento del despido las cotizaciones no están íntegramente pagadas, el despido no pone término al contrato (art. 162, "Ley Bustos"): la empresa sigue debiendo remuneraciones y cotizaciones hasta convalidarlo.',siguiente:'e6x'},
    {texto:'Pagar las cotizaciones de septiembre antes del despido y adjuntar los comprobantes a la carta.',pts:2,fb:'Correcto: la carta debe informar el estado de pago de las cotizaciones hasta el último día del mes anterior, con comprobantes. Pagarlas antes evita que el despido quede sin efecto.',siguiente:'e6'},
    {texto:'Mencionar en la carta que septiembre está "en proceso de pago" y despedir igual el viernes.',pts:1,fb:'Informar la situación es mejor que ocultarla, pero no resuelve el problema: con cotizaciones impagas, el despido no pone término al contrato hasta que se paguen y se comunique por carta certificada.',siguiente:'e6x'}]},
  {id:'e6',tipo:'decision',titulo:'La Inspección pide los antecedentes',corto:'Demostrar el proceso',competencia:'evid',
   escena:'<p>Las cotizaciones quedaron pagadas antes del despido y la carta se entregó a tiempo. En diciembre, a raíz de una denuncia, la <b>Inspección del Trabajo</b> cita a Horizonte para revisar el despido de Rodrigo. El gerente propone: <i>"Llevemos solo el finiquito ratificado: eso cierra todo. Y si quieren más, redactamos hoy un informe de la reestructuración con fecha de septiembre."</i></p>',
   pregunta:'¿Qué presenta Camila?',
   ideal:'la documentación real del proceso, revisada para que fechas, montos y hechos coincidan entre sí: acta del 15 de septiembre, contrato, carta con su fecha de entrega y la copia a la Inspección, comprobantes de cotizaciones pagadas antes del despido, cálculo y finiquito, y el registro de cómo se definió la nómina.',
   opciones:[
    {texto:'Solo el finiquito ratificado, porque cierra todo el proceso.',pts:1,fb:'Presentar documentos reales está bien, pero el finiquito no prueba por sí solo los hechos de la causal ni la carta, el plazo o las cotizaciones. La Inspección puede requerir toda la documentación del término.',siguiente:'e7'},
    {texto:'La documentación real, revisada para que fechas, montos y hechos coincidan: acta del 15 de septiembre, contrato, carta con su fecha de entrega y la copia a la Inspección, comprobantes de cotizaciones pagadas, cálculo, finiquito y el registro de cómo se definió la nómina.',pts:2,fb:'Correcto: el cumplimiento se demuestra con una cadena documental completa y coherente, que permita reconstruir quién decidió, qué ocurrió, qué norma se aplicó y qué se comunicó.',siguiente:'e7'},
    {texto:'El finiquito y un informe de la reestructuración redactado hoy, con fecha de septiembre, para reforzar la carpeta.',pts:0,fb:'Construir documentos cuando llega la citación no sirve y contradice la realidad que el inspector constata como ministro de fe. El acta real del 15 de septiembre ya respalda los hechos.',siguiente:'e7'}]},
  {id:'e6x',tipo:'decision',titulo:'La Inspección detecta las cotizaciones',corto:'Corregir caso y causa',competencia:'evid',
   escena:'<p>Rodrigo fue despedido el viernes con las cotizaciones de septiembre impagas. En diciembre, a raíz de una denuncia, la <b>Inspección del Trabajo</b> cita a Horizonte para revisar su despido. Al ordenar la carpeta, Camila confirma que no hay comprobante de pago de septiembre anterior al despido. El gerente propone: <i>"Cambiemos la carta de la carpeta por una que diga que todo estaba pagado."</i></p>',
   pregunta:'¿Qué hace Camila?',
   ideal:'presentar los documentos reales y corregir el caso (pagar las cotizaciones morosas, comunicarlo a Rodrigo por carta certificada para convalidar el despido y pagar las remuneraciones y cotizaciones del período) y su causa (un control previo de cotizaciones pagadas, con responsable, antes de firmar cualquier carta de término).',
   opciones:[
    {texto:'Reemplazar la carta en la carpeta por una que diga que las cotizaciones estaban pagadas.',pts:0,fb:'Construir documentos contradice la realidad que el inspector constata como ministro de fe, y no cambia el efecto: con cotizaciones impagas el despido no puso término al contrato hasta convalidarlo.',siguiente:'e7'},
    {texto:'Pagar las cotizaciones morosas y comunicarlo a Rodrigo por carta certificada, sin cambiar nada más.',pts:1,fb:'Convalidar el despido corrige el caso (y la empresa debe además las remuneraciones y cotizaciones del período), pero no la causa: sin un control previo, el error puede repetirse en el próximo término.',siguiente:'e7'},

function result(){const S=summary(),G=globalFb(S),R=reportHTML(S,G,true);$('#work').hidden=true;const box=$('#result');box.hidden=false;
  box.innerHTML=`<div class="score"><div class="ring" style="background:conic-gradient(${S.pass?'var(--good-line)':'var(--bad-line)'} ${S.pct*3.6}deg,var(--track) 0)"><span style="background:var(--surface);width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem">${S.pct}%</span></div>
   <div><span class="eyebrow">Resultado · ${esc(CASO.eyebrow||'')}</span><h2>${S.pass?'¡Aprobado!':'Aún no alcanzas el mínimo'}</h2><p><b>Puntaje: ${fmt(S.pts)} / ${fmt(S.max)}</b></p><p>${S.pass?`Superaste el ${PASS_PCT}% requerido.`:`Necesitas al menos ${PASS_PCT}% para aprobar. Revisa la retroalimentación, repasa lo indicado e inténtalo de nuevo.`}</p></div></div>
   <h3 style="margin-top:18px">Retroalimentación global</h3>${R.comp}${R.glob}${CASO.cierre?`<div class="callout" style="margin-top:12px">${CASO.cierre}</div>`:''}
   <div class="completion-actions noprint" style="justify-content:flex-start;flex-wrap:wrap"><button class="small-btn primary" type="button" id="dl">Descargar informe</button><button class="small-btn" type="button" id="pr">Imprimir o guardar PDF</button><button class="small-btn" type="button" id="tg">Ver detalle de mis respuestas</button><button class="small-btn" type="button" id="retry">Nuevo intento</button></div>
   <div class="rep" id="rep" hidden>${R.head}<h3>Detalle del recorrido</h3>${R.items}</div>`;
  $('#tg').addEventListener('click',()=>{$('#rep').hidden=!$('#rep').hidden});
  $('#pr').addEventListener('click',()=>{$('#rep').hidden=false;window.print()});
  $('#retry').addEventListener('click',()=>location.reload());
  $('#dl').addEventListener('click',()=>{const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
    const doc=`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Informe — ${esc(CASO.titulo)}</title><style>${css}</style></head><body><main class="app ev caso" style="padding:24px">${reportHTML(S,G,false)}</main></body></html>`;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download=`Informe_${(CASO.codigo||'caso')}_${(ST.nombre||'participante').replace(/[^\wÁÉÍÓÚáéíóúñÑ]+/g,'_')}.html`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)});
  S.ids.forEach((id,n)=>{const r=ST.res[id],b=`cmi.interactions.${n}.`;SC.set(b+'id',(CASO.codigo||'C')+'_'+id);SC.set(b+'type',r.abierta?'fill-in':'choice');
    SC.set(b+'student_response',r.ans.replace(/[\r\n]+/g,' ').slice(0,250));if(!r.abierta)SC.set(b+'result',r.pts>=r.max?'correct':'wrong')});
  SC.set('cmi.core.score.min',0);SC.set('cmi.core.score.max',100);SC.set('cmi.core.score.raw',S.pct);SC.set('cmi.core.lesson_status',S.pass?'passed':'failed');SC.set('cmi.core.exit','');SC.commit();
  window.scrollTo({top:0,behavior:'smooth'})}

})();
</script>

</body>
</html>
