<body>

<main class="app ev caso" id="app"></main>
<script>
(function(){
const PASS_PCT=80;
const CASO={
 tipo:'laboratorio',codigo:'M5_LAB',
 curso:'LEGISLACIÓN LABORAL · MÓDULO 5 · EVALUACIÓN · LABORATORIO',
 eyebrow:'Evaluación del módulo 5 · Parte 2',
 titulo:'El finiquito de Andrés',
 contexto:'<p>Horizonte Servicios cerrará su sucursal de Puente Alto por una baja sostenida de clientes. Andrés Vidal, analista contable de esa sucursal, será desvinculado por <b>necesidades de la empresa</b> (art. 161). Camila debe revisar la carta, calcular las indemnizaciones y formalizar el cierre con el finiquito. Semanas después, la <b>Inspección del Trabajo</b> cita a Horizonte para revisar la documentación de los términos de la sucursal: Camila tendrá que demostrar con evidencia coherente que el proceso se hizo bien y proponer qué corregir. Usa el <b>expediente</b> (a la derecha en computador, arriba en celular): tiene todos los datos que necesitas.</p>',
 objetivos:['Distinguir qué indemnizaciones proceden según la causal y la antigüedad.','Calcular la indemnización por años de servicio, la sustitutiva del aviso previo, el feriado proporcional y el total del finiquito, y aplicar los topes de 330 días y de 90 UF.','Revisar la carta de término y ordenar los pasos del cierre.','Formalizar el finiquito: plazo de 10 días hábiles, vía electrónica o presencial y reserva de derechos.','Revisar la coherencia de la documentación ante una fiscalización, reconocer la evidencia que falta y proponer una acción correctiva para el caso y para el proceso.'],
 comoSeEvalua:'el laboratorio tiene 13 tareas. Las tareas de cálculo, clasificación, selección y orden asignan puntaje proporcional a tus aciertos; cada tarea se responde una sola vez y verás de inmediato su retroalimentación. La tarea de desarrollo (la última) no tiene nota automática: verás una respuesta modelo y criterios para revisar la tuya. En los cálculos escribe <b>solo el número</b>, sin puntos de miles si prefieres (por ejemplo, 1380000), y usa coma para decimales. Necesitas <strong>80%</strong> de los puntos para aprobar.',
 tiempo:'30–35 min',resumen:'13 tareas · 29 puntos',
 expedienteTitulo:'Expediente de Andrés Vidal',
 expediente:[
  {titulo:'Ficha de Andrés Vidal',html:'<table><tr><th>Dato</th><th>Valor</th></tr><tr><td>Cargo</td><td>Analista contable, sucursal Puente Alto</td></tr><tr><td>Contrato</td><td>Indefinido, celebrado el 2 de marzo de 2019</td></tr><tr><td>Último día de trabajo (separación)</td><td>Viernes 23 de octubre de 2026</td></tr><tr><td>Última remuneración mensual</td><td>$1.380.000 (bajo el tope de 90 UF, según Remuneraciones)</td></tr><tr><td>Aviso de 30 días</td><td>No se dio</td></tr><tr><td>Licencias médicas o fuero</td><td>No tiene</td></tr></table>'},
  {titulo:'Informe de Remuneraciones',html:'<table><tr><th>Concepto</th><th>Dato</th></tr><tr><td>Remuneración de octubre devengada y no pagada (1 al 23 de octubre)</td><td>$1.058.000</td></tr><tr><td>Horas extraordinarias pendientes</td><td>No registra</td></tr><tr><td>Feriado pendiente de años anteriores</td><td>0 días (ya usado)</td></tr><tr><td>Feriado proporcional a compensar, según el sistema de vacaciones</td><td>9,5 días</td></tr><tr><td>Valor de un día de feriado</td><td>$46.000</td></tr><tr><td>Cotizaciones hasta septiembre</td><td>Pagadas (comprobantes adjuntos)</td></tr></table><p><small>En este laboratorio no se calcula el descuento del aporte del empleador al seguro de cesantía.</small></p>'},
  {titulo:'Borrador de carta de término',html:'<p><i>"Santiago, 23 de octubre de 2026. Señor Andrés Vidal: comunicamos a usted que se pone término a su contrato de trabajo a contar de esta fecha, por la causal del artículo 161 del Código del Trabajo, necesidades de la empresa. Atentamente, Horizonte Servicios."</i></p><p><small>Se entregará personalmente el mismo 23 de octubre.</small></p>'},
  {titulo:'Otras personas con término en octubre',html:'<table><tr><th>Persona</th><th>Causal</th><th>Antigüedad</th></tr><tr><td>Josefa</td><td>Renuncia</td><td>5 años</td></tr><tr><td>Martín</td><td>Vencimiento del plazo</td><td>8 meses</td></tr><tr><td>Fernanda</td><td>Necesidades de la empresa</td><td>10 meses</td></tr><tr><td>Luis</td><td>Mutuo acuerdo con indemnización pactada por escrito</td><td>6 años</td></tr><tr><td>Andrés</td><td>Necesidades de la empresa</td><td>7 años y 7 meses</td></tr></table>'},
  {titulo:'Caso de la gerenta de Finanzas',html:'<p>Paula Contreras, gerenta de Finanzas, será desvinculada por necesidades de la empresa. Contrato celebrado en marzo de 2013: <b>13 años y 7 meses</b> de servicio. Su última remuneración mensual equivale a <b>140 UF</b>.</p>'},
  {titulo:'Reglas de cálculo (arts. 161, 162, 163 y 172)',html:'<p><b>Años de servicio (art. 163):</b> procede con un año o más de contrato y término por art. 161. 30 días de la última remuneración mensual por cada año y fracción superior a seis meses; límite de 330 días (11 años).</p><p><b>Sustitutiva del aviso previo:</b> la última remuneración mensual, si en el art. 161 no se dio el aviso de 30 días.</p><p><b>Tope (art. 172):</b> la remuneración que sirve de base no puede exceder de 90 UF.</p><p><b>Siempre se revisan:</b> remuneraciones pendientes, horas extraordinarias, feriado pendiente y proporcional.</p>'},
  {titulo:'Reglas del finiquito (arts. 63 bis, 169 y 177; Ley 21.361)',html:'<p><b>Plazo:</b> el empleador otorga el finiquito y pone su pago a disposición dentro de 10 días hábiles desde la separación. El plazo obliga al empleador, no a la persona trabajadora. El pago se hace al ratificar.</p><p><b>Formalidad:</b> escrito, firmado por la persona trabajadora y ratificado ante un ministro de fe, o firmado electrónicamente en el sitio de la Dirección del Trabajo.</p><p><b>Vía electrónica:</b> la carta de término indica si el finiquito será electrónico o presencial e informa que aceptar la vía electrónica es voluntario. La persona puede aceptarla, aceptarla con reserva de derechos o rechazarla; si la rechaza, se le ofrece el finiquito presencial.</p><p><b>Reserva de derechos:</b> el poder liberatorio del finiquito no alcanza a las materias que la persona se reservó.</p><p><b>Cuotas:</b> la regla es pagar todo en un solo acto. Solo por acuerdo de las partes, con intereses y reajustes, y ratificado ante la Inspección del Trabajo.</p>'},
  {titulo:'Citación de la Inspección del Trabajo (1 de diciembre)',html:'<p>A raíz de una denuncia, la Inspección del Trabajo cita a Horizonte Servicios para el <b>martes 15 de diciembre</b>, con el fin de revisar la documentación de los términos de contrato de la sucursal de Puente Alto y la documentación del personal vigente.</p>'},
  {titulo:'Carpeta reunida por la sucursal para la citación',html:'<table><tr><th>Documento</th><th>Estado en la carpeta</th></tr><tr><td>Carta de término de Andrés</td><td>Entregada personalmente el 23 de octubre; explica el cierre de la sucursal, informa las cotizaciones pagadas hasta septiembre e indica el monto total. Comprobante de la copia electrónica a la Inspección del 26 de octubre.</td></tr><tr><td>Comprobantes de cotizaciones de Andrés</td><td>Pagadas hasta septiembre, adjuntos a la carta.</td></tr><tr><td>Finiquito de Andrés</td><td>Firmado electrónicamente en el sitio de la Dirección del Trabajo el 4 de noviembre, con reserva de derechos sobre la causal. Pago transferido ese día.</td></tr><tr><td>Antecedentes de la baja de clientes que funda el cierre</td><td>No están en la carpeta. La gerencia dice: "todos lo saben".</td></tr><tr><td>Motivo por el que se postergó la comunicación a Carla</td><td>No hay registro: se conversó de palabra.</td></tr><tr><td>Contrato de Andrés y anexos</td><td>Último anexo de remuneración: marzo de 2023, $1.150.000. Las liquidaciones de 2026 pagan $1.380.000.</td></tr></table>'}
 ],
 competencias:[
  {id:'proc',nombre:'Qué procede según la causal',fortaleza:'distingues qué indemnizaciones activa cada causal y qué se revisa siempre.',mejora:'repasa cuándo procede la indemnización por años de servicio y qué pagos se revisan en cualquier término.',repasar:'Lección 5.5'},
  {id:'calc',nombre:'Cálculo de indemnizaciones y finiquito',fortaleza:'calculas correctamente años computables, topes y totales.',mejora:'repasa la regla de la fracción superior a seis meses, el límite de 330 días y el tope de 90 UF.',repasar:'Lección 5.5'},
  {id:'com',nombre:'Comunicación y cierre del término',fortaleza:'revisas la carta y ordenas los pasos del cierre con sus plazos.',mejora:'repasa las menciones de la carta, los plazos del art. 162 y la licencia médica en el art. 161.',repasar:'Lecciones 5.3 y 5.4'},
  {id:'fini',nombre:'Formalizar el cierre con el finiquito',fortaleza:'distingues la carta del finiquito y aplicas su plazo, sus vías y la reserva de derechos.',mejora:'repasa el plazo de 10 días hábiles (que obliga al empleador), el finiquito electrónico voluntario, la reserva de derechos y el pago en cuotas.',repasar:'Lección 5.6'},
  {id:'cumpl',nombre:'Evidencia, fiscalización y corrección',fortaleza:'revisas la coherencia de la documentación, reconoces lo que falta sin fabricarlo y propones corregir el caso y el proceso.',mejora:'repasa qué documentos puede requerir la Inspección, por qué no se construyen documentos al llegar una citación, la rebaja de la multa por corrección y la diferencia entre corregir el caso y la causa.',repasar:'Lecciones 5.7, 5.8 y 5.9'}
 ],
 inicio:'t1',
 etapas:[
  {id:'t1',tipo:'clasificar',titulo:'¿Procede la indemnización por años de servicio?',corto:'Qué procede',competencia:'proc',pts:3,
   escena:'<p>Antes de calcular, Camila revisa la tabla <b>Otras personas con término en octubre</b> del expediente.</p>',
   pregunta:'Clasifica a cada persona según si le corresponde indemnización por años de servicio.',
   categorias:['Procede por ley','No procede','Procede solo por pacto'],
   items:[
    {texto:'Josefa — renuncia, 5 años',cat:1,fb:'La renuncia no genera indemnización legal por años de servicio.'},
    {texto:'Martín — vencimiento del plazo, 8 meses',cat:1,fb:'El vencimiento del plazo no genera indemnización por años de servicio.'},
    {texto:'Fernanda — necesidades de la empresa, 10 meses',cat:1,fb:'Aunque la causal es el art. 161, la indemnización exige que el contrato haya estado vigente un año o más.'},
    {texto:'Luis — mutuo acuerdo con indemnización pactada, 6 años',cat:2,fb:'El mutuo acuerdo no genera indemnización legal; aquí se paga porque las partes la pactaron.'},
    {texto:'Andrés — necesidades de la empresa, 7 años y 7 meses',cat:0,fb:'Art. 161 con más de un año de servicio: procede la indemnización del art. 163.'}],
   fb:'Primero la causal, después el cálculo: la indemnización legal por años de servicio procede en el art. 161 con un año o más de contrato (o si un tribunal declara el despido injustificado, indebido o improcedente).',siguiente:'t2'},
  {id:'t2',tipo:'numero',titulo:'Indemnización por años de servicio de Andrés',corto:'Años de servicio',competencia:'calc',pts:3,
   escena:'<p>Usa la <b>ficha de Andrés</b> y las <b>reglas de cálculo</b> del expediente.</p>',
   pregunta:'Calcula la indemnización por años de servicio de Andrés.',
   campos:[
    {label:'Años de servicio computables',valor:8,tol:0,unidad:'años'},
    {label:'Días de indemnización',valor:240,tol:0,unidad:'días'},
    {label:'Monto de la indemnización ($)',valor:11040000,tol:1000,unidad:'$'}],
   solucion:'Del 2 de marzo de 2019 al 23 de octubre de 2026 hay 7 años, 7 meses y 21 días. La fracción (7 meses) es superior a seis meses, así que se cuentan <b>8 años</b>. 8 × 30 días = <b>240 días</b> (bajo el límite de 330). Como cada 30 días equivalen a una remuneración mensual: 8 × $1.380.000 = <b>$11.040.000</b>. La remuneración está bajo el tope de 90 UF, por lo que no se limita.',siguiente:'t3'},
  {id:'t3',tipo:'numero',titulo:'Aviso previo, feriado y total del finiquito',corto:'Aviso, feriado y total',competencia:'calc',pts:3,
   escena:'<p>Revisa en la ficha si se dio el aviso de 30 días y, en el <b>informe de Remuneraciones</b>, los datos de feriado y la remuneración pendiente.</p>',
   pregunta:'Calcula los dos montos y el total a pagar en el finiquito de Andrés (sin considerar el descuento del seguro de cesantía).',
   campos:[
    {label:'Indemnización sustitutiva del aviso previo ($)',valor:1380000,tol:1000,unidad:'$'},
    {label:'Feriado proporcional ($)',valor:437000,tol:1000,unidad:'$'},
    {label:'Total del finiquito ($)',valor:13915000,tol:1000,unidad:'$'}],
   solucion:'No se dio el aviso de 30 días, así que corresponde la indemnización sustitutiva, equivalente a la última remuneración mensual: <b>$1.380.000</b>. Feriado proporcional: 9,5 días × $46.000 = <b>$437.000</b> (el feriado se compensa en cualquier causal de término). Total: años de servicio $11.040.000 + sustitutiva $1.380.000 + remuneración de octubre pendiente $1.058.000 + feriado proporcional $437.000 = <b>$13.915.000</b>. No hay horas extraordinarias ni feriado pendiente de años anteriores. Como regla general, en el art. 161 el empleador puede descontar de la indemnización por años de servicio el aporte que hizo a la cuenta individual del seguro de cesantía (aquí no se calcula).',siguiente:'t4'},
  {id:'t4',tipo:'numero',titulo:'Los topes, en UF: la gerenta de Finanzas',corto:'Topes en UF',competencia:'calc',pts:3,
   escena:'<p>Revisa el <b>caso de la gerenta de Finanzas</b>. Trabaja todo en UF: no necesitas convertir a pesos.</p>',
   pregunta:'Aplica los dos topes y calcula su indemnización por años de servicio en UF.',
   campos:[
    {label:'Base mensual de cálculo (UF)',valor:90,tol:0,unidad:'UF'},
    {label:'Años computables, con el límite legal',valor:11,tol:0,unidad:'años'},
    {label:'Indemnización por años de servicio (UF)',valor:990,tol:0,unidad:'UF'}],
   solucion:'Su remuneración (140 UF) supera el tope, así que la base es <b>90 UF</b> (art. 172). Tiene 13 años y 7 meses (14 años computables), pero el límite es de 330 días, es decir, <b>11 años</b> (contrato posterior al 14 de agosto de 1981). Indemnización: 11 × 90 UF = <b>990 UF</b>, que se convierten a pesos con el valor de la UF del último día del mes anterior al pago.',siguiente:'t5'},
  {id:'t5',tipo:'multi',titulo:'Revisar la carta de Andrés',corto:'Revisar la carta',competencia:'com',pts:2,
   escena:'<p>Lee el <b>borrador de carta de término</b> del expediente.</p>',
   pregunta:'Marca todas las correcciones que necesita la carta.',
   items:[
    {texto:'Explicar los hechos: el cierre de la sucursal de Puente Alto por la baja sostenida de clientes y la supresión de su cargo.',ok:true,fb:'En juicio, la empresa no puede alegar hechos distintos de los señalados en la carta.'},
    {texto:'Informar el estado de pago de las cotizaciones hasta septiembre y adjuntar los comprobantes.',ok:true,fb:'Es una mención obligatoria del art. 162.'},
    {texto:'Indicar el monto total a pagar, porque no se dio el aviso de 30 días.',ok:true,fb:'En el art. 161 sin aviso previo, la carta indica el monto total a pagar.'},
    {texto:'Indicar si el finiquito se otorgará en forma electrónica o presencial, e informar que aceptar la vía electrónica es voluntario.',ok:true,fb:'Ley 21.361: la carta de término debe indicar la vía del finiquito.'},
    {texto:'Agregar la firma de un notario para que la carta sea válida.',ok:false,fb:'La carta no requiere notario. Lo que se ratifica ante un ministro de fe es el finiquito.'},
    {texto:'Cambiar la causal a "desahucio", porque Andrés es analista.',ok:false,fb:'El desahucio procede solo para gerentes, subgerentes, agentes o apoderados con facultades generales de administración, cargos de exclusiva confianza y trabajadoras/es de casa particular.'}],
   fb:'Cada respuesta incorrecta descuenta un acierto.',siguiente:'t6'},
  {id:'t6',tipo:'decision',titulo:'Otra persona de la sucursal',corto:'Licencia médica',competencia:'com',
   escena:'<p>La jefatura de la sucursal agrega a la nómina a <b>Carla</b>, asistente administrativa de Puente Alto, cuyo cargo también desaparece con el cierre. Carla está con <b>licencia médica</b> hasta el 5 de noviembre. La jefatura dice: <i>"La decisión ya está tomada; entreguémosle la carta junto con la de Andrés."</i></p>',
   pregunta:'¿Qué hace Camila?',
   ideal:'postergar la comunicación a Carla: no puede invocarse el art. 161 respecto de una persona con licencia médica; cuando termine la licencia se revisa su situación, con fechas y cálculos propios.',
   opciones:[
    {texto:'Entregarle la carta junto con la de Andrés, como pide la jefatura.',pts:0,fb:'No puede invocarse el art. 161 respecto de una persona con licencia médica.',siguiente:'t7'},
    {texto:'Cambiar la causal a incumplimiento grave (art. 160 N°7) para no esperar.',pts:0,fb:'La causal se elige según los hechos reales: no hay incumplimiento alguno. Si un tribunal declara injustificado un despido por art. 160, el recargo es de 80%, y hasta 100% sin motivo plausible.',siguiente:'t7'},
    {texto:'Postergar la comunicación a Carla hasta que termine su licencia y, entonces, revisar su situación con fechas y cálculos propios.',pts:2,fb:'Correcto: mientras dure la licencia médica no puede invocarse el art. 161. Cuando se defina la fecha de separación de Carla, se calculan su remuneración pendiente y su feriado proporcional, y se revisan las cotizaciones del mes anterior.',siguiente:'t7'},
    {texto:'Postergar la entrega a Carla, sin dejar registro del motivo.',pts:1,fb:'Postergar es correcto, pero conviene dejar registro de por qué cambió la fecha: forma parte de la evidencia del proceso.',siguiente:'t7'}]},
  {id:'t7',tipo:'ordenar',titulo:'Los pasos del cierre',corto:'Ordenar el cierre',competencia:'com',pts:2,
   escena:'<p>Camila vuelve al cierre de Andrés. Ordena los pasos para que sea correcto.</p>',
   pregunta:'Asigna a cada paso su posición (1º = primero).',
   items:[
    {texto:'Verificar la causal y los hechos que la sostienen (cierre de la sucursal).',fb:'La causal se define antes de todo lo demás.'},
    {texto:'Confirmar que las cotizaciones hasta el mes anterior estén pagadas y reunir los comprobantes.',fb:'Sin cotizaciones pagadas, el despido no pone término al contrato.'},
    {texto:'Entregar la carta (dentro de 3 días hábiles desde la separación) y enviar copia a la Inspección en el mismo plazo.',fb:'Art. 162.'},
    {texto:'Poner el finiquito a disposición dentro de 10 días hábiles desde la separación.',fb:'Art. 177.'},
    {texto:'Pagar al ratificar el finiquito ante un ministro de fe o firmarlo electrónicamente en la Dirección del Trabajo.',fb:'El pago se hace al ratificar.'}],
   fb:'Causal y hechos → cotizaciones → carta y copia → finiquito en 10 días hábiles → ratificación y pago.',siguiente:'t8'},
  {id:'t8',tipo:'multi',titulo:'"La carta ya cerró todo"',corto:'Finiquito: plazo y vías',competencia:'fini',pts:2,
   escena:'<p>Entregada la carta, la gerencia comenta: <i>"La carta ya dice cuánto le pagamos a Andrés, así que el finiquito lo vemos en diciembre. Y si quiere, le pagamos en tres cuotas; lo conversamos de palabra."</i> Revisa las <b>reglas del finiquito</b> del expediente.</p>',
   pregunta:'Marca todas las afirmaciones correctas sobre el finiquito de Andrés.',
   items:[

const SC=(function(){
  function find(w){let n=0;try{while(w&&!w.API&&w.parent&&w.parent!==w&&n<10){w=w.parent;n++}return w&&w.API?w.API:null}catch(e){return null}}
  let api=find(window);if(!api){try{if(window.opener)api=find(window.opener)}catch(e){}}
  let ok=false,fin=false;if(api){try{ok=String(api.LMSInitialize(''))==='true'}catch(e){}}
  const set=(k,v)=>{try{if(ok&&!fin)api.LMSSetValue(k,String(v))}catch(e){}};
  const get=k=>{try{return ok?String(api.LMSGetValue(k)||''):''}catch(e){return ''}};
  const commit=()=>{try{if(ok&&!fin)api.LMSCommit('')}catch(e){}};
  const finish=()=>{if(!ok||fin)return;try{api.LMSCommit('');api.LMSFinish('')}catch(e){}fin=true};
  if(ok){const st=get('cmi.core.lesson_status');if(st===''||st==='not attempted')set('cmi.core.lesson_status','incomplete');commit()}
  const T0=Date.now();
  window.addEventListener('pagehide',()=>{if(!ok||fin)return;const s=Math.round((Date.now()-T0)/1000),p=n=>String(n).padStart(2,'0');
    set('cmi.core.session_time',`${String(Math.floor(s/3600)).padStart(4,'0')}:${p(Math.floor(s/60)%60)}:${p(s%60)}.00`);finish()});
  return {ok,set,get,commit}})();

    fb('good',`<strong>Respuesta registrada.</strong> <span class="fb-body">Compárala con la respuesta modelo y marca los criterios que cumple tu respuesta.</span>
     <div class="model"><b>Respuesta modelo:</b> ${e.modelo}</div><div class="crit">${e.criterios.map((c,i)=>`<label><input type="checkbox" data-c="${i}"/> <span>${c}</span></label>`).join('')}</div>`);
    ST.res[e.id]={pts:0,max:0,ans,fb:e.modelo,crit:e.criterios.map(c=>({c,ok:false})),abierta:true};
    $$('.crit input',nd).forEach(x=>x.addEventListener('change',()=>{ST.res[e.id].crit[+x.dataset.c].ok=x.checked}))}
  else if(e.tipo==='multi'){const sel=$$('input',nd).map(x=>x.checked),nOk=e.items.filter(i=>i.ok).length;let hit=0,miss=0;
    $$('.chkgrid label',nd).forEach((l,i)=>{const it=e.items[i],c=sel[i];$('input',l).disabled=true;l.classList.add(c&&it.ok?'good':c&&!it.ok?'bad':!c&&it.ok?'miss':'x');if(c&&it.ok)hit++;if(c&&!it.ok)miss++});
    pts=Math.max(0,m*(hit-miss)/nOk);ans=e.items.filter((_,i)=>sel[i]).map(i=>i.texto.replace(/<[^>]+>/g,'')).join(' | ');
    det=e.items.map((it,i)=>`${it.ok?'✔':'✘'} ${it.texto}${it.fb?': '+it.fb:''}`).join('<br/>');
    fb(pts>=m?'good':pts>0?'warn':'bad',`<strong>${fmt(pts)} de ${fmt(m)} puntos.</strong> <span class="fb-body">${e.fb?e.fb+'<br/>':''}${det}</span>`);ST.res[e.id]={pts,max:m,ans,fb:(e.fb||'')+' '+det}}
  else if(['clasificar','ordenar'].includes(e.tipo)){let ok=0;const ss=$$('select',nd),parts=[];
    ss.forEach(s=>{const i=+s.dataset.i,it=e.items[i],good=e.tipo==='ordenar'?+s.value===i:+s.value===it.cat;s.disabled=true;s.classList.add(good?'good':'bad');if(good)ok++;
      const w=s.parentElement.querySelector('.why');const right=e.tipo==='ordenar'?`${i+1}º`:e.categorias[it.cat];w.hidden=false;w.innerHTML=`${good?'✔':'✘ Correcto: <b>'+esc(right)+'</b>.'} ${it.fb||''}`;
      parts.push(`${it.texto.replace(/<[^>]+>/g,'')} → ${e.tipo==='ordenar'?(+s.value+1)+'º':e.categorias[+s.value]}`)});
    pts=m*ok/e.items.length;ans=parts.join(' | ');fb(pts>=m?'good':pts>0?'warn':'bad',`<strong>${ok} de ${e.items.length} correctas · ${fmt(pts)} de ${fmt(m)} puntos.</strong> <span class="fb-body">${e.fb||''}</span>`);
    ST.res[e.id]={pts,max:m,ans,fb:e.fb||''}}
  else if(e.tipo==='numero'){let ok=0;const ii=$$('input',nd),parts=[];
    ii.forEach((x,i)=>{const c=e.campos[i],v=num(x.value),good=!isNaN(v)&&Math.abs(v-c.valor)<=(c.tol||0);x.disabled=true;x.classList.add(good?'good':'bad');if(good)ok++;parts.push(`${c.label.replace(/<[^>]+>/g,'')}: ${x.value}`)});
    pts=m*ok/e.campos.length;ans=parts.join(' | ');fb(pts>=m?'good':pts>0?'warn':'bad',`<strong>${ok} de ${e.campos.length} correctas · ${fmt(pts)} de ${fmt(m)} puntos.</strong> <span class="fb-body">${e.solucion||''}</span>`);
    ST.res[e.id]={pts,max:m,ans,fb:e.solucion||''}}
  ST.res[e.id].titulo=e.titulo;ST.res[e.id].comp=e.competencia;ST.res[e.id].tipo=e.tipo;ST.res[e.id].pregunta=(e.pregunta||e.consigna||'').replace(/<[^>]+>/g,'');
  if(e.siguiente===undefined&&e.tipo!=='decision')$('#next').textContent='Ver resultado →';
  if(e.tipo==='decision'&&!ST.res[e.id].next)$('#next').textContent='Ver resultado →';
  drawPath()}
function summary(){const ids=ST.ruta.filter(id=>ST.res[id]);const g=ids.filter(id=>ST.res[id].max>0);
  const pts=g.reduce((a,id)=>a+ST.res[id].pts,0),max=g.reduce((a,id)=>a+ST.res[id].max,0),pct=max?Math.round(pts/max*100):100;
  const cs={};g.forEach(id=>{const r=ST.res[id],k=r.comp||'_';cs[k]=cs[k]||{p:0,m:0};cs[k].p+=r.pts;cs[k].m+=r.max});
  return {ids,pts,max,pct,pass:pct>=PASS_PCT,cs}}
function globalFb(S){const fu=[],me=[];Object.entries(S.cs).forEach(([k,v])=>{const c=COMP[k];if(!c)return;const p=Math.round(v.p/v.m*100);
  (p>=80?fu:me).push(p>=80?`<li><b>${esc(c.nombre)}</b> (${p}%): ${c.fortaleza||'aplicaste correctamente los criterios.'}</li>`:`<li><b>${esc(c.nombre)}</b> (${p}%): ${c.mejora||'repasa los contenidos asociados.'}${c.repasar?` <i>Repasa: ${esc(c.repasar)}.</i>`:''}</li>`)});
  const ab=S.ids.filter(id=>ST.res[id].abierta),cc=ab.reduce((a,id)=>a+ST.res[id].crit.filter(x=>x.ok).length,0),ct=ab.reduce((a,id)=>a+ST.res[id].crit.length,0);
  return {fu,me,ab:ab.length,txt:ct?`En tus respuestas de desarrollo marcaste ${cc} de ${ct} criterios cumplidos.`:''}}
function reportHTML(S,G,full){const fecha=new Date().toLocaleString('es-CL');
  const items=S.ids.map((id,i)=>{const r=ST.res[id];return `<div class="ritem"><h4>${i+1}. ${esc(r.titulo)}${r.max?` · ${fmt(r.pts)} / ${fmt(r.max)} pts`:' · desarrollo'}</h4>${r.pregunta?`<div><i>${esc(r.pregunta)}</i></div>`:''}<div class="ans">${esc(r.ans)}</div>
    ${r.abierta?`<div><b>Respuesta modelo:</b> ${r.fb}</div><div><b>Autoevaluación:</b><br/>${r.crit.map(x=>`${x.ok?'☑':'☐'} ${esc(x.c)}`).join('<br/>')}</div>`:`<div><b>Retroalimentación:</b> ${r.fb}</div>`}</div>`}).join('');
  const comp=Object.entries(S.cs).filter(([k])=>COMP[k]).map(([k,v])=>{const p=Math.round(v.p/v.m*100);return `<div class="comp"><span>${esc(COMP[k].nombre)}</span><span class="bar"><i style="width:${p}%"></i></span><b>${p}%</b></div>`}).join('');
  const head=`<h2 style="margin:.2em 0">${esc(CASO.titulo)}</h2><p><b>Participante:</b> ${esc(ST.nombre||'(sin nombre)')} · <b>Fecha:</b> ${fecha}<br/><b>Puntaje:</b> ${fmt(S.pts)} / ${fmt(S.max)} (${S.pct}%) · <b>Estado:</b> ${S.pass?'Aprobado':'No aprobado'} (mínimo ${PASS_PCT}%)</p>`;
  const glob=`<div class="glob"><div><h3>Fortalezas</h3><ul>${G.fu.join('')||'<li>Aún no hay competencias sobre 80%.</li>'}</ul></div><div><h3>Aspectos a mejorar</h3><ul>${G.me.join('')||'<li>No hay competencias bajo 80%. ¡Buen trabajo!</li>'}</ul></div></div>${G.txt?`<p>${G.txt}</p>`:''}`;
  return full?{head,comp,glob,items}:head+comp+glob+'<h3>Detalle del recorrido</h3>'+items}
function result(){const S=summary(),G=globalFb(S),R=reportHTML(S,G,true);$('#work').hidden=true;const box=$('#result');box.hidden=false;
  box.innerHTML=`<div class="score"><div class="ring" style="background:conic-gradient(${S.pass?'var(--good-line)':'var(--bad-line)'} ${S.pct*3.6}deg,var(--track) 0)"><span style="background:var(--surface);width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem">${S.pct}%</span></div>
   <div><span class="eyebrow">Resultado · ${esc(CASO.eyebrow||'')}</span><h2>${S.pass?'¡Aprobado!':'Aún no alcanzas el mínimo'}</h2><p><b>Puntaje: ${fmt(S.pts)} / ${fmt(S.max)}</b></p><p>${S.pass?`Superaste el ${PASS_PCT}% requerido.`:`Necesitas al menos ${PASS_PCT}% para aprobar. Revisa la retroalimentación, repasa lo indicado e inténtalo de nuevo.`}</p></div></div>
   <h3 style="margin-top:18px">Retroalimentación global</h3>${R.comp}${R.glob}${CASO.cierre?`<div class="callout" style="margin-top:12px">${CASO.cierre}</div>`:''}
   <div class="completion-actions noprint" style="justify-content:flex-start;flex-wrap:wrap"><button class="small-btn primary" type="button" id="dl">Descargar informe</button><button class="small-btn" type="button" id="pr">Imprimir o guardar PDF</button><button class="small-btn" type="button" id="tg">Ver detalle de mis respuestas</button><button class="small-btn" type="button" id="retry">Nuevo intento</button></div>
   <div class="rep" id="rep" hidden>${R.head}<h3>Detalle del recorrido</h3>${R.items}</div>`;
  $('#tg').addEventListener('click',()=>{$('#rep').hidden=!$('#rep').hidden});
  $('#pr').addEventListener('click',()=>{$('#rep').hidden=false;window.print()});
  $('#retry').addEventListener('click',()=>location.reload());
  $('#dl').addEventListener('click',()=>{const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
    const doc=`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Informe — ${esc(CASO.titulo)}</title><style>${css}</style></head><body><main class="app ev caso" style="padding:24px">${reportHTML(S,G,false)}</main></body></html>`;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download=`Informe_${(CASO.codigo||'caso')}_${(ST.nombre||'participante').replace(/[^\wÁÉÍÓÚáéíóúñÑ]+/g,'_')}.html`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)});
  S.ids.forEach((id,n)=>{const r=ST.res[id],b=`cmi.interactions.${n}.`;SC.set(b+'id',(CASO.codigo||'C')+'_'+id);SC.set(b+'type',r.abierta?'fill-in':'choice');
    SC.set(b+'student_response',r.ans.replace(/[\r\n]+/g,' ').slice(0,250));if(!r.abierta)SC.set(b+'result',r.pts>=r.max?'correct':'wrong')});
  SC.set('cmi.core.score.min',0);SC.set('cmi.core.score.max',100);SC.set('cmi.core.score.raw',S.pct);SC.set('cmi.core.lesson_status',S.pass?'passed':'failed');SC.set('cmi.core.exit','');SC.commit();
  window.scrollTo({top:0,behavior:'smooth'})}

})();
</script>
