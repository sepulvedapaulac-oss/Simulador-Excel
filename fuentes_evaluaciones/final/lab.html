<script>
(function(){
const PASS_PCT=80;
const CASO={
 tipo:'laboratorio',codigo:'EF_CI',
 curso:'LEGISLACIÓN LABORAL · EVALUACIÓN FINAL · CASO INTEGRADOR',
 eyebrow:'Evaluación final · Parte 2',
 titulo:'El caso de Javier en Soporte',
 contexto:'<p>Octubre de 2026. Javier Muñoz, técnico del área de Soporte de Horizonte Servicios, llega al Equipo de Personas con un reclamo: en septiembre se quedó varias tardes después de su horario, a pedido de su supervisor, y no se las pagaron. En las semanas siguientes el caso crece: Javier pide un ajuste de horario para llevar a su hija al colegio, denuncia a su supervisor, la empresa debe decidir el término de un contrato y, al final, la Inspección del Trabajo cita a Horizonte para revisar la documentación del área.</p><p>Acompaña a Camila de principio a fin. En cada etapa debes decidir <b>qué norma aplica</b>, <b>a qué organismo recurrir</b>, <b>calcular</b>, <b>comunicar</b>, <b>documentar</b> y <b>corregir</b>. Algunas decisiones <b>cambian el rumbo del caso</b>: si eliges mal, aparecerá una escena en la que tendrás que corregir el rumbo.</p><p>Usa el <b>expediente</b> (a la derecha en computador, abajo en celular): ahí están todos los documentos y datos que necesitas.</p>',
 objetivos:['<b>Aplicar</b> la ruta de análisis, la irrenunciabilidad y el criterio para elegir el organismo competente (módulo 1).','<b>Calcular</b> horas extraordinarias y revisar un pacto de horas extra y el registro de asistencia (módulo 2).','<b>Resolver</b> una solicitud de conciliación y proteger los derechos fundamentales de quien reclama (módulo 3).','<b>Clasificar</b> conductas, recibir una denuncia y adoptar medidas de resguardo según la Ley Karin (módulo 4).','<b>Decidir</b> la causal de término, revisar sus requisitos, calcular el finiquito y responder a una fiscalización con evidencia coherente, corrigiendo el caso y su causa (módulo 5).'],
 comoSeEvalua:'el caso tiene 19 etapas. Cada decisión y cada tarea se responde una sola vez y verás de inmediato su consecuencia y la explicación. Las tareas de ordenar, clasificar, seleccionar y calcular dan puntaje proporcional a tus aciertos (en la selección múltiple, cada marca incorrecta descuenta un acierto). Las 3 respuestas de desarrollo no tienen nota automática: verás una respuesta modelo y criterios para revisar la tuya. En los cálculos escribe <b>solo el número</b> (por ejemplo, 68250 o 68.250) y usa coma para los decimales (por ejemplo, 6,5). Todos los recorridos tienen el mismo puntaje máximo: <b>37 puntos</b>. Necesitas <strong>80%</strong> para aprobar.',
 tiempo:'60–70 min',resumen:'19 etapas · 37 puntos · 3 respuestas de desarrollo',
 expedienteTitulo:'Expediente del caso',
 expediente:[
  {titulo:'1 · Ficha de Javier Muñoz',html:'<table><tr><th>Dato</th><th>Valor</th></tr><tr><td>Cargo</td><td>Técnico de soporte, área de Soporte (Santiago)</td></tr><tr><td>Contrato</td><td>Indefinido, desde el 1 de marzo de 2021</td></tr><tr><td>Jornada</td><td>42 horas semanales, lunes a viernes, 08:30 a 17:39 (colación de 13:30 a 14:15, no imputable a la jornada)</td></tr><tr><td>Sueldo mensual</td><td>$1.260.000</td></tr><tr><td>Supervisor directo</td><td>Mauricio Lagos</td></tr><tr><td>Familia</td><td>Tiene el cuidado personal de su hija Amanda, de 10 años</td></tr></table>'},
  {titulo:'2 · Correo de Mauricio Lagos (lunes 5 de octubre)',html:'<p><i>"Camila: Javier reclama horas extra de septiembre. En Soporte siempre lo hemos hecho así: el sobretiempo se compensa saliendo antes otro día, como dice nuestro procedimiento interno del área. Además, en agosto Javier firmó esto:"</i></p><p style="border-left:3px solid var(--line);padding-left:10px"><i>"Yo, Javier Muñoz, renuncio al pago de horas extraordinarias a cambio de poder salir antes cuando haya poca carga de trabajo. Firma: J. Muñoz."</i></p><p><i>"Así que no hay nada que pagar. Mauricio."</i></p>'},
  {titulo:'3 · Registro de asistencia de Javier (septiembre de 2026)',html:'<p>Sistema electrónico de registro de asistencia. Horario de salida pactado: <b>17:39</b>. Se muestran los días en que la salida fue posterior; el resto del mes la salida coincide con el horario.</p><table><tr><th>Día</th><th>Entrada</th><th>Salida</th></tr><tr><td>Lunes 7</td><td>08:28</td><td>19:09</td></tr><tr><td>Miércoles 9</td><td>08:30</td><td>19:39</td></tr><tr><td>Martes 15</td><td>08:29</td><td>18:39</td></tr><tr><td>Jueves 24</td><td>08:30</td><td>19:39</td></tr></table><p>Adjuntos: correos de Mauricio de esos cuatro días (16:50 aprox.): <i>"Javier, quédate hasta terminar la migración del cliente"</i>. No hay pacto escrito de horas extraordinarias ni días libres otorgados en compensación.</p>'},
  {titulo:'4 · Propuesta de Mauricio para octubre a marzo',html:'<p><i>"Para el cierre de proyectos, propongo que Javier se quede 3 horas diarias de octubre a marzo. Lo conversamos de palabra, no hace falta firmar nada. Para que el sistema no muestre tanto sobretiempo, que marque su salida a las 17:39 y siga trabajando; yo anoto sus horas en nuestro grupo de WhatsApp. Si alguien reclama, le pagamos con un recargo de 30% o lo dejamos salir antes otro día."</i></p>'},
  {titulo:'5 · Solicitud escrita de Javier (miércoles 7 de octubre)',html:'<p><i>"Camila: tengo el cuidado personal de mi hija Amanda, de 10 años, y desde noviembre debo dejarla en el colegio a las 08:15. Solicito iniciar mi jornada a las 09:30 y terminarla a las 18:39, sin cambiar mis funciones. Adjunto su certificado de nacimiento."</i></p><p><b>Respuesta de Mauricio (copiada a Camila):</b> <i>"Esto es un favor. Si quiere entrar a las 09:30, se le descuenta la hora, o la paga con días de vacaciones."</i></p><p><small>Horario de atención del área de Soporte: lunes a viernes, de 08:00 a 20:00.</small></p>'},
  {titulo:'6 · Relato de Javier (lunes 19 de octubre, en la oficina de Personas)',html:'<p><i>"Desde que reclamé las horas y pedí el cambio de horario, todo cambió. El lunes 12, en la reunión semanal, Mauricio dijo frente a todo el equipo: \'Aquí llegó el papá que entra tarde; si no le gusta, que se busque otra pega\', y todos se rieron. Me sacó del grupo de WhatsApp donde se reparten los tickets y ahora me asigna solo las rutas más lejanas. Quiero denunciarlo, pero no traigo nada escrito."</i></p><p><i>"También quiero contarte otras cosas de estas semanas: el jueves 15 un cliente me insultó y amenazó en su oficina porque la reparación no quedó lista. El martes discutí con Elena, mi compañera, por quién tomaba un ticket urgente; los dos alzamos la voz, pero sin insultos. Y el viernes Mauricio me pidió, en privado y con respeto, corregir un informe técnico que tenía errores."</i></p><p><small>Mauricio Lagos es supervisor del área de Soporte: no tiene facultades de representación ni de administración de la empresa.</small></p>'},
  {titulo:'7 · Ficha de Mauricio Lagos e informe de Remuneraciones',html:'<table><tr><th>Dato</th><th>Valor</th></tr><tr><td>Cargo</td><td>Supervisor del área de Soporte</td></tr><tr><td>Contrato</td><td>Indefinido, desde el 4 de mayo de 2019</td></tr><tr><td>Fecha de separación prevista</td><td>Viernes 15 de enero de 2027</td></tr><tr><td>Última remuneración mensual</td><td>$2.100.000 (bajo el tope de 90 UF, según Remuneraciones)</td></tr><tr><td>Remuneración de enero devengada y no pagada (1 al 15 de enero)</td><td>$1.050.000</td></tr><tr><td>Horas extraordinarias pendientes</td><td>No registra</td></tr><tr><td>Feriado pendiente de períodos anteriores</td><td>0 días (ya usado)</td></tr><tr><td>Feriado proporcional, según el sistema de vacaciones</td><td>10,5 días</td></tr><tr><td>Valor de un día de feriado</td><td>$70.000</td></tr></table><p><small>Reglamento interno de Horizonte: sanciones de amonestación verbal o escrita, multa de hasta 25% de la remuneración diaria y término del contrato por una causal del art. 160 cuando corresponda.</small></p>'},
  {titulo:'8 · Guía de cálculo',html:'<p><b>Valor de la hora extraordinaria (fórmula DT, sueldo mensual):</b> (sueldo ÷ 30 × 28) ÷ (horas semanales × 4) × 1,5. El recargo legal mínimo es 50%.</p><p><b>Indemnización por años de servicio (art. 163):</b> 30 días de la última remuneración mensual por cada año de servicio y fracción superior a seis meses, con un límite de 330 días; procede en el art. 161 con un año o más de contrato, o si un tribunal declara el despido injustificado, indebido o improcedente. Base con tope de 90 UF (art. 172).</p><p><b>Recargos si un tribunal acoge la demanda (art. 168):</b> 30% (art. 161 improcedente), 50% (art. 159 indebido), 80% (art. 160 injustificado) y hasta 100% (art. 160 sin motivo plausible).</p><p><b>Multas administrativas sin sanción especial (art. 506), según el tamaño de la empresa:</b> pequeña, de 1 a 10 UTM; mediana, de 2 a 40 UTM; grande, de 3 a 60 UTM. Si la empresa corrige la infracción dentro de los 15 días siguientes a la notificación, la multa se rebaja a lo menos en 50% (art. 511).</p>'},
  {titulo:'9 · Citación de la Inspección y revisión de la carpeta de Soporte (febrero de 2027)',html:'<p><b>Citación:</b> a raíz de una denuncia de dos técnicos de Soporte por horas extraordinarias impagas, la Inspección del Trabajo cita a Horizonte Servicios (<b>mediana empresa</b>) para el miércoles 3 de marzo de 2027. Pide los contratos y anexos, el registro de asistencia y las liquidaciones del área de octubre a diciembre de 2026, los pactos de horas extraordinarias y los antecedentes del término del contrato de Mauricio Lagos.</p><p><b>Notas de Camila al revisar la carpeta:</b></p><table><tr><th>Antecedente</th><th>Lo que encontró</th></tr><tr><td>Pacto de horas extra de Javier</td><td>Firmado el 2 de noviembre de 2026 para el cierre de proyectos: hasta 2 horas diarias, por 3 meses. El registro muestra sus salidas reales desde las 18:39 y las liquidaciones pagan esas horas con 50% de recargo.</td></tr><tr><td>Registro de asistencia de noviembre (otros técnicos)</td><td>Elena Pizarro y Rodrigo Vera marcaron su salida a las 17:39 y siguieron trabajando; sus horas solo aparecen anotadas por Mauricio en el grupo de WhatsApp. Nunca se pagaron y no hay pacto escrito.</td></tr><tr><td>Anexo de horario y liquidación de noviembre de Javier</td><td>El anexo, firmado el 30 de octubre, fija su jornada de 09:30 a 18:39, pero el sistema de asistencia sigue con el horario de 08:30 y marca un “atraso” de 1 hora diaria; Remuneraciones le descontó esos “atrasos”.</td></tr><tr><td>Contrato de Bruno Salinas</td><td>Técnico de Soporte desde el 1 de diciembre de 2026. Su contrato no se ha escriturado ni registrado en el sitio de la DT.</td></tr><tr><td>Denuncia de Javier</td><td>Acta firmada por Javier con copia, medidas de resguardo, informe de investigación y pronunciamiento de la Inspección.</td></tr><tr><td>Término de Mauricio</td><td>Carta con la causal y los hechos acreditados, comprobantes de cotizaciones y copia a la Inspección dentro de plazo. Finiquito firmado electrónicamente en el sitio de la DT el 22 de enero de 2027, <b>con reserva de derechos</b> respecto de la causal.</td></tr></table><p><b>Propuestas de la gerencia de Operaciones:</b> <i>“Imprimamos un registro de noviembre ‘ajustado’ y armemos pactos de horas extra de Elena y Rodrigo con fecha de octubre, para que la carpeta llegue completa”</i>; y <i>“Lo de Mauricio no lo llevemos: firmó el finiquito, así que está cerrado”</i>.</p>'}
 ],
 competencias:[
  {id:'m1',nombre:'Módulo 1 · Fundamentos, irrenunciabilidad y organismos',fortaleza:'sigues la ruta de análisis, reconoces que un acuerdo no elimina un mínimo legal y derivas al organismo competente según la materia.',mejora:'repasa la ruta de análisis (hecho, derecho, límites, decisión y documentación), la irrenunciabilidad del art. 5 y el criterio para elegir entre la DT, los tribunales y la SUSESO.',repasar:'Lecciones 1.1, 1.3 y 1.5'},
  {id:'m2',nombre:'Módulo 2 · Jornada, horas extra y registro',fortaleza:'calculas correctamente las horas extraordinarias y revisas el pacto y el registro con sus requisitos legales.',mejora:'repasa la fórmula del valor hora, los requisitos del pacto (escrito, temporal, hasta 3 meses, máximo 2 horas diarias) y el rol del registro de asistencia como evidencia.',repasar:'Lecciones 2.6 y 2.7'},
  {id:'m3',nombre:'Módulo 3 · Conciliación y derechos fundamentales',fortaleza:'reconoces los derechos de conciliación como derechos y proteges a quien reclama frente a represalias.',mejora:'repasa la banda horaria para el cuidado de niños y niñas, la garantía de indemnidad y la tutela laboral.',repasar:'Lecciones 3.1 y 3.4'},
  {id:'m4',nombre:'Módulo 4 · Ley Karin: clasificar, recibir y resguardar',fortaleza:'distingues acoso, violencia de terceros, conflicto y dirección legítima, y recibes una denuncia con medidas de resguardo adecuadas.',mejora:'repasa las definiciones del art. 2, la denuncia verbal con acta, el plazo de 3 días hábiles y las medidas de resguardo que no perjudican a quien denuncia.',repasar:'Lecciones 4.2, 4.5, 4.6 y 4.7'},
  {id:'m5',nombre:'Módulo 5 · Término, finiquito y cumplimiento ante la fiscalización',fortaleza:'eliges la causal según los hechos, revisas la carta y las cotizaciones, calculas el finiquito y respondes a una fiscalización con documentos reales y coherentes, corrigiendo el caso y su causa.',mejora:'repasa la causal del art. 160, la carta del art. 162, el efecto de las cotizaciones impagas, los pagos del cierre y los recargos del art. 168, el finiquito con reserva de derechos, la cadena documental que revisa la Inspección y las multas del art. 506 con su rebaja por corrección (art. 511).',repasar:'Lecciones 5.1, 5.3 a 5.9'}
 ],
 inicio:'t1',
 etapas:[
  {id:'t1',tipo:'ordenar',titulo:'Antes de responder: la ruta de análisis',corto:'Ruta de análisis',competencia:'m1',pts:2,
   escena:'<p>Mauricio quiere una respuesta rápida: <i>"Dile que no hay nada que pagar"</i>. Camila prefiere aplicar la ruta de análisis que usa en todos los casos. Lee el <b>correo de Mauricio</b> (documento 2) y el <b>registro de asistencia</b> (documento 3).</p>',
   pregunta:'Asigna a cada paso su posición en la ruta de análisis (1º = primero).',
   items:[
    {texto:'Observar el hecho: revisar el registro de asistencia de septiembre y los correos en que Mauricio pidió a Javier quedarse.',fb:'Primero los hechos, con evidencia: el registro muestra lo que ocurrió; la opinión de la jefatura no lo reemplaza.'},
    {texto:'Identificar el derecho u obligación involucrada: el pago de las horas trabajadas sobre la jornada pactada, con conocimiento del empleador.',fb:'Con los hechos claros, se identifica qué derecho está en juego.'},
    {texto:'Revisar los límites legales: irrenunciabilidad, requisitos del pacto de horas extra y única compensación alternativa permitida.',fb:'Los mínimos legales, prohibiciones y formalidades definen qué se puede acordar.'},
    {texto:'Decidir y documentar: pagar lo que corresponde, corregir la práctica del área y dejar respaldo escrito.',fb:'La decisión se documenta: la memoria de la jefatura no es respaldo ante una fiscalización o un juicio.'}],
   fb:'Ruta de análisis: hecho → derecho u obligación → límites legales → decisión y documentación.',siguiente:'t2'},
  {id:'t2',tipo:'decision',titulo:'"Javier firmó que renunciaba"',corto:'Irrenunciabilidad',competencia:'m1',
   escena:'<p>Mauricio insiste en que el documento firmado por Javier en agosto y el procedimiento interno del área bastan para no pagar (documento 2).</p>',
   pregunta:'¿Qué concluye Camila?',
   ideal:'el documento no produce efecto, porque el pago de las horas extraordinarias es un derecho irrenunciable mientras subsiste el contrato, y el procedimiento interno no deroga la ley; corresponde pagar las horas con recargo.',
   opciones:[
    {texto:'El documento es válido: Javier lo firmó voluntariamente y el procedimiento interno del área lo respalda.',pts:0,fb:'Los derechos establecidos por las leyes laborales son irrenunciables mientras subsista el contrato (art. 5 inc. 2): una firma voluntaria no los vuelve disponibles. Además, un procedimiento interno está subordinado a la ley; la costumbre no deroga un derecho.',siguiente:'t3b'},
    {texto:'El documento no produce efecto: el pago de las horas extraordinarias es irrenunciable mientras subsiste el contrato, y el procedimiento interno no puede reemplazar la ley. Corresponde pagar las horas de septiembre con recargo.',pts:2,fb:'Correcto: la irrenunciabilidad (art. 5 inc. 2) deja sin efecto el documento, y un procedimiento interno está subordinado a la ley y al contrato. "Siempre lo hemos hecho así" no es fundamento.',siguiente:'t3a'},
    {texto:'El documento no vale para el pasado, pero sí desde ahora: se pagan las horas de septiembre y en adelante se compensa saliendo antes.',pts:1,fb:'Pagar septiembre es correcto, pero el documento tampoco vale hacia el futuro: el derecho sigue siendo irrenunciable. La única compensación alternativa al pago es feriado adicional por acuerdo escrito (hasta 5 días hábiles al año).',siguiente:'t3a'}]},
  {id:'t3a',tipo:'decision',titulo:'¿A quién se recurre?',corto:'Organismo competente',competencia:'m1',
   escena:'<p>Camila informa que se pagarán las horas. Mauricio no queda convencido: <i>"Pidamos una opinión oficial sobre si este tipo de compensación vale"</i>. Javier, por su parte, pregunta: <i>"Si en el futuro no me pagan, ¿adónde puedo ir?"</i></p>',
   pregunta:'¿Qué orientación da Camila?',
   ideal:'la duda interpretativa se revisa en los dictámenes de la Dirección del Trabajo; un incumplimiento en el pago o el registro se denuncia ante la Inspección del Trabajo, que fiscaliza; una controversia de fondo se resuelve en el Juzgado de Letras del Trabajo.',
   opciones:[
    {texto:'Ambas consultas van al Ministerio del Trabajo, porque es el organismo de mayor jerarquía.',pts:0,fb:'Se deriva según la materia y el tipo de intervención, no según la jerarquía. El Ministerio dirige políticas públicas; no fiscaliza cada incumplimiento individual.'},
    {texto:'Ambas consultas van a la SUSESO, porque se trata de remuneraciones.',pts:0,fb:'La SUSESO ve materias de seguridad social como licencias médicas y subsidios. Las horas extraordinarias son legislación laboral, de competencia de la DT y de los tribunales.'},
    {texto:'Ambas consultas van a la Inspección del Trabajo, que además puede dictar una sentencia que obligue a pagar.',pts:1,fb:'La DT interpreta y fiscaliza, pero no dicta sentencias: fiscalizar no es lo mismo que juzgar. Una controversia de fondo la resuelve el Juzgado de Letras del Trabajo.'},
    {texto:'La duda interpretativa se revisa en los dictámenes de la Dirección del Trabajo; un incumplimiento de pago o de registro se denuncia ante la Inspección del Trabajo, que fiscaliza; y una controversia de fondo la resuelve el Juzgado de Letras del Trabajo.',pts:2,fb:'Correcto: la DT interpreta mediante dictámenes y fiscaliza (art. 1 DFL N°2 y art. 476 CT); los Juzgados de Letras del Trabajo resuelven controversias mediante sentencia (art. 420 CT).'}],
   siguiente:'t4'},
  {id:'t3b',tipo:'decision',titulo:'Llega una fiscalización',corto:'Corregir el rumbo',competencia:'m1',
   escena:'<p>Javier no recibe el pago y denuncia ante la Inspección del Trabajo. Dos semanas después llega un fiscalizador y pide el registro de asistencia de septiembre y las liquidaciones de Javier. Mauricio quiere mostrarle el documento en que Javier "renunció" a las horas extra.</p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'entregar el registro y las liquidaciones, reconocer que el documento no produce efecto, pagar las horas con recargo y corregir la práctica del área.',
   opciones:[
    {texto:'Presentar el documento firmado como prueba de que Javier renunció válidamente a las horas extra.',pts:0,fb:'El documento no produce efecto: los derechos laborales son irrenunciables mientras subsiste el contrato. Presentarlo solo evidencia la infracción.'},
    {texto:'Señalar al fiscalizador que la Inspección no puede intervenir, porque solo un juez puede resolver un reclamo.',pts:0,fb:'La fiscalización del cumplimiento de la legislación laboral corresponde a la Dirección del Trabajo (art. 476 CT). Los tribunales resuelven controversias de fondo, pero eso no impide fiscalizar.'},
    {texto:'Entregar el registro y las liquidaciones, reconocer que el documento no produce efecto, pagar las horas con recargo y corregir la práctica del área.',pts:2,fb:'Bien: colaborar con la fiscalización, pagar lo adeudado y corregir la práctica es la forma de cerrar el incumplimiento. El registro es la evidencia central.'},
    {texto:'Pagar las horas, pero mantener el procedimiento del área de compensar saliendo antes en el futuro.',pts:1,fb:'Pagar es correcto, pero la práctica debe corregirse: salir antes otro día, sin pacto escrito de feriado, no es una compensación válida.'}],
   siguiente:'t4'},
  {id:'t4',tipo:'numero',titulo:'Las horas extra de septiembre',corto:'Calcular horas extra',competencia:'m2',pts:3,
   escena:'<p>Camila calcula lo que se debe pagar a Javier. Usa la <b>ficha de Javier</b> (documento 1), el <b>registro de asistencia</b> (documento 3) y la <b>guía de cálculo</b> (documento 8). Considera el recargo legal mínimo.</p>',
   pregunta:'Calcula los tres valores.',
   campos:[
    {label:'Valor de una hora extraordinaria de Javier ($)',valor:10500,tol:1,unidad:'$'},
    {label:'Total de horas extraordinarias de septiembre',valor:6.5,tol:0.01,unidad:'horas'},
    {label:'Monto a pagar por las horas extraordinarias ($)',valor:68250,tol:10,unidad:'$'}],
   solucion:'Valor hora: (1.260.000 ÷ 30 × 28) = 1.176.000; ÷ (42 × 4 = 168) = $7.000 la hora ordinaria; × 1,5 = <b>$10.500</b>. Horas: lunes 7 (17:39 → 19:09) 1,5 h + miércoles 9 (→ 19:39) 2 h + martes 15 (→ 18:39) 1 h + jueves 24 (→ 19:39) 2 h = <b>6,5 horas</b>. Monto: 6,5 × $10.500 = <b>$68.250</b>. Aunque no había pacto escrito, son horas extraordinarias porque se trabajaron con conocimiento del empleador (los correos de Mauricio lo prueban) y deben pagarse con las remuneraciones del período; la falta de pacto es además una infracción.',siguiente:'t5'},
  {id:'t5',tipo:'multi',titulo:'La propuesta de Mauricio para el verano',corto:'Revisar el pacto',competencia:'m2',pts:3,
   escena:'<p>Lee la <b>propuesta de Mauricio para octubre a marzo</b> (documento 4). Camila debe responderle qué hay que corregir antes de aprobar cualquier sobretiempo.</p>',
   pregunta:'Marca todas las afirmaciones correctas que Camila debe incluir en su respuesta.',
   items:[
    {texto:'El pacto de horas extraordinarias debe constar por escrito y solo procede para atender necesidades o situaciones temporales de la empresa.',ok:true,fb:'Art. 32 CT.'},
    {texto:'No pueden pactarse más de 2 horas extraordinarias por día.',ok:true,fb:'Art. 31 CT: 3 horas diarias exceden el máximo.'},
    {texto:'La vigencia del pacto no puede superar 3 meses; se renueva por acuerdo solo si persisten las circunstancias que lo originaron.',ok:true,fb:'Octubre a marzo son 6 meses. Si el sobretiempo se vuelve permanente, hay que revisar la dotación y los turnos.'},
    {texto:'Javier debe marcar su hora real de salida: el registro de asistencia es la evidencia de las horas trabajadas, y un chat no lo reemplaza.',ok:true,fb:'Art. 33 CT y Res. Ex. DT N°38 de 2024: pedir que no se marque el sobretiempo destruye evidencia.'},
    {texto:'La única compensación alternativa al pago es feriado adicional, por acuerdo escrito y hasta 5 días hábiles al año (cada hora extra equivale a 1,5 horas de feriado).',ok:true,fb:'Art. 32 inc. 4 CT (Ley 21.561). Salir antes otro día no es una compensación válida.'},
    {texto:'Si no se firma el pacto, las horas que Javier trabaje fuera de horario no se pagan.',ok:false,fb:'Falso: las horas trabajadas en exceso con conocimiento del empleador son extraordinarias aunque no haya pacto, y deben pagarse.'},
    {texto:'El recargo puede pactarse en 30% si Javier está de acuerdo.',ok:false,fb:'Falso: el recargo mínimo es de 50%; las partes solo pueden pactar uno mayor.'}],
   fb:'Cada marca incorrecta descuenta un acierto.',siguiente:'t6'},
  {id:'t6',tipo:'decision',titulo:'La solicitud de horario de Javier',corto:'Banda horaria',competencia:'m3',
   escena:'<p>Lee la <b>solicitud escrita de Javier</b> y la respuesta de Mauricio (documento 5).</p>',
   pregunta:'¿Qué responde Camila a la solicitud?',
   ideal:'reconocer el derecho: quien tiene el cuidado personal de un niño o niña menor de 12 años puede retrasar hasta 1 hora el inicio de su jornada, con igual ajuste en la salida; el horario de Soporte lo permite, no corresponde descuento ni imputarlo al feriado, y el nuevo horario se deja por escrito.',
   opciones:[
    {texto:'Rechazarla: el horario es una decisión de la jefatura y los ajustes son beneficios voluntarios.',pts:0,fb:'La Ley 21.561 reconoce a quienes tienen el cuidado personal de niños o niñas menores de 12 años una banda de hasta 2 horas para anticipar o retrasar hasta 1 hora el inicio de la jornada. No es un favor.'},
    {texto:'Aceptarla, pero descontar la hora del sueldo o imputarla a sus días de feriado.',pts:0,fb:'La banda no reduce la jornada: Javier trabaja las mismas horas, solo cambia el inicio y el término. No hay nada que descontar, y el feriado no puede usarse para esto.'},
    {texto:'Aceptarla de palabra, sin dejar registro, para no "burocratizar" el área.',pts:1,fb:'Aceptar es correcto, pero sin un registro escrito del nuevo horario el acuerdo queda expuesto a cambios de jefatura y el registro de asistencia mostraría "atrasos".'},
    {texto:'Reconocer el derecho: Javier tiene el cuidado personal de una niña de 10 años, lo acredita con el certificado de nacimiento y el horario de Soporte (08:00 a 20:00) lo permite. Puede ingresar a las 09:30 y salir a las 18:39, sin descuentos, dejando el nuevo horario por escrito.',pts:2,fb:'Correcto: retrasar 1 hora el inicio con igual ajuste en la salida está dentro de la banda legal; la excepción solo opera cuando la empresa funciona en un horario que no lo permite. Dejarlo por escrito da certeza a ambas partes (art. 11).'}],
   siguiente:'t7'},
  {id:'t7',tipo:'abierta',titulo:'Explicar a Mauricio',corto:'Explicar',verbo:'Explica',competencia:'m3',
   escena:'<p>Mauricio responde molesto: <i>"Primero me cobran horas extra y ahora un horario especial. ¿Desde cuándo la jefatura no decide?"</i></p>',
   consigna:'a Mauricio, en un mensaje breve y respetuoso, por qué el pago de las horas extra y el ajuste de horario de Javier no son favores que la jefatura concede, cómo cambia el cálculo del sobretiempo con el nuevo horario y qué debe quedar por escrito.',minPalabras:50,
   modelo:'Mauricio: la jefatura organiza el trabajo, pero dentro de la ley. Las horas trabajadas después del horario con tu conocimiento son extraordinarias y deben pagarse con al menos 50% de recargo; ese derecho es irrenunciable, aunque Javier haya firmado lo contrario. Si se necesita sobretiempo, debe pactarse por escrito, por un máximo de 2 horas diarias y hasta 3 meses, y Javier debe marcar su salida real. El ajuste de horario también es un derecho: quien tiene el cuidado personal de un niño menor de 12 años puede retrasar hasta 1 hora su entrada, con el mismo ajuste en la salida, y Soporte funciona hasta las 20:00. Desde ahora su jornada termina a las 18:39, así que el sobretiempo se cuenta desde esa hora. El nuevo horario y cualquier pacto de horas extra quedarán por escrito.',
   criterios:['Explica que las horas extra trabajadas con conocimiento del empleador se pagan y que ese derecho es irrenunciable.','Explica que la banda horaria es un derecho de quien cuida a un niño o niña menor de 12 años, sin descuentos.','Señala que el sobretiempo se cuenta desde el nuevo término de la jornada (18:39).','Indica qué debe quedar por escrito (nuevo horario y pacto de horas extra).'],siguiente:'t8'},
  {id:'t8',tipo:'clasificar',titulo:'Lo que cuenta Javier',corto:'Clasificar conductas',competencia:'m4',pts:3,
   escena:'<p>El lunes 19 de octubre Javier vuelve a la oficina de Personas. Lee su <b>relato</b> (documento 6). Antes de actuar, Camila separa las situaciones según sus elementos legales.</p>',
   pregunta:'Clasifica cada situación.',
   categorias:['Posible acoso laboral','Violencia en el trabajo ejercida por terceros','Conflicto laboral que requiere gestión','Ejercicio legítimo de la facultad de dirección'],
   items:[
    {texto:'En la reunión semanal, frente al equipo, Mauricio dice: "Aquí llegó el papá que entra tarde; si no le gusta, que se busque otra pega", y el equipo se ríe.',cat:0,fb:'Agresión verbal que humilla y amenaza su situación laboral. Desde la Ley Karin, una sola conducta puede bastar.'},
    {texto:'Desde que pidió el ajuste de horario, Mauricio lo sacó del grupo donde se reparten los tickets y le asigna solo las rutas más lejanas.',cat:0,fb:'Hostigamiento que perjudica su situación laboral; además, aparece vinculado al ejercicio de sus derechos.'},
    {texto:'Un cliente lo insulta y amenaza en su oficina porque la reparación no quedó lista.',cat:1,fb:'Conducta de un tercero ajeno a la relación laboral, con ocasión de la prestación de servicios.'},
    {texto:'Discute con su compañera Elena sobre quién toma un ticket urgente; ambos alzan la voz, sin insultos.',cat:2,fb:'Un desacuerdo sobre tareas no es automáticamente acoso, pero requiere gestión (conversación facilitada, reglas de convivencia).'},
    {texto:'Mauricio le pide, en privado y con respeto, corregir un informe técnico con errores.',cat:3,fb:'Corregir errores con respeto es parte de la facultad de dirección.'}],
   fb:'Dos errores a evitar: minimizar una conducta grave porque "fue una sola vez" y etiquetar como acoso cualquier diferencia laboral.',siguiente:'t9'},
  {id:'t9',tipo:'decision',titulo:'"Quiero denunciar, pero no traigo nada escrito"',corto:'Recibir la denuncia',competencia:'m4',
   escena:'<p>Javier confirma que quiere denunciar a Mauricio por las dos primeras situaciones. Está nervioso y no trae ningún documento.</p>',
   pregunta:'¿Qué hace Camila?',
   ideal:'recibir la denuncia verbal en privado, levantar un acta que Javier firma y entregarle copia, informarle el procedimiento y adoptar de inmediato medidas de resguardo; dentro de 3 días hábiles, la empresa dispone la investigación interna o remite los antecedentes a la Inspección del Trabajo.',
   opciones:[
    {texto:'Recibirla en privado, levantar un acta con su relato que Javier firma, entregarle copia, informarle el procedimiento y adoptar de inmediato medidas de resguardo.',pts:2,fb:'Correcto: así se recibe una denuncia verbal. Recibir no es investigar: en este momento no se decide si los hechos son verdaderos. Dentro de 3 días hábiles, la empresa dispone la investigación interna o remite los antecedentes a la Inspección del Trabajo.',siguiente:'t10a'},
    {texto:'Pedirle que vuelva con una carta formal firmada, porque sin ella no se puede iniciar el procedimiento.',pts:0,fb:'La denuncia puede ser verbal: no se puede exigir una carta formal. Quien la recibe levanta un acta.',siguiente:'t10b'},
    {texto:'Tratarlo como un conflicto entre jefatura y trabajador y citar a ambos a una conversación para "aclarar malentendidos".',pts:0,fb:'La persona quiere denunciar y los hechos pueden constituir acoso: la empresa debe recibir la denuncia. Una conversación con el denunciado expone a Javier y puede revictimizarlo.',siguiente:'t10b'},
    {texto:'Levantar el acta, pero dejar las medidas de resguardo para cuando termine la investigación, para no prejuzgar.',pts:1,fb:'El acta es correcta, pero las medidas de resguardo se adoptan de inmediato al recibir la denuncia. No son una sanción: protegen sin prejuzgar.',siguiente:'t10a'}]},
  {id:'t10a',tipo:'multi',titulo:'Las medidas de resguardo',corto:'Medidas de resguardo',competencia:'m4',pts:2,
   escena:'<p>Camila levantó el acta y le entregó copia a Javier. Ahora debe proponer medidas de resguardo a la gerencia, considerando la gravedad de los hechos y las condiciones de trabajo de Soporte.</p>',
   pregunta:'Marca todas las medidas de resguardo adecuadas.',
   items:[
    {texto:'Mientras dure la investigación, que Javier reporte a la coordinadora de Soporte Norte en lugar de Mauricio, sin cambiar sus funciones, su horario ni su remuneración.',ok:true,fb:'Separa a las personas sin perjudicar a quien denuncia.'},
    {texto:'Derivar a Javier a atención psicológica temprana a través de la mutualidad (organismo administrador de la Ley 16.744).',ok:true,fb:'Es una de las medidas que contempla la ley.'},
    {texto:'Que la asignación de tickets y rutas de Javier la haga la coordinadora con el mismo criterio de rotación del resto del equipo.',ok:true,fb:'Redistribuye la organización del trabajo y evita que la medida perjudique a Javier.'},
    {texto:'Cambiar a Javier al turno de noche para que no coincida con Mauricio.',ok:false,fb:'Es gravoso para quien denuncia: alteraría su jornada y su banda horaria. Las medidas no pueden perjudicarlo.'},
    {texto:'Suspender a Mauricio sin goce de remuneraciones desde hoy, como castigo.',ok:false,fb:'Las medidas de resguardo no son una sanción anticipada: se protege sin prejuzgar.'},
    {texto:'Pedirle a Javier que use sus días de feriado mientras se investiga.',ok:false,fb:'Le traslada el costo de la protección y lo perjudica.'}],
   fb:'Cada marca incorrecta descuenta un acierto.',siguiente:'t11'},
  {id:'t10b',tipo:'decision',titulo:'Javier vuelve al día siguiente',corto:'Corregir el rumbo',competencia:'m4',
   escena:'<p>Al día siguiente Javier vuelve angustiado: <i>"No sé escribir una carta formal, y Mauricio sigue igual conmigo. Estoy pensando en ir directo a la Inspección del Trabajo"</i>.</p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'recibir la denuncia verbal con acta firmada y copia, explicarle el procedimiento (incluido que también puede denunciar directamente ante la Inspección) y adoptar de inmediato medidas de resguardo.',
   opciones:[
    {texto:'Sugerirle que deje una denuncia anónima en el buzón, para no exponerse.',pts:0,fb:'La denuncia debe individualizar a quien denuncia: no procede la denuncia anónima para iniciar el procedimiento.'},
    {texto:'Redactarle Camila una carta con su propio estilo y pedirle que la firme como suya.',pts:1,fb:'Busca ayudar, pero el camino legal es el acta de su relato, firmada por Javier. Redactar "por él" puede alterar su relato.'},
    {texto:'Reconocer el error: recibir ahora su denuncia verbal, levantar el acta que Javier firma, entregarle copia, explicarle el procedimiento (también puede denunciar directamente ante la Inspección) y adoptar de inmediato medidas de resguardo.',pts:2,fb:'Bien: la denuncia verbal se recibe con acta, y la persona puede elegir denunciar en la empresa o directamente ante la Inspección del Trabajo. Las medidas de resguardo no pueden esperar.'}],
   siguiente:'t11'},
  {id:'t11',tipo:'abierta',titulo:'El acta de la denuncia',corto:'Describir el acta',verbo:'Describe',competencia:'m4',
   escena:'<p>Revisa el <b>relato de Javier</b> (documento 6). Camila redacta el acta de la denuncia verbal.</p>',
   consigna:'qué datos debe contener el acta de la denuncia de Javier para que pueda iniciarse el procedimiento y qué debe informarle Camila al cerrar la reunión.',minPalabras:50,
   modelo:'El acta individualiza a Javier Muñoz como denunciante (cargo y área) y a Mauricio Lagos como denunciado. Describe los hechos con fechas: el lunes 12 de octubre, en la reunión semanal y frente al equipo, Mauricio dijo "Aquí llegó el papá que entra tarde; si no le gusta, que se busque otra pega"; después lo sacó del grupo de asignación de tickets y le asigna solo las rutas más lejanas, desde que pidió su ajuste de horario. Menciona los antecedentes que puede aportar: compañeros presentes en la reunión, el historial del grupo y las asignaciones de rutas. Javier firma el acta y recibe una copia. Camila le informa que la empresa dispondrá una investigación interna o remitirá los antecedentes a la Inspección del Trabajo dentro de 3 días hábiles, que la investigación debe concluir en 30 días hábiles, que es confidencial, que se adoptarán medidas de resguardo y que no puede sufrir represalias por denunciar.',
   criterios:['Individualiza a la persona denunciante y a la persona denunciada.','Describe los hechos concretos con fechas y lugar, y los antecedentes o testigos.','Indica que Javier firma el acta y recibe copia.','Describe la información que se le entrega: investigación o remisión en 3 días hábiles, plazo de 30 días hábiles, confidencialidad, resguardo y no represalias.'],siguiente:'t12'},
  {id:'t12',tipo:'decision',titulo:'"Despidámoslo por necesidades de la empresa"',corto:'Garantía de indemnidad',competencia:'m3',
   escena:'<p>Mientras avanza la investigación interna, la gerenta de Operaciones, Patricia Rojas, escribe a Camila: <i>"Javier se volvió un problema: reclamó por las horas, pidió horario especial y ahora denunció a su jefe. Despidámoslo por necesidades de la empresa y le pagamos todo; así es legal."</i></p>',
   pregunta:'¿Qué responde Camila?',
   ideal:'no despedirlo: el art. 161 exige hechos objetivos de la organización, y despedir a quien reclamó y denunció sería una represalia que vulnera la garantía de indemnidad; Javier podría demandar por tutela laboral y, si el despido es vulneratorio, la empresa pagaría además una indemnización adicional de 6 a 11 remuneraciones mensuales.',
   opciones:[
    {texto:'Despedirlo por el art. 161 pagando todas las indemnizaciones: si se paga todo, el despido es legal.',pts:0,fb:'Pagar no convierte en legítima una represalia. El art. 161 exige hechos objetivos de la organización y no sirve para problemas de relación o para castigar a quien reclama.'},
    {texto:'Esperar a que termine la investigación y despedirlo después por el art. 161, para que no parezca una represalia.',pts:0,fb:'Postergar no cambia el motivo: seguiría siendo un despido por haber reclamado y denunciado, sin hechos objetivos de la organización.'},
    {texto:'Responder que no se puede despedir "por ahora", porque la Ley Karin prohíbe despedir durante una investigación.',pts:1,fb:'La conclusión es correcta, pero el fundamento no: el problema es que no hay una causal real y que sería una represalia, no un plazo de espera.'},
    {texto:'No despedirlo: el art. 161 exige hechos objetivos de la organización, y despedirlo por reclamar y denunciar sería una represalia que vulnera la garantía de indemnidad. Podría demandar por tutela laboral y, si el despido es vulneratorio, la empresa pagaría además entre 6 y 11 remuneraciones mensuales.',pts:2,fb:'Correcto: la garantía de indemnidad protege a quien ejerce acciones, reclama o denuncia (art. 485). El despido vulneratorio agrega una indemnización de 6 a 11 remuneraciones (art. 489).'}],
   siguiente:'t13'},
  {id:'t13',tipo:'decision',titulo:'El término del contrato de Mauricio',corto:'Elegir la causal',competencia:'m5',
   escena:'<p>La investigación interna concluyó dentro de los 30 días hábiles: oyó a ambas partes y a cuatro testigos, y acreditó que Mauricio humilló a Javier en la reunión del 12 de octubre y lo excluyó de la asignación de tickets y rutas como represalia. El informe se remitió a la Inspección del Trabajo, que a comienzos de enero de 2027 se pronunció y confirmó las conclusiones. Dentro de los 15 días siguientes, la gerencia decide poner término al contrato de Mauricio, como permite el reglamento interno (documento 7).</p>',
   pregunta:'¿Cómo prepara Camila el término?',
   ideal:'invocar el art. 160 N°1 letra f (acoso laboral), con una carta que describa los hechos acreditados en la investigación, informe el estado de pago de las cotizaciones con sus comprobantes y se entregue dentro de 3 días hábiles, con copia a la Inspección.',
   opciones:[
    {texto:'Invocar el art. 160 N°1 letra f (acoso laboral), con una carta que describa los hechos acreditados en la investigación, informe el estado de pago de las cotizaciones con sus comprobantes y se entregue dentro de 3 días hábiles, con copia a la Inspección del Trabajo.',pts:2,fb:'Correcto: la causal se elige según los hechos reales, y la carta debe explicarlos, porque en un juicio la empresa no puede alegar hechos distintos de los señalados en ella.',siguiente:'t14a'},
    {texto:'Invocar el art. 161, necesidades de la empresa, y pagar las indemnizaciones "para evitar un juicio".',pts:0,fb:'El art. 161 debe fundarse en hechos objetivos de la organización y no sirve para problemas de conducta. Además, desdibuja la sanción que corresponde por acoso laboral acreditado.',siguiente:'t14b'},
    {texto:'Invocar el art. 160 citando solo el artículo, con la frase "los hechos constan en el informe de investigación".',pts:1,fb:'La causal es correcta, pero la carta debe indicar los hechos en que se funda. Si no los describe, la empresa queda expuesta en un juicio.',siguiente:'t14a'},
    {texto:'Proponerle a Mauricio un mutuo acuerdo y que lo firme en la oficina de Personas, sin ministro de fe.',pts:0,fb:'El mutuo acuerdo requiere la voluntad real de ambas partes y, para invocarlo, debe ratificarse ante un ministro de fe o firmarse electrónicamente en la DT. Además, no refleja la sanción que corresponde.',siguiente:'t14b'}]},
  {id:'t14a',tipo:'decision',titulo:'Las cotizaciones de diciembre',corto:'Cotizaciones',competencia:'m5',
   escena:'<p>Al preparar los comprobantes, Camila descubre que la cotización de salud de diciembre de Mauricio no se pagó por un error de la nómina.</p>',
   pregunta:'¿Qué hace Camila?',
   ideal:'pagar la cotización atrasada antes de comunicar el término y adjuntar los comprobantes de todas las cotizaciones hasta el mes anterior.',
   opciones:[
    {texto:'Pagar la cotización atrasada antes de comunicar el término y adjuntar a la carta los comprobantes de todas las cotizaciones hasta diciembre.',pts:2,fb:'Correcto: así el despido produce efecto y la carta cumple con informar el estado de pago con sus comprobantes.'},
    {texto:'Enviar la carta igual, indicando que diciembre está pendiente y que se pagará en el finiquito.',pts:0,fb:'Si las cotizaciones no están íntegramente pagadas, el despido no produce el efecto de poner término al contrato: la empresa debería seguir pagando remuneraciones y cotizaciones hasta convalidarlo (art. 162 inc. 5).'},
    {texto:'Enviar la carta sin mencionar las cotizaciones, porque una omisión en la carta no invalida el término.',pts:0,fb:'Es cierto que un error u omisión en la carta no invalida el término, pero las cotizaciones impagas sí impiden que el despido produzca efecto.'}],
   siguiente:'t15'},
  {id:'t14b',tipo:'decision',titulo:'La abogada revisa el borrador',corto:'Corregir el rumbo',competencia:'m5',
   escena:'<p>La abogada externa de Horizonte revisa el borrador y advierte: <i>"Esta salida no se funda en los hechos acreditados. Si Javier o el propio Mauricio la cuestionan, la empresa queda mal parada y el mensaje para el equipo es que el acoso no tiene consecuencias."</i></p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'cambiar a la causal que corresponde a los hechos: art. 160 N°1 letra f, con los hechos acreditados en la carta, las cotizaciones al día con sus comprobantes y la copia a la Inspección dentro de 3 días hábiles.',
   opciones:[
    {texto:'Mantener el borrador: pagar indemnizaciones o llegar a un acuerdo siempre evita conflictos.',pts:0,fb:'La causal se elige según los hechos reales. Una causal que no corresponde puede ser declarada improcedente y no refleja la sanción por acoso laboral acreditado.'},
    {texto:'Mantener el art. 161, pero describir en la carta los hechos de acoso.',pts:0,fb:'Mezclar una causal objetiva con hechos de conducta es incoherente: el art. 161 no sirve para problemas de conducta.'},
    {texto:'Corregir: invocar el art. 160 N°1 letra f, describir en la carta los hechos acreditados, verificar que las cotizaciones estén pagadas con sus comprobantes y enviar copia a la Inspección dentro de 3 días hábiles.',pts:2,fb:'Bien: la causal corresponde a la conducta acreditada y la carta deja claros los hechos que la sostienen.'}],
   siguiente:'t15'},
  {id:'t15',tipo:'numero',titulo:'El finiquito de Mauricio',corto:'Calcular el finiquito',competencia:'m5',pts:3,
   escena:'<p>El término por el art. 160 N°1 letra f queda firme. Usa la <b>ficha de Mauricio</b> (documento 7) y la <b>guía de cálculo</b> (documento 8).</p>',
   pregunta:'Calcula los tres valores.',
   campos:[
    {label:'Indemnización por años de servicio que corresponde con el art. 160 bien aplicado ($)',valor:0,tol:0,unidad:'$'},
    {label:'Total del finiquito de Mauricio ($)',valor:1785000,tol:1000,unidad:'$'},
    {label:'Si un tribunal declarara injustificado el despido: indemnización por años de servicio más el recargo legal ($)',valor:30240000,tol:1000,unidad:'$'}],
   solucion:'Con el art. 160 bien aplicado <b>no procede</b> indemnización por años de servicio: <b>$0</b>. Pero lo trabajado y el feriado se pagan siempre: remuneración de enero $1.050.000 + feriado proporcional 10,5 × $70.000 = $735.000 → total <b>$1.785.000</b>. Riesgo si un tribunal declarara injustificado el despido: del 4 de mayo de 2019 al 15 de enero de 2027 hay 7 años, 8 meses y 11 días; la fracción es superior a seis meses, así que se cuentan 8 años. 8 × $2.100.000 = $16.800.000, con recargo de 80% (art. 160 injustificado): $16.800.000 × 1,8 = <b>$30.240.000</b>. Por eso la carta debe describir los hechos acreditados. El finiquito se pone a disposición dentro de 10 días hábiles desde la separación y se paga al ratificarlo ante un ministro de fe o al firmarlo electrónicamente en la DT.',siguiente:'t16'},
  {id:'t16',tipo:'clasificar',titulo:'La Inspección cita a Horizonte',corto:'Revisar la carpeta',competencia:'m5',pts:3,
   escena:'<p>Febrero de 2027. Dos técnicos de Soporte denunciaron horas extraordinarias impagas y la Inspección del Trabajo cita a Horizonte. Lee la <b>citación y las notas de Camila</b> (documento 9). Antes de preparar la carpeta, Camila separa lo que respalda a la empresa, lo que muestra un incumplimiento y lo que no debe hacerse.</p>',
   pregunta:'Clasifica cada antecedente o propuesta.',
   categorias:['Respaldo coherente: se presenta tal como está','Incumplimiento: se presenta y se corrige (pagar o regularizar)','Práctica que no debe hacerse'],
   items:[
    {texto:'Pacto de horas extra de Javier (escrito, hasta 2 horas diarias, por 3 meses), con registro de sus salidas reales y liquidaciones que pagan esas horas con recargo.',cat:0,fb:'Pacto, registro y liquidación dicen lo mismo: es una cadena documental coherente.'},
    {texto:'Acta de la denuncia firmada por Javier, medidas de resguardo, informe de investigación y pronunciamiento de la Inspección.',cat:0,fb:'Respaldan que la empresa recibió, resguardó e investigó según la Ley Karin.'},
    {texto:'Carta de término de Mauricio con los hechos acreditados, comprobantes de cotizaciones, copia a la Inspección y finiquito firmado electrónicamente con reserva de derechos.',cat:0,fb:'Se presenta completo. La reserva deja abierta la discusión sobre la causal: por eso la evidencia de los hechos se conserva.'},
    {texto:'Elena y Rodrigo marcaron su salida a las 17:39 y siguieron trabajando en noviembre; sus horas solo están en el WhatsApp de Mauricio y nunca se pagaron.',cat:1,fb:'Son horas extraordinarias trabajadas con conocimiento del empleador: se pagan con recargo y se exige que el registro muestre la salida real.'},
    {texto:'El sistema de asistencia mantiene el horario de 08:30 de Javier y Remuneraciones le descontó “atrasos”, aunque el anexo fija su ingreso a las 09:30.',cat:1,fb:'Contrato, registro y liquidación no coinciden: se devuelve lo descontado y se actualiza el sistema con el anexo.'},
    {texto:'Bruno Salinas trabaja desde el 1 de diciembre sin contrato escrito ni registrado en el sitio de la DT.',cat:1,fb:'Se superó el plazo de 15 días para escriturar (art. 9) y registrar (art. 9 bis): se regulariza de inmediato.'},
    {texto:'Imprimir un registro de noviembre “ajustado” y pactos de horas extra de Elena y Rodrigo con fecha de octubre.',cat:2,fb:'Construir documentos después no sirve y contradice la realidad que el inspector constata como ministro de fe.'},
    {texto:'No llevar los antecedentes del término de Mauricio porque “firmó el finiquito y está cerrado”.',cat:2,fb:'La Inspección puede requerir toda la documentación laboral, y el finiquito no cierra lo que Mauricio reservó.'}],
   fb:'La fiscalización mira el cumplimiento real: los documentos deben existir, coincidir entre sí y reflejar lo que ocurrió.',siguiente:'t17'},
  {id:'t17',tipo:'decision',titulo:'¿Qué llevar a la citación y qué corregir?',corto:'Responder a la fiscalización',competencia:'m5',
   escena:'<p>Con la carpeta revisada, la gerenta de Operaciones pide a Camila un plan para la citación del 3 de marzo.</p>',
   pregunta:'¿Qué plan propone Camila?',
   ideal:'presentar los documentos reales y completos; pagar antes de la citación las horas de Elena y Rodrigo con recargo, devolver el descuento a Javier y escriturar y registrar el contrato de Bruno; y corregir el proceso que originó los errores (marca de la salida real, actualización del sistema con cada anexo y control de los plazos de contratación), con responsables y fechas.',
   opciones:[
    {texto:'Presentar los documentos reales y completos; pagar antes de la citación las horas de Elena y Rodrigo con recargo, devolver el descuento a Javier y escriturar y registrar el contrato de Bruno; y corregir el proceso: exigir la marca de la salida real, actualizar el sistema de asistencia con cada anexo y controlar los plazos de contratación, con responsables y fechas.',pts:2,fb:'Correcto: se corrige el caso (pagar y regularizar) y la causa raíz (el proceso que lo generó). La reiteración pesa al fijar una multa (art. 506 quáter), y corregir a tiempo la rebaja (art. 511).',siguiente:'t18a'},
    {texto:'Imprimir el registro “ajustado” y los pactos con fecha de octubre, para que la carpeta llegue completa y no haya multa.',pts:0,fb:'Construir o “completar” documentos cuando llega la citación es un error grave: no refleja lo que ocurrió y el inspector, como ministro de fe, constata la realidad.',siguiente:'t18b'},
    {texto:'Presentar los documentos reales y pagar lo adeudado, pero sin cambiar el proceso: fue un problema de Mauricio, que ya no está en la empresa.',pts:1,fb:'Pagar y regularizar resuelve el caso, pero si no se corrige el proceso (registro, anexos, contratación) el incumplimiento vuelve a ocurrir con otra jefatura.',siguiente:'t18a'},
    {texto:'Presentar solo lo que el fiscalizador pida en la reunión y esperar la multa para pagar todo junto; si llega, pedir que se sustituya por capacitación.',pts:0,fb:'Las sumas adeudadas se reajustan y devengan intereses desde que se hicieron exigibles (art. 63). Además, la sustitución por capacitación (art. 506 ter) solo procede para micro y pequeñas empresas, y Horizonte es mediana.',siguiente:'t18b'}]},
  {id:'t18a',tipo:'numero',titulo:'La multa y su rebaja',corto:'Multa y corrección',competencia:'m5',pts:2,
   escena:'<p>En la citación, el fiscalizador constata que en noviembre el registro de asistencia de Soporte no reflejaba las horas realmente trabajadas, una infracción sin sanción especial, y notifica a Horizonte una multa de <b>24 UTM</b>. Usa la <b>guía de cálculo</b> (documento 8) y la <b>citación</b> (documento 9).</p>',
   pregunta:'Calcula los tres valores (en UTM).',
   campos:[
    {label:'Multa mínima del rango que corresponde a Horizonte (UTM)',valor:2,tol:0,unidad:'UTM'},
    {label:'Multa máxima del rango que corresponde a Horizonte (UTM)',valor:40,tol:0,unidad:'UTM'},
    {label:'Monto máximo a pagar si Horizonte corrige la infracción dentro de los 15 días siguientes a la notificación (UTM)',valor:12,tol:0,unidad:'UTM'}],
   solucion:'Horizonte es <b>mediana empresa</b>: el rango del art. 506 va de <b>2</b> a <b>40 UTM</b> (la pequeña, de 1 a 10; la grande, de 3 a 60). Si corrige dentro de los 15 días siguientes a la notificación, la multa se rebaja a lo menos en 50% (art. 511): 24 × 50% = <b>12 UTM</b> como máximo. Corregir significa cumplir de verdad (registro con la salida real y horas pagadas), no solo ordenar la carpeta. Si la empresa no estuviera de acuerdo con la multa, podría reclamarla ante el juzgado del trabajo dentro de 15 días hábiles desde la notificación (art. 503).',siguiente:'t19'},
  {id:'t18b',tipo:'decision',titulo:'El fiscalizador visita Soporte',corto:'Corregir el rumbo',competencia:'m5',
   escena:'<p>Días antes de la citación, un fiscalizador visita el área de Soporte sin aviso, consulta directamente el sistema de asistencia y conversa con Elena y Rodrigo. Lo que constata no coincide con la carpeta que preparó la gerencia.</p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'reconocer el error: entregar el registro real, pagar las horas con recargo, devolver el descuento a Javier, regularizar el contrato de Bruno y corregir el proceso que originó los errores.',
   opciones:[
    {texto:'Sostener que el registro impreso es el válido, porque el fiscalizador no puede revisar el sistema sin aviso previo.',pts:0,fb:'Los inspectores pueden visitar los lugares de trabajo a cualquier hora (art. 24 DFL N°2), son ministros de fe y los hechos que constatan tienen presunción legal de veracidad (art. 23 DFL N°2).'},
    {texto:'Entregar el registro real y pagar las horas, pero mantener los pactos con fecha de octubre como respaldo.',pts:1,fb:'Entregar el registro real y pagar es correcto, pero un pacto fechado después de los hechos no refleja la realidad y debe retirarse.'},
    {texto:'Reconocer el error: retirar los documentos construidos, entregar el registro real, pagar las horas con recargo, devolver el descuento a Javier, regularizar el contrato de Bruno y corregir el proceso para que no se repita.',pts:2,fb:'Bien: la fiscalización mira el cumplimiento real. Corregir dentro de los 15 días siguientes a la notificación de una multa la rebaja a lo menos en 50% (art. 511), y corregir el proceso evita la reiteración.'}],
   siguiente:'t19'},
  {id:'t19',tipo:'abierta',titulo:'Mirar el caso completo',corto:'Analizar',verbo:'Analiza',competencia:'m1',
   escena:'<p>Cerrada la fiscalización, la gerencia pide a Camila un informe breve para que lo ocurrido en Soporte no se repita.</p>',
   consigna:'el caso completo: qué decisiones de la jefatura generaron riesgos legales en cada etapa (horas extra, ajuste de horario, conducta hacia Javier, propuesta de despedirlo, término de Mauricio y fiscalización), qué norma o principio aplicaste para corregirlas, qué cambios de proceso evitan que se repita y qué evidencia debe conservar Horizonte y por qué.',minPalabras:60,
   modelo:'El caso partió con una práctica del área: compensar el sobretiempo saliendo antes y hacer firmar una "renuncia" a las horas extra. Ese documento no produce efecto, porque los derechos laborales son irrenunciables mientras subsiste el contrato; las 6,5 horas de septiembre se pagan con recargo y cualquier sobretiempo futuro requiere pacto escrito, temporal, de hasta 3 meses y máximo 2 horas diarias, con un registro que muestre la salida real. El ajuste de horario de Javier era un derecho de conciliación y no un favor. La reacción de Mauricio (humillarlo en público y excluirlo de la asignación de trabajo) pasó del conflicto al posible acoso laboral: correspondía recibir la denuncia verbal con acta, adoptar medidas de resguardo que no perjudicaran a Javier e investigar en 30 días hábiles. Despedir a Javier habría sido una represalia contraria a la garantía de indemnidad. El término de Mauricio debía fundarse en los hechos acreditados (art. 160 N°1 letra f), con carta completa y cotizaciones pagadas. Cuando la Inspección citó a la empresa, la carpeta mostró que la práctica de Mauricio seguía viva en otros técnicos, que el sistema no reflejaba el anexo de horario de Javier y que un contrato no estaba escriturado: correspondía presentar los documentos reales, pagar y regularizar, y no construir documentos; corregir dentro de 15 días desde la notificación rebaja la multa a lo menos en 50%. Para que no se repita hay que corregir el proceso: marcar siempre la salida real, actualizar el sistema con cada anexo, controlar los plazos de contratación y asignar responsables. La evidencia que Horizonte debe conservar, coherente entre sí: contratos y anexos, pactos de horas extra, registro de asistencia, liquidaciones, solicitud y anexo del nuevo horario, acta de la denuncia, medidas de resguardo, informe de investigación y pronunciamiento de la Inspección, carta de término con comprobantes y finiquito. Se conserva porque el finiquito de Mauricio tiene reserva de derechos y porque, según el art. 510, las acciones derivadas del contrato prescriben en 6 meses desde el término de los servicios y los derechos en 2 años desde que se hicieron exigibles.',
   criterios:['Identifica al menos un riesgo legal en cada módulo del caso (horas extra, conciliación, acoso, represalia, término y fiscalización).','Relaciona cada riesgo con la norma o principio que lo corrige (irrenunciabilidad, pacto y registro, banda horaria, Ley Karin, indemnidad, causal y carta, corrección y rebaja de la multa).','Distingue corregir el caso (pagar y regularizar) de corregir la causa (el proceso que lo generó).','Enumera la evidencia coherente que debe conservarse y explica por qué (reserva de derechos y prescripción).']}
 ],
 cierre:'<b>Idea integradora:</b> cada decisión laboral sigue la misma ruta: primero los <b>hechos</b> (con evidencia), luego el <b>derecho</b> en juego, después los <b>límites legales</b> (irrenunciabilidad, plazos, formalidades y derechos fundamentales) y, al final, una <b>decisión documentada</b>. Así, un reclamo por horas extra no se convierte en una represalia, una denuncia o un despido mal fundado. Y cuando llega la <b>fiscalización</b>, la empresa no “arma” la carpeta: muestra <b>documentos reales y coherentes</b> (contrato, anexos, registro, liquidaciones, actas, carta y finiquito), paga y regulariza lo que falta y <b>corrige el proceso</b> para que no se repita. La evidencia también es cumplimiento.'
};
