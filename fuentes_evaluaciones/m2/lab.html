<script>
(function(){
const PASS_PCT=80;
const CASO={
 tipo:'laboratorio',codigo:'M2_LAB',
 curso:'LEGISLACIÓN LABORAL · MÓDULO 2 · EVALUACIÓN · LABORATORIO',
 eyebrow:'Evaluación del módulo 2 · Parte 2',
 titulo:'La auditoría de jornada y sueldo de Felipe',
 contexto:'<p>Es la segunda semana de octubre de 2026 en Horizonte Servicios. Felipe Aravena, coordinador de Soporte, consultó por qué su liquidación de octubre trae menos horas extra de las que trabajó y un descuento por un celular que le robaron. La Gerencia de Personas le pide a Camila, del Equipo de Personas, <b>auditar su jornada y el borrador de su liquidación</b> antes del cierre de remuneraciones.</p><p>Vas a resolver con ella <b>10 tareas</b> usando los documentos del <b>expediente</b> (a la derecha o al final en el celular). Ábrelos cada vez que una tarea los mencione. Ten a mano una calculadora.</p>',
 objetivos:['<b>Revisar</b> si la jornada de Felipe respeta el límite vigente y cómo se aplicó la rebaja a 42 horas.','<b>Validar</b> el pacto y el registro de asistencia, y calcular el pago de las horas extraordinarias.','<b>Clasificar</b> haberes y descuentos de la liquidación y verificar los topes del artículo 58.'],
 comoSeEvalua:'cada tarea se responde una sola vez y verás de inmediato su retroalimentación. Las tareas de clasificar, ordenar, seleccionar y calcular dan puntaje proporcional a tus aciertos. La respuesta de desarrollo no tiene nota automática: verás una respuesta modelo y criterios para revisar la tuya. Necesitas <strong>80%</strong> de los puntos para aprobar.',
 tiempo:'25–30 min',resumen:'10 tareas · 23 puntos',
 expediente:[
  {titulo:'Encargo de la Gerencia de Personas',html:'<p>"Camila: Felipe Aravena reclamó por su liquidación de octubre. Revisa su jornada, el pacto de horas extra, el registro de asistencia y el borrador de la liquidación, y déjame una observación con lo que haya que corregir antes del cierre. <b>Usa solo lo que muestren los documentos.</b>"</p>'},
  {titulo:'Ficha del cargo y contrato de Felipe',html:'<table><tr><th>Dato</th><th>Detalle</th></tr><tr><td>Cargo</td><td>Coordinador de Soporte</td></tr><tr><td>Contrato</td><td>Indefinido · sueldo base <b>$960.000</b> mensuales</td></tr><tr><td>Jornada</td><td><b>42 horas</b> semanales, lunes a viernes de <b>08:00 a 17:24</b>, colación de 13:00 a 14:00 (8 h 24 min diarios)</td></tr><tr><td>Funciones reales</td><td>Atiende y deriva tickets. La jefatura de TI le asigna los tickets cada mañana y revisa su avance dos veces al día en el sistema. Marca entrada y salida. No tiene facultades de administración ni de representación de la empresa.</td></tr><tr><td>Previsión</td><td>AFP: 10% + 1,25% de comisión (11,25%) · Salud: Fonasa 7% · Afiliado al sindicato</td></tr></table><p><b>Correo de la jefatura de TI (Ricardo Fuenzalida):</b> "Felipe es coordinador, así que está fuera del límite de jornada. No corresponde pagarle horas extra".</p>'},
  {titulo:'Anexo de jornada del equipo de Soporte (abril de 2026)',html:'<p>"Hasta el 25.04.2026 la jornada del equipo es de <b>44 horas</b>, de lunes a viernes de 08:00 a 17:48, con colación de 13:00 a 14:00. <b>No se alcanzó acuerdo</b> con el equipo para implementar la reducción a 42 horas. Por eso, desde el 26.04.2026 la empresa <b>reduce 24 minutos al término de cada día</b>: la salida pasa a ser a las 17:24."</p>'},
  {titulo:'Pacto de horas extra y propuesta de renovación',html:'<p><b>Pacto vigente</b> (firmado por Felipe el 31.08.2026): horas extraordinarias para la <b>migración del sistema de tickets</b>, vigencia del 01.09.2026 al <b>30.11.2026</b>, máximo <b>2 horas por día</b>, recargo legal de 50%.</p><p><b>Correo de Ricardo (jefatura de TI):</b> "La migración terminó, pero el volumen de tickets siguió alto y va a ser así siempre. Renovemos el pacto de todo el equipo por <b>6 meses</b>, con hasta <b>3 horas diarias</b>. Y si alguien hace horas de más, que salga antes otro día y nos ahorramos el pago".</p>'},
  {titulo:'Registro de asistencia · semana del 5 al 9 de octubre',html:'<p>Sistema electrónico de registro. Horario pactado: 08:00 a 17:24.</p><table><tr><th>Día</th><th>Entrada</th><th>Salida</th><th>Observación</th></tr><tr><td>Lunes 5</td><td>08:00</td><td>18:39</td><td>Solicitud de la jefatura por correo</td></tr><tr><td>Martes 6</td><td>08:00</td><td>17:24</td><td>—</td></tr><tr><td>Miércoles 7</td><td>08:00</td><td>19:24</td><td>Solicitud de la jefatura por correo</td></tr><tr><td>Jueves 8</td><td>08:00</td><td>17:24</td><td>—</td></tr><tr><td>Viernes 9</td><td>08:00</td><td>17:24 <b>(corregida)</b></td><td>Corrección hecha por la jefatura el 13.10. Marcación original: <b>18:24</b>. Motivo: "ajuste a horario".</td></tr></table><p><b>Correo de Ricardo a Felipe, viernes 9 de octubre, 16:50:</b> "Felipe, antes de irte deja cerrada la migración de usuarios del cliente Los Andes. Es urgente."</p>'},
  {titulo:'Borrador de liquidación · octubre de 2026',html:'<p><b>Felipe Aravena</b> · contrato indefinido</p><table><tr><th>Haberes</th><th>Monto</th></tr><tr><td>Sueldo base</td><td>$960.000</td></tr><tr><td>Horas extraordinarias (8 h)</td><td>$64.000</td></tr><tr><td>"Asignación especial no imponible" ($400 por cada ticket resuelto; 120 tickets)</td><td>$48.000</td></tr><tr><td>Asignación de colación</td><td>$55.000</td></tr><tr><td>Asignación de movilización</td><td>$35.000</td></tr><tr><td>Devolución de gastos: peajes y estacionamiento en visita a cliente (con boletas)</td><td>$18.000</td></tr><tr><td><b>Total haberes</b></td><td><b>$1.180.000</b></td></tr></table><table><tr><th>Descuentos</th><th>Monto</th></tr><tr><td>AFP 11,25%</td><td>$115.200</td></tr><tr><td>Salud Fonasa 7%</td><td>$71.680</td></tr><tr><td>Seguro de Cesantía 0,6%</td><td>$6.144</td></tr><tr><td>Cuota sindical</td><td>$10.240</td></tr><tr><td>"Cotización del empleador Ley 21.735 (3,5%)"</td><td>$35.840</td></tr><tr><td>Cuota de crédito sin interés de la empresa para estudios</td><td>$120.000</td></tr><tr><td>Convenio dental</td><td>$22.000</td></tr><tr><td>Compra en convenio con tienda de tecnología</td><td>$150.000</td></tr><tr><td>Reposición del celular corporativo</td><td>$85.000</td></tr><tr><td><b>Total descuentos</b></td><td><b>$616.104</b></td></tr></table><p><b>Líquido a pagar: $563.896</b></p><p><small>Los descuentos legales del borrador se calcularon sobre $1.024.000 (sueldo + 8 h extra).</small></p>'},
  {titulo:'Autorizaciones y antecedentes de los descuentos',html:'<table><tr><th>Descuento</th><th>Antecedente</th></tr><tr><td>Crédito sin interés para estudios</td><td>Autorización escrita de Felipe. La empresa paga la cuota <b>directamente al instituto</b>.</td></tr><tr><td>Convenio dental</td><td>Autorización escrita de Felipe.</td></tr><tr><td>Compra en tienda de tecnología</td><td>Autorización escrita de Felipe por una cuota de $150.000 mensuales.</td></tr><tr><td>Reposición del celular</td><td>Sin autorización de Felipe. El celular le fue robado en un asalto en la vía pública mientras iba a un cliente; hay denuncia policial.</td></tr><tr><td>Cotización del empleador 3,5%</td><td>Nota de Finanzas: "Para no subir el costo de la empresa, lo descontamos del sueldo".</td></tr></table>'}
 ],
 competencias:[
  {id:'jo',nombre:'Organizar la jornada',fortaleza:'aplicas el límite de 42 horas, las exclusiones del artículo 22 y la regla de rebaja sin acuerdo.',mejora:'repasa el límite vigente, cuándo una persona está excluida de la limitación de jornada y cómo se aplica la rebaja sin acuerdo.',repasar:'Lecciones 2.4 y 2.5'},
  {id:'he',nombre:'Horas extraordinarias',fortaleza:'validas el pacto de horas extra y calculas su pago con la fórmula correcta.',mejora:'repasa los requisitos del pacto (escrito, temporal, 3 meses, 2 horas diarias) y la fórmula del valor de la hora extra.',repasar:'Lección 2.6'},
  {id:'rg',nombre:'Registro de asistencia',fortaleza:'usas el registro como evidencia y sabes tratar una corrección de marcación.',mejora:'repasa por qué el registro es la evidencia central y cómo deben quedar trazadas las correcciones.',repasar:'Lección 2.7'},
  {id:'re',nombre:'Leer una remuneración',fortaleza:'distingues los pagos que son remuneración de los que compensan un gasto.',mejora:'repasa el artículo 41: la naturaleza de un pago depende de su causa y finalidad, no de su nombre.',repasar:'Lección 2.8'},
  {id:'de',nombre:'Descuentos y topes',fortaleza:'distingues descuentos obligatorios, convencionales y prohibidos, y verificas sus topes.',mejora:'repasa el artículo 58: descuentos obligatorios, convencionales con acuerdo escrito, prohibiciones y topes de 15%, 30% y 45%.',repasar:'Lecciones 2.8 y 2.9'}
 ],
 inicio:'t1',
 etapas:[
  {id:'t1',tipo:'decision',titulo:'¿Felipe está fuera del límite de jornada?',corto:'Exclusión art. 22',competencia:'jo',
   escena:'<p>Abre la <b>ficha del cargo y contrato de Felipe</b>. La jefatura de TI sostiene que, por ser "coordinador", Felipe está excluido del límite de jornada y no le corresponden horas extra.</p>',
   pregunta:'¿Qué concluye Camila?',
   ideal:'Felipe está sujeto al límite de 42 horas: tiene horario fijo, marca asistencia y su jefatura controla directa y efectivamente su trabajo; el nombre del cargo no lo excluye. Sus horas extra deben pagarse.',
   opciones:[
    {texto:'Tiene razón la jefatura: un coordinador organiza su propio trabajo, así que queda excluido del artículo 22.',pts:0,fb:'La exclusión se califica según las funciones reales, no según el nombre del cargo. Felipe tiene horario fijo, marca asistencia y la jefatura le asigna y revisa los tickets: hay control directo y efectivo.',siguiente:'t2'},
    {texto:'Felipe está sujeto al límite de 42 horas: tiene horario fijo, marca asistencia y su jefatura le asigna tareas y revisa su avance a diario. El nombre "coordinador" no lo excluye, y sus horas extra deben pagarse.',pts:2,fb:'Correcto. Según la Dirección del Trabajo (Dictamen N°252/20), lo relevante es si existe en la práctica un control directo, funcional y efectivamente ejercido sobre el trabajo. Aquí existe, así que rige la regla general.',siguiente:'t2'},
    {texto:'Felipe está sujeto al límite, porque su contrato no dice "gerente".',pts:1,fb:'La conclusión es correcta, pero el criterio no: la exclusión no depende del título del cargo, sino de las funciones reales y de si hay fiscalización superior inmediata.',siguiente:'t2'}]},
  {id:'t2',tipo:'decision',titulo:'La rebaja de abril de 2026',corto:'Rebaja sin acuerdo',competencia:'jo',
   escena:'<p>Abre el <b>anexo de jornada del equipo de Soporte</b>. En abril, sin acuerdo con el equipo, la empresa pasó de 44 a 42 horas restando 24 minutos al final de cada día.</p>',
   pregunta:'¿Qué concluye Camila sobre la forma en que se aplicó la rebaja?',
   ideal:'sin acuerdo y con jornada de 5 días, la rebaja se aplica al término de la jornada en unidades de 1 hora en dos días distintos; no corresponde fragmentarla en 24 minutos diarios. Hay que regularizarlo: buscar un acuerdo con el equipo o aplicar la regla supletoria, dejando constancia.',
   opciones:[
    {texto:'Está bien: 24 minutos por 5 días suman 120 minutos y la semana queda en 42 horas.',pts:0,fb:'La suma cuadra, pero la forma no. Sin acuerdo, la doctrina de la Dirección del Trabajo (Dictamen N°142/09, ratificado por el N°253/21) no permite fragmentar la rebaja en unidades menores, como 24 minutos diarios.'},
    {texto:'Conviene corregirlo pasando a cuatro días de 10,5 horas, para que el equipo tenga el viernes libre.',pts:0,fb:'En 2026 la distribución en 4 días no es la regla general y 10,5 horas superan el máximo de 10 horas ordinarias diarias.'},
    {texto:'No se aplicó bien: sin acuerdo y con jornada de 5 días, la rebaja es de 1 hora al término de la jornada en dos días distintos. Hay que regularizarlo, buscando un acuerdo con el equipo o aplicando esa regla, y dejar constancia.',pts:2,fb:'Correcto. La ley privilegia el acuerdo; sin él, la rebaja se aplica al término de la jornada en unidades de 1 hora diaria en dos días distintos (art. 3° transitorio de la Ley 21.561, interpretado por el art. 24 de la Ley 21.755).'}],
   siguiente:'t3'},
  {id:'t3',tipo:'decision',titulo:'La renovación del pacto de horas extra',corto:'Pacto de horas extra',competencia:'he',
   escena:'<p>Abre el <b>pacto de horas extra y propuesta de renovación</b>. El pacto de Felipe vence el 30 de noviembre y la jefatura quiere renovarlo con otras condiciones.</p>',
   pregunta:'¿Qué responde Camila a la jefatura de TI?',
   ideal:'no renovar en esos términos: un pacto solo cubre necesidades temporales, dura como máximo 3 meses y permite hasta 2 horas diarias; si el sobretiempo es permanente, hay que revisar la organización del trabajo, y "salir antes otro día" sin pacto escrito no reemplaza el pago.',
   opciones:[
    {texto:'Firmar la renovación tal como viene, porque constará por escrito.',pts:0,fb:'Constar por escrito no basta: 6 meses superan el máximo de 3 meses, 3 horas diarias superan el máximo de 2, y la necesidad ya no es temporal. Además, compensar con salidas anticipadas sin pacto escrito no es válido.'},
    {texto:'Renovar por 3 meses con hasta 2 horas diarias y pagarlas con recargo, sin revisar la carga del equipo.',pts:1,fb:'Respeta los límites de duración y horas diarias, pero la jefatura reconoce que la necesidad es permanente. Un pacto solo cubre situaciones temporales; renovarlo indefinidamente en vez de revisar dotación y turnos mantiene el problema.'},
    {texto:'No renovar en esos términos: el pacto es para necesidades temporales, dura como máximo 3 meses y permite hasta 2 horas diarias. Si el sobretiempo es permanente, hay que revisar dotación y turnos; y "salir antes otro día" sin pacto escrito no reemplaza el pago.',pts:2,fb:'Correcto (arts. 31 y 32 del Código del Trabajo). La única compensación alternativa al pago es el feriado adicional pactado por escrito, con un máximo de 5 días hábiles al año.'}],
   siguiente:'t4'},
  {id:'t4',tipo:'multi',titulo:'Una marcación corregida',corto:'Revisar el registro',competencia:'rg',pts:3,
   escena:'<p>Abre el <b>registro de asistencia de la semana del 5 al 9 de octubre</b>. La salida del viernes fue corregida por la jefatura de 18:24 a 17:24 con el motivo "ajuste a horario". Ese día, a las 16:50, la jefatura le pidió a Felipe cerrar una tarea urgente antes de irse.</p>',
   pregunta:'¿Qué afirmaciones son correctas? Marca todas las que correspondan.',
   items:[
    {texto:'La marcación original de 18:24 debe conservarse: toda corrección debe estar justificada y dejar trazabilidad.',ok:true,fb:'Un sistema electrónico debe conservar la marcación original y registrar cada corrección (Res. Ex. DT N°38 de 2024).'},
    {texto:'El correo de las 16:50 es un antecedente de que Felipe se quedó después de las 17:24 a pedido de la jefatura.',ok:true,fb:'El registro se complementa con los demás antecedentes del día, como este correo.'},
    {texto:'Si se confirma, la hora entre 17:24 y 18:24 es extraordinaria y se paga con recargo en la liquidación de octubre.',ok:true,fb:'Se trabajó con conocimiento del empleador y dentro del pacto: se paga junto con las remuneraciones del período.'},
    {texto:'"Ajuste a horario" es un motivo suficiente: el registro debe coincidir con el horario del contrato.',ok:false,fb:'Al revés: el contrato muestra lo planificado y el registro lo ocurrido. Ajustar la marcación al plan destruye evidencia y puede ser una infracción grave.'},
    {texto:'Para evitar discrepancias, desde ahora Felipe debería informar su salida por WhatsApp a la jefatura.',ok:false,fb:'Un chat no es un registro de asistencia válido: no cumple las exigencias del artículo 33 ni de la Resolución N°38.'},
    {texto:'La hora puede compensarse dejando salir a Felipe una hora antes el lunes siguiente, sin dejar registro.',ok:false,fb:'"Salir antes otro día" sin pacto escrito no es una forma válida de pago de horas extraordinarias.'}],
   fb:'El registro de asistencia es la evidencia central: la marcación de 18:24 y el correo de las 16:50 indican una hora extraordinaria que debe pagarse.',siguiente:'t5'},
  {id:'t5',tipo:'ordenar',titulo:'Los pasos del cálculo',corto:'Ordenar el cálculo',competencia:'he',pts:2,
   escena:'<p>Antes de calcular, Camila escribe los pasos de la fórmula que usa la Dirección del Trabajo para un sueldo mensual: <b>(sueldo ÷ 30 × 28) ÷ (horas semanales × 4) × 1,5</b>.</p>',
   pregunta:'Indica en qué posición va cada paso (1º es el primero).',
   items:[
    {texto:'Calcular el sueldo de 28 días: sueldo mensual ÷ 30 × 28.',fb:'Se lleva el sueldo mensual a 28 días, que equivalen a 4 semanas.'},
    {texto:'Dividir por las horas ordinarias de 4 semanas (horas semanales × 4) para obtener el valor de la hora ordinaria.',fb:'Con 42 horas semanales, se divide por 168 horas.'},
    {texto:'Aplicar el recargo: valor de la hora ordinaria × 1,5.',fb:'El recargo legal mínimo es 50% (las partes pueden pactar uno mayor).'},
    {texto:'Multiplicar el valor de la hora extra por las horas extraordinarias trabajadas.',fb:'Se usan las horas confirmadas en el registro de asistencia.'},
    {texto:'Pagar el monto junto con la remuneración del período en que se trabajaron.',fb:'Las horas extra no se acumulan para otro mes.'}],
   fb:'La fórmula transforma el sueldo mensual en un valor por hora, le aplica el recargo y luego lo multiplica por las horas extra del período.',siguiente:'t6'},
  {id:'t6',tipo:'numero',titulo:'Las horas extra de la semana',corto:'Calcular horas extra',competencia:'he',pts:3,
   escena:'<p>Usa el <b>registro de asistencia</b> y la <b>ficha de Felipe</b> (sueldo $960.000, 42 horas, salida pactada a las 17:24). Considera confirmada la hora del viernes, según la marcación original.</p>',
   pregunta:'Calcula (solo números; las horas en formato decimal, por ejemplo 2,5).',
   campos:[{label:'a) Valor de una hora extraordinaria de Felipe ($)',valor:8000,tol:1,unidad:'$'},{label:'b) Total de horas extraordinarias de la semana (horas, decimal)',valor:4.25,tol:0.01,unidad:'horas'},{label:'c) Monto a pagar por las horas extra de la semana ($)',valor:34000,tol:5,unidad:'$'}],
   solucion:'<b>a) $8.000.</b> $960.000 ÷ 30 × 28 = $896.000; ÷ (42 × 4 = 168) = $5.333,33 por hora ordinaria; × 1,5 = <b>$8.000</b>. <b>b) 4,25 horas:</b> lunes 17:24 → 18:39 = 1 h 15 min (1,25 h); miércoles 17:24 → 19:24 = 2 h; viernes 17:24 → 18:24 = 1 h (marcación original). Martes y jueves no hay horas extra. Total 1,25 + 2 + 1 = 4,25 h. <b>c) $34.000</b> = 4,25 × $8.000. Ninguno de los días supera el máximo de 2 horas extraordinarias diarias.',siguiente:'t7'},
  {id:'t7',tipo:'clasificar',titulo:'Los haberes de octubre',corto:'Clasificar haberes',competencia:'re',pts:3,
   escena:'<p>Abre el <b>borrador de liquidación de octubre</b>. Considera que la colación y la movilización tienen montos razonables para su finalidad.</p>',
   pregunta:'Clasifica cada haber según su naturaleza real.',
   categorias:['Remuneración imponible','No es remuneración: no imponible (art. 41 inc. 2)'],
   items:[
    {texto:'Sueldo base · $960.000',cat:0,fb:'El sueldo retribuye el trabajo (art. 42).'},
    {texto:'Horas extraordinarias · $64.000',cat:0,fb:'Las horas extra son sobresueldo: remuneración (art. 42).'},
    {texto:'"Asignación especial no imponible" · $400 por ticket resuelto · $48.000',cat:0,fb:'Se calcula por resultados y premia el trabajo: es remuneración imponible, aunque se llame "no imponible". La etiqueta no cambia su naturaleza.'},
    {texto:'Asignación de colación · $55.000',cat:1,fb:'Compensa un gasto y su monto es razonable: no es remuneración (art. 41 inc. 2).'},
    {texto:'Asignación de movilización · $35.000',cat:1,fb:'Compensa el costo de traslado y su monto es razonable: no es remuneración.'},
    {texto:'Devolución de peajes y estacionamiento con boletas · $18.000',cat:1,fb:'Es una devolución de gastos en que se incurrió por causa del trabajo: no es remuneración.'}],
   fb:'La naturaleza de un pago depende de su causa y finalidad, no de su nombre. El bono por tickets debe tratarse como imponible, y los descuentos legales deben recalcularse sobre la base corregida.',siguiente:'t8'},
  {id:'t8',tipo:'clasificar',titulo:'Los descuentos del borrador',corto:'Clasificar descuentos',competencia:'de',pts:3,
   escena:'<p>Revisa los descuentos del <b>borrador de liquidación</b> y las <b>autorizaciones y antecedentes de los descuentos</b>. Recuerda que Felipe está afiliado al sindicato.</p>',
   pregunta:'Clasifica cada descuento.',
   categorias:['Obligatorio: el empleador debe descontarlo','Convencional: procede solo con acuerdo escrito y dentro de los topes','No procede: prohibido o de cargo del empleador'],
   items:[
    {texto:'AFP 11,25%',cat:0,fb:'Cotización de seguridad social de cargo de la persona trabajadora (art. 58 inc. 1).'},
    {texto:'Salud Fonasa 7%',cat:0,fb:'Cotización de salud de cargo de la persona trabajadora.'},
    {texto:'Seguro de Cesantía 0,6% (contrato indefinido)',cat:0,fb:'En contrato indefinido, la persona trabajadora aporta 0,6% (Ley 19.728).'},
    {texto:'Cuota sindical',cat:0,fb:'Las cuotas sindicales son descuentos obligatorios del art. 58 inc. 1.'},
    {texto:'"Cotización del empleador Ley 21.735 (3,5%)"',cat:2,fb:'Es un aporte de cargo del empleador: no puede descontarse del sueldo.'},
    {texto:'Cuota de crédito sin interés para estudios, pagada por la empresa directamente al instituto',cat:1,fb:'Con acuerdo escrito y pago directo a la institución, puede descontarse hasta 30% de la remuneración mensual.'},
    {texto:'Convenio dental con autorización escrita',cat:1,fb:'Pago de cualquier naturaleza acordado por escrito: tope de 15% de la remuneración total.'},
    {texto:'Compra en tienda de tecnología con autorización escrita',cat:1,fb:'Pago de cualquier naturaleza acordado por escrito: entra en el mismo tope de 15%.'},
