 objetivos:['<b>Describir</b> qué debe quedar registrado en el acta de una denuncia verbal.','<b>Elegir</b> medidas de resguardo que protejan sin perjudicar ni prejuzgar.','<b>Explicar</b> a la persona denunciante cómo sigue el procedimiento y qué plazos corren.'],
 tiempo:'25–30 min',resumen:'5 decisiones · 2 respuestas de desarrollo',
 expediente:[
  {titulo:'Mensaje de Sofía por el chat interno (martes, 9:10)',html:'<p>"Hola, Camila. ¿Podemos conversar hoy en privado? Necesito contarte algo que me está pasando con una persona de Logística y no sé cómo hacerlo por escrito."</p>'},
  {titulo:'Ficha de puestos de las personas involucradas',html:'<table><tr><th>Persona</th><th>Cargo y área</th><th>Lugar de trabajo</th></tr><tr><td>Sofía</td><td>Asistente administrativa · Administración</td><td>Piso 3, planta abierta</td></tr><tr><td>Gonzalo</td><td>Coordinador · Logística (no tiene cargo gerencial ni representa al empleador)</td><td>Piso 3, planta abierta</td></tr></table><p>Ambos asisten a la reunión semanal de coordinación de los lunes. Sofía no depende de Gonzalo.</p>'},
  {titulo:'Extracto del protocolo de Horizonte Servicios',html:'<ul><li>Canales de denuncia: presencial en el Equipo de Personas o por correo. También se puede denunciar directamente en la Inspección del Trabajo.</li><li>Investigación interna: a cargo de una persona capacitada y sin conflicto de interés con las partes.</li><li>Atención psicológica temprana: a través de la mutualidad de la empresa (organismo administrador de la Ley 16.744).</li></ul>'},
  {titulo:'Reglas legales clave (Ley 21.643, Ley Karin)',html:'<ul><li>La denuncia puede ser <b>escrita o verbal</b>, ante la empresa o la Inspección del Trabajo. Si es verbal, se levanta un <b>acta</b> que firma la persona denunciante y se le entrega <b>copia</b>.</li><li>La denuncia debe <b>individualizar a la persona denunciante</b> y describir los hechos.</li><li>Al recibirla, la empresa <b>informa el procedimiento</b> y adopta <b>de inmediato medidas de resguardo</b>, que no pueden perjudicar a la persona denunciante.</li><li>La empresa investiga internamente o, <b>dentro de 3 días hábiles</b>, remite los antecedentes a la Inspección del Trabajo.</li><li>La investigación concluye en <b>30 días hábiles</b> y es confidencial. No se permiten represalias contra quien denuncia o declara.</li></ul>'}
 ],

  {id:'e1',tipo:'decision',titulo:'"No sé cómo escribirlo"',corto:'Recepción',competencia:'rec',
   escena:'<p>Sofía llega al Equipo de Personas. Con voz baja cuenta que, desde hace un mes, Gonzalo le envía mensajes con comentarios de carácter sexual por el chat interno y por teléfono. Ella le pidió que se detuviera y él siguió; además, le dijo que "conoce a quienes evalúan" su desempeño. Sofía dice: "Quiero denunciar, pero no sé cómo escribirlo".</p><p>Una jefatura que está cerca le comenta a Camila: "Mejor que lo mande por correo, así queda formal".</p>',
   pregunta:'¿Qué hace Camila?',
   ideal:'recibir la denuncia verbal en un lugar privado, escuchar sin juzgar, levantar un acta con el relato de Sofía, leérsela, pedirle que la firme y entregarle una copia.',

    {texto:'Le pide que lo envíe por correo cuando pueda ordenar sus ideas, para que la denuncia quede "formal".',pts:0,fb:'La denuncia puede presentarse verbalmente: no se puede exigir un escrito. Postergarla deja a Sofía sin recibir y retrasa las medidas de resguardo que la empresa le debe.',siguiente:'e2b'},
    {texto:'La invita a una sala privada, la escucha sin juzgar y levanta un acta con su relato; se la lee, Sofía la firma y recibe una copia.',pts:2,fb:'Correcto: la denuncia verbal se registra en un acta que firma la persona denunciante, quien recibe copia. El trato digno y en privado es parte del procedimiento.',siguiente:'e2a'},
    {texto:'Antes de registrar nada, llama a Gonzalo para escuchar "las dos versiones".',pts:0,fb:'Recibir no es investigar. Contactar a la persona denunciada antes de recibir la denuncia rompe la confidencialidad y puede exponer a Sofía. Ambas partes se escuchan después, en la investigación.',siguiente:'e2b'},
    {texto:'La escucha en su escritorio y anota lo principal en su cuaderno, sin acta ni firma.',pts:1,fb:'Escuchar está bien, pero sin un lugar privado y sin acta firmada con copia, la denuncia no queda registrada como exige la ley y Sofía no tiene respaldo.',siguiente:'e2b'}]},
  {id:'e2a',tipo:'decision',titulo:'"¿Puede ser anónima?"',corto:'Identificación',competencia:'rec',

    {texto:'"Tu nombre tiene que estar en el acta", sin más explicación.',pts:1,fb:'Es cierto que debe identificarse, pero sin explicarle cómo se protegerá su información, Sofía puede desistir por temor.',siguiente:'e3'},
    {texto:'Le explica que la denuncia debe identificarla, pero que el procedimiento es confidencial: solo conocerán los antecedentes quienes participen en la investigación, y no se permiten represalias por denunciar.',pts:2,fb:'Correcto: individualizar a la persona denunciante es un requisito, y la confidencialidad y la garantía de indemnidad son las que la protegen.',siguiente:'e3'}]},
  {id:'e2b',tipo:'decision',titulo:'Sofía vuelve al día siguiente',corto:'Corregir el rumbo',competencia:'rec',

    {texto:'Le dice que, si va a la Inspección, la empresa ya no puede hacer nada por ella.',pts:0,fb:'Sofía tiene derecho a denunciar en la Inspección del Trabajo, y la empresa mantiene su deber de protegerla. Desalentarla es un nuevo obstáculo.',siguiente:'e3'},

  {id:'e3',tipo:'abierta',titulo:'El acta de la denuncia verbal',corto:'Describir el acta',verbo:'Describe',competencia:'rec',
   escena:'<p>El acta de Sofía quedará en el expediente del procedimiento. Revisa en el expediente la <b>ficha de puestos</b> y las <b>reglas legales clave</b>.</p>',

   criterios:['Individualiza a la persona denunciante y, en lo posible, a la persona denunciada.','Describe los hechos con las palabras de Sofía, sin juicios de quien recibe.','Menciona antecedentes que puede aportar (por ejemplo, los mensajes).','Incluye la firma de Sofía, la copia y el registro de la información entregada y del resguardo.'],siguiente:'e4'},
  {id:'e4',tipo:'decision',titulo:'Las medidas de resguardo',corto:'Resguardo',competencia:'res',
   escena:'<p>Sofía y Gonzalo trabajan en la misma planta abierta del piso 3 y coinciden en la reunión de coordinación de los lunes. La jefatura de Administración propone: "Para que esté tranquila, mandémosla a la sucursal de Puente Alto con media jornada mientras se investiga".</p>',
   pregunta:'¿Qué medidas adopta la empresa de inmediato?',
   ideal:'separar los espacios de trabajo y redistribuir la jornada para que no coincidan, sin cambiar el cargo ni la remuneración de ninguna de las dos personas, y derivar a Sofía a atención psicológica temprana en la mutualidad.',
   opciones:[
    {texto:'Acepta la propuesta: traslado de Sofía a Puente Alto con media jornada.',pts:0,fb:'Una medida de resguardo no puede ser gravosa ni perjudicial para la persona denunciante. Reducir su jornada y alejarla de su puesto le traslada el costo de haber denunciado.',siguiente:'e5b'},
    {texto:'Ubica sus puestos en pisos distintos y organiza la reunión de los lunes para que no coincidan, sin cambiar el cargo ni la remuneración de nadie, y deriva a Sofía a atención psicológica temprana en la mutualidad.',pts:2,fb:'Correcto: separar espacios, redistribuir la jornada y derivar a atención psicológica temprana son ejemplos legales de medidas que protegen sin perjudicar y sin sancionar por adelantado.',siguiente:'e5a'},
    {texto:'Solo le ofrece la derivación psicológica y deja todo lo demás igual.',pts:1,fb:'La derivación es una buena medida, pero Sofía sigue compartiendo espacio y reuniones con la persona denunciada. Hay que considerar la seguridad de las personas y las condiciones de trabajo.',siguiente:'e5b'},
    {texto:'No adopta medidas hasta que termine la investigación, "para no prejuzgar".',pts:0,fb:'Las medidas de resguardo se adoptan de inmediato al recibir la denuncia. Proteger no es prejuzgar: no son una sanción para la persona denunciada.',siguiente:'e5b'}]},
  {id:'e5a',tipo:'decision',titulo:'¿Investigar o remitir?',corto:'Investigar o remitir',competencia:'pro',
   escena:'<p>Con las medidas en marcha, la gerencia le escribe a Camila: "Decidamos a fin de mes si investigamos nosotros o si lo mandamos a la Inspección del Trabajo".</p>',

   opciones:[
    {texto:'Que se decida dentro de 3 días hábiles: investigación interna con una persona capacitada y sin conflicto de interés, o remisión a la Inspección del Trabajo, informándolo a Sofía.',pts:2,fb:'Correcto: la empresa dispone la investigación interna o, dentro de 3 días hábiles, remite los antecedentes a la Inspección del Trabajo. Gonzalo no representa al empleador, así que ambas vías son posibles.',siguiente:'e6'},
    {texto:'Que se decida a tiempo, encargando la investigación a la jefatura directa de Sofía porque "la conoce bien".',pts:1,fb:'Decidir a tiempo es correcto, pero quien investiga no debe tener conflicto de interés con las partes. Una jefatura cercana a una de ellas compromete la imparcialidad.',siguiente:'e6'},
    {texto:'Que está bien esperar a fin de mes para juntar más antecedentes.',pts:0,fb:'El plazo para remitir a la Inspección es de 3 días hábiles. Esperar a fin de mes lo incumple y atrasa la investigación, que debe concluir en 30 días hábiles.',siguiente:'e6'}]},
  {id:'e5b',tipo:'decision',titulo:'"Siento que denunciar no me sirvió"',corto:'Corregir el rumbo',competencia:'res',
   escena:'<p>Unos días después, Sofía pide hablar con Camila. Le dice, con angustia, que la situación actual la tiene muy afectada y que siente que denunciar no le sirvió.</p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'revisar de inmediato las medidas: dejar sin efecto todo cambio que la perjudique, separar espacios y redistribuir la jornada sin afectar cargo ni remuneración, y ofrecer atención psicológica temprana.',
   opciones:[
    {texto:'Le sugiere tomar sus vacaciones mientras dura la investigación.',pts:0,fb:'Usar su feriado le traslada el costo de la denuncia: pierde días de descanso por haber denunciado. Es una medida gravosa.',siguiente:'e6'},
    {texto:'Revisa las medidas de inmediato: deja sin efecto cualquier cambio que la perjudique, separa los espacios y la reunión de los lunes sin afectar cargo ni remuneración, y le ofrece atención psicológica temprana en la mutualidad.',pts:2,fb:'Bien: las medidas deben proteger a Sofía sin causarle menoscabo, considerando la gravedad, la seguridad y las condiciones de trabajo.',siguiente:'e6'},
    {texto:'Le ofrece hablar con la mutualidad y le pide paciencia con lo demás.',pts:1,fb:'La atención psicológica temprana ayuda, pero no corrige el problema de fondo: Sofía necesita medidas que la separen de la situación sin perjudicarla.',siguiente:'e6'}]},
  {id:'e6',tipo:'decision',titulo:'Preguntas en la reunión de jefaturas',corto:'Confidencialidad',competencia:'pro',
   escena:'<p>Una semana después, en la reunión de jefaturas, alguien le pregunta a Camila: "¿Es cierto que Sofía denunció a Gonzalo? Cuéntanos qué pasó, así frenamos los rumores".</p>',
   pregunta:'¿Qué responde Camila?',

    {texto:'Confirma que hay una denuncia y quiénes son las partes, pero sin detalles.',pts:1,fb:'Aunque no da detalles, revelar quiénes son las partes ya expone su privacidad y su honra.',siguiente:'e7'},

  {id:'e7',tipo:'abierta',titulo:'Explicarle a Sofía cómo sigue',corto:'Explicar a Sofía',verbo:'Explica',competencia:'pro',

   modelo:'Sofía: gracias por confiar en nosotros. Tu denuncia quedó registrada en un acta que firmaste y de la que tienes copia. La investigará una persona capacitada y sin conflicto de interés (o la Inspección del Trabajo, si se remite dentro de 3 días hábiles). La investigación debe terminar en 30 días hábiles; ambas partes serán oídas y podrás aportar antecedentes, como los mensajes. Todo es confidencial y no se permiten represalias por denunciar. El informe se envía a la Inspección del Trabajo y, después, la empresa tiene 15 días para aplicar medidas y comunicarlas. Mientras tanto, se mantienen las medidas de resguardo y puedes recibir atención psicológica temprana en la mutualidad.',
   criterios:['Usa un tono respetuoso, sin juicios ni preguntas que la hagan repetir su relato.','Indica quién investiga y el plazo de 30 días hábiles.','Menciona la confidencialidad y la prohibición de represalias.','Señala las medidas de resguardo y la atención psicológica temprana.','Explica el envío del informe a la Inspección y el plazo de 15 días para las medidas.']}
 ],
 cierre:'<b>Idea clave:</b> recibir no es investigar ni resolver. Se recibe con trato digno (por escrito o verbalmente, con acta firmada y copia), se informa el procedimiento, se protege de inmediato sin perjudicar a quien denuncia ni sancionar por adelantado, y se decide dentro de 3 días hábiles quién investiga.'
