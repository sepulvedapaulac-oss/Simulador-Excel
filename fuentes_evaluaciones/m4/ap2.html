  {titulo:'Minuta de rotación de rutas del equipo de Terreno',html:'<table><tr><th>Trimestre</th><th>Regla</th></tr><tr><td>Todos</td><td>Las rutas norte, centro y sur rotan cada trimestre entre los 9 técnicos del equipo, según un sorteo informado por escrito al inicio del año.</td></tr><tr><td>Este trimestre</td><td>A Ignacio y a otros dos técnicos les corresponde la ruta sur.</td></tr></table>'},
  {titulo:'Capturas del chat del equipo (aportadas por Ignacio)',html:'<p>Durante las últimas seis semanas, en el grupo de chat del equipo, dos compañeros publican burlas sobre Ignacio con un apodo que alude a su forma de hablar, y acuerdan "no avisarle" de los cambios de horario de las reuniones. Ignacio pidió en el grupo que pararan; los mensajes continuaron.</p>'},
  {titulo:'Definición legal de acoso laboral (art. 2 CT)',html:'<p>Toda conducta que constituya <b>agresión u hostigamiento</b> ejercida por el <b>empleador o por uno o más trabajadores</b>, en contra de otro u otros trabajadores, por cualquier medio, ya sea que se manifieste <b>una sola vez o de manera reiterada</b>, y que tenga como resultado su <b>menoscabo, maltrato o humillación</b>, o que amenace o perjudique su situación laboral o sus oportunidades en el empleo.</p><p>Asignar tareas, evaluar el desempeño o corregir con respeto es <b>ejercicio legítimo de la dirección</b>. Un conflicto también requiere gestión.</p>'}

   criterios:['Identifica la rotación como facultad de dirección (regla general, informada por escrito).','Revisa en el chat quién ejerce la conducta (compañeros) y que hay hostigamiento.','Relaciona la conducta con el efecto: humillación o menoscabo.','Concluye que el chat es un posible acoso laboral que activa el procedimiento, sin prejuzgar el resultado.'],siguiente:'e4'},
  {id:'e4',tipo:'decision',titulo:'¿Quién investiga?',corto:'Quién investiga',competencia:'inv',
   escena:'<p>Ignacio presenta una denuncia escrita contra los dos compañeros. La empresa decide investigar internamente. Hernán se ofrece: "Yo investigo. Conozco a todos y ya sé que son bromas".</p>',

  {id:'e5a',tipo:'decision',titulo:'Un denunciado sale de vacaciones',corto:'Plazo',competencia:'inv',

    {texto:'Adelanta su entrevista antes de que salga y continúa con las demás diligencias para cumplir los 30 días hábiles.',pts:2,fb:'Correcto: celeridad y debido proceso a la vez. El plazo se cuenta en días hábiles administrativos desde la recepción de la denuncia.',siguiente:'e6'},
    {texto:'Sigue con las demás entrevistas y deja la suya para cuando vuelva, aunque se pase del plazo.',pts:1,fb:'Avanzar con lo demás está bien, pero el plazo no se extiende por el feriado: hay que organizar la entrevista para cumplirlo.',siguiente:'e6'}]},
  {id:'e5b',tipo:'decision',titulo:'"No me siento escuchado"',corto:'Corregir el rumbo',competencia:'inv',
   escena:'<p>A la semana, la gerencia revisa el avance y encuentra dos reclamos: Ignacio siente que "el resultado ya está decidido", y uno de los compañeros denunciados alega que no ha podido dar su versión ni aportar pruebas.</p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'encargar la investigación a una persona capacitada y sin conflicto de interés, oír a ambas partes y permitirles aportar pruebas, sin pedir a Ignacio que repita su relato sin necesidad, y cumplir el plazo de 30 días hábiles.',
   opciones:[

  {id:'e7',tipo:'abierta',titulo:'Una conversación con Hernán',corto:'Explicar',verbo:'Explica',competencia:'cie',

   modelo:'Hernán: asignar rutas por una regla general y corregir con respeto es parte de tu rol y no es acoso. Un conflicto, como una discusión por tareas, también se gestiona: conversación facilitada, mediación interna o reglas de convivencia. Pero si aparecen agresión, hostigamiento o humillación, aunque sea una sola vez y aunque venga de compañeros, se trata como posible acoso y se activa el procedimiento; ante la duda, la persona siempre puede denunciar. Por último, la ley prohíbe represalias contra quien denuncia o declara como testigo: no puede haber cambios que perjudiquen a Ignacio ni a los testigos por haber participado.',
