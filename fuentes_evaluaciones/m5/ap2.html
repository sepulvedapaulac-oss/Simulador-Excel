  {titulo:'Reglas legales (arts. 159 y 177 del Código del Trabajo)',html:'<p><b>Renuncia:</b> decisión unilateral de la persona trabajadora, con aviso de 30 días de anticipación a lo menos. <b>Mutuo acuerdo:</b> decisión conjunta; no genera indemnización por años de servicio, salvo que se pacte.</p><p><b>Plazo fijo:</b> se transforma en indefinido si la persona sigue trabajando con conocimiento del empleador después del vencimiento, si hay una <b>segunda renovación</b>, o si presta servicios discontinuos en virtud de más de dos contratos a plazo durante 12 meses o más en un período de 15 meses.</p><p><b>Art. 177:</b> renuncia, mutuo acuerdo y finiquito constan por escrito; para que el empleador pueda invocarlos deben estar firmados por la persona trabajadora y ratificados ante un ministro de fe, o firmados electrónicamente en el sitio de la Dirección del Trabajo. El finiquito se pone a disposición dentro de 10 días hábiles desde la separación y se paga al ratificar.</p>'}
