 eyebrow:'Actividad práctica 2 · Caso ramificado',
 titulo:'El contrato a plazo de Valentina',
 contexto:'<p>Valentina Muñoz trabaja en atención a clientes de Horizonte Servicios con contratos a plazo fijo. Su jefatura quiere "terminarla por vencimiento" a fin de mes y, al mismo tiempo, Valentina recibió una oferta de otro trabajo y quiere irse. Acompaña a Camila a distinguir vencimiento, renuncia y mutuo acuerdo, a formalizar el cierre con un finiquito (electrónico o presencial) y a dejar la evidencia que demuestre que todo se hizo bien: cada decisión cambia el rumbo del caso.</p>',
 objetivos:['<b>Describir</b> qué distingue la renuncia, el mutuo acuerdo y el vencimiento del plazo.','<b>Analizar</b> cuándo un contrato a plazo fijo se transforma en indefinido.','<b>Explicar</b> cómo se formaliza el término (ratificación o firma electrónica), qué incluye el finiquito y qué significa firmarlo con reserva de derechos.','<b>Explicar</b> qué evidencia debe quedar del término para poder demostrarlo después.'],
 tiempo:'25–35 min',resumen:'5 decisiones · 2 respuestas de desarrollo',
 expediente:[
  {titulo:'Historial contractual de Valentina',html:'<table><tr><th>Documento</th><th>Vigencia</th></tr><tr><td>Contrato a plazo fijo</td><td>2 de febrero al 30 de abril de 2026</td></tr><tr><td>Primera renovación</td><td>1 de mayo al 31 de julio de 2026</td></tr><tr><td>Segunda renovación</td><td>1 de agosto al 30 de octubre de 2026</td></tr></table><p>Cargo: ejecutiva de atención a clientes. Sin licencias médicas ni fuero.</p>'},
  {titulo:'Correo de Sergio, jefe de Atención (lunes 19 de octubre)',html:'<p>"Camila: el contrato de Valentina vence el 30 de octubre, así que termina por vencimiento y listo. Igual ella quiere irse, me contó que le ofrecieron otro trabajo. Que firme cualquier papel aquí conmigo y cerramos el tema."</p>'},
  {titulo:'Mensaje de Valentina',html:'<p>"Hola Camila: me ofrecieron un trabajo que empieza el lunes 16 de noviembre. Me gustaría trabajar hasta el viernes 13 de noviembre. ¿Qué tengo que firmar? No quiero perder lo que me corresponde."</p>'},
  {titulo:'Registro de asistencia y liquidación de octubre de Valentina',html:'<table><tr><th>Fuente</th><th>Horas extraordinarias de octubre</th></tr><tr><td>Registro de asistencia (reloj control)</td><td>6 horas extraordinarias, con pacto escrito vigente</td></tr><tr><td>Liquidación de octubre</td><td>0 horas extraordinarias pagadas</td></tr></table>'},
  {titulo:'Reglas legales (arts. 159, 177 y 510 del Código del Trabajo; Ley 21.361)',html:'<p><b>Renuncia:</b> decisión unilateral de la persona trabajadora, con aviso de 30 días de anticipación a lo menos. <b>Mutuo acuerdo:</b> decisión conjunta; no genera indemnización por años de servicio, salvo que se pacte.</p><p><b>Plazo fijo:</b> se transforma en indefinido si la persona sigue trabajando con conocimiento del empleador después del vencimiento, si hay una <b>segunda renovación</b>, o si presta servicios discontinuos en virtud de más de dos contratos a plazo durante 12 meses o más en un período de 15 meses.</p><p><b>Art. 177:</b> renuncia, mutuo acuerdo y finiquito constan por escrito; para que el empleador pueda invocarlos deben estar firmados por la persona trabajadora y ratificados ante un ministro de fe, o firmados electrónicamente en el sitio de la Dirección del Trabajo. El finiquito se pone a disposición dentro de 10 días hábiles desde la separación (el plazo obliga al empleador) y se paga al ratificar.</p><p><b>Finiquito electrónico (Ley 21.361):</b> aceptar la vía electrónica es voluntario. La persona puede aceptarla, aceptarla con reserva de derechos o rechazarla; si la rechaza, el empleador ofrece el finiquito presencial. El poder liberatorio del finiquito no alcanza a las materias que la persona se reservó.</p><p><b>Evidencia:</b> los derechos laborales prescriben en 2 años desde que se hicieron exigibles, y las acciones de los actos y contratos, en 6 meses desde la terminación (art. 510): mientras esos plazos estén abiertos, la empresa puede necesitar probar lo que hizo.</p>'}
 ],

  {id:'forma',nombre:'Renuncia y mutuo acuerdo',fortaleza:'distingues quién toma la decisión en cada forma de término y cómo se formaliza.',mejora:'repasa la diferencia entre renuncia y mutuo acuerdo y los requisitos del art. 177 (escrito, firmado y ratificado).',repasar:'Lecciones 5.1 y 5.2'},

  {id:'e1',tipo:'decision',titulo:'¿Vence realmente el contrato?',corto:'Revisar el plazo',competencia:'plazo',

    {texto:'Que la segunda renovación (1 de agosto) transformó el contrato en indefinido: no puede terminarse por vencimiento del plazo.',pts:2,fb:'Correcto: una segunda renovación transforma el contrato a plazo fijo en indefinido. La causal del art. 159 N°4 ya no está disponible.',siguiente:'e2'}]},
  {id:'e2x',tipo:'decision',titulo:'Valentina trae sus contratos',corto:'Corregir el rumbo',competencia:'plazo',
   escena:'<p>Valentina recibe el aviso de vencimiento y llega con sus tres documentos: <i>"Camila, me renovaron dos veces. Una compañera me dijo que entonces soy indefinida. ¿Me están despidiendo?"</i> Sergio insiste en mantener el aviso.</p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'reconocer que el contrato es indefinido, retirar por escrito la comunicación de vencimiento y conversar con Valentina las formas reales de término, ya que ella quiere irse.',
   opciones:[
    {texto:'Mantiene el aviso: si Valentina no está de acuerdo, que reclame en la Inspección.',pts:0,fb:'El contrato es indefinido desde la segunda renovación. Mantener una causal que no corresponde expone a la empresa a un reclamo y a que un tribunal declare indebido el término; la persona tiene 60 días hábiles desde la separación para demandar.',siguiente:'e3'},
    {texto:'Reconoce que el contrato es indefinido, retira por escrito el aviso de vencimiento y conversa con Valentina sobre las formas reales de término, ya que ella quiere irse.',pts:2,fb:'Correcto: corriges el error antes de que produzca efectos y ordenas el cierre según lo que realmente ocurre: Valentina quiere terminar la relación.',siguiente:'e3'},
    {texto:'Le pide a la abogada que lo revise, sin retirar el aviso mientras tanto.',pts:1,fb:'Consultar está bien, pero la regla es clara (segunda renovación = indefinido) y mantener el aviso prolonga la incertidumbre de Valentina.',siguiente:'e3'}]},
  {id:'e2',tipo:'decision',titulo:'"Que firme cualquier papel"',corto:'¿Quién decide?',competencia:'forma',
   escena:'<p>Camila explica a Sergio que el vencimiento no procede. Él responde: <i>"Entonces redáctale una renuncia con fecha de hoy y que la firme. Ella igual se quiere ir."</i></p>',
   pregunta:'¿Qué responde Camila?',
   ideal:'explicar que la renuncia es una decisión unilateral de Valentina y no se redacta por ella; si ambas partes quieren terminar en una fecha acordada, corresponde un mutuo acuerdo por escrito.',
   opciones:[
    {texto:'Que la renuncia es una decisión de Valentina, no de la empresa: ella puede renunciar con 30 días de aviso, o ambas partes pueden pactar un mutuo acuerdo con la fecha que convengan.',pts:2,fb:'Correcto: la renuncia es unilateral de la persona trabajadora; el mutuo acuerdo es una decisión conjunta. Ambas deben constar por escrito y ratificarse para que el empleador pueda invocarlas.',siguiente:'e3'},
    {texto:'Que prepara la renuncia y se la pide firmar hoy, ya que ella quiere irse.',pts:0,fb:'Una renuncia redactada y exigida por el empleador deja de ser una decisión unilateral de la persona trabajadora y puede ser cuestionada.',siguiente:'e3'},
    {texto:'Que Valentina deberá presentar su renuncia con 30 días de aviso, sin ofrecer otra alternativa.',pts:1,fb:'La renuncia es posible y debe ser decisión de Valentina, pero también existe el mutuo acuerdo, que permite fijar en conjunto la fecha que ella pidió (13 de noviembre).',siguiente:'e3'}]},
  {id:'e3',tipo:'abierta',titulo:'Tres formas de término, tres lógicas',corto:'Describir',verbo:'Describe',
   consigna:'para Valentina, en un mensaje breve, las diferencias entre renuncia, mutuo acuerdo y vencimiento del plazo: quién decide, qué aviso o formalidad exige cada una y si generan indemnización por años de servicio.',minPalabras:50,
   modelo:'En la renuncia decides tú sola y debes avisar con al menos 30 días de anticipación. En el mutuo acuerdo, tú y la empresa deciden juntas la fecha de término. El vencimiento del plazo ocurre al llegar la fecha del contrato, pero en tu caso ya no aplica porque con la segunda renovación tu contrato pasó a ser indefinido. La renuncia y el mutuo acuerdo deben constar por escrito, firmados por ti y ratificados ante un ministro de fe o firmados en el sitio de la Dirección del Trabajo. Ninguna de estas formas genera indemnización por años de servicio, salvo que se pacte en el mutuo acuerdo; sí se pagan lo trabajado y el feriado que corresponda.',
   criterios:['Distingue quién toma la decisión en cada forma (persona trabajadora, ambas partes, la fecha del contrato).','Menciona el aviso de 30 días de la renuncia y la formalidad escrita y ratificada.','Indica que no generan indemnización por años de servicio, salvo pacto en el mutuo acuerdo.'],siguiente:'e4'},
  {id:'e4',tipo:'decision',titulo:'Formalizar el mutuo acuerdo',corto:'Ratificación',competencia:'forma',
   escena:'<p>Valentina y Horizonte acuerdan terminar por <b>mutuo acuerdo</b> el viernes 13 de noviembre. Sergio propone: <i>"Que firme el documento aquí en mi oficina, con dos compañeros como testigos, y listo."</i></p>',
   pregunta:'¿Cómo debe formalizarse para que Horizonte pueda invocarlo?',
   ideal:'documento escrito, firmado por Valentina y ratificado ante un ministro de fe (inspector del trabajo, notario, oficial del Registro Civil o secretario municipal, entre otros), o firmado electrónicamente en el sitio de la Dirección del Trabajo.',
   opciones:[
    {texto:'Firmado por Valentina ante la jefatura, y ratificado ante un ministro de fe solo si ella lo pide.',pts:1,fb:'La firma por escrito es necesaria, pero la ratificación no es opcional: sin ella, el empleador no puede invocar el mutuo acuerdo.',siguiente:'e5x'},
    {texto:'Firmado por Valentina ante Sergio y dos compañeros como testigos.',pts:0,fb:'La jefatura y los compañeros no son ministros de fe. El documento debe ratificarse ante un ministro de fe o firmarse electrónicamente en el sitio de la Dirección del Trabajo.',siguiente:'e5x'},
    {texto:'Por escrito, firmado por Valentina y ratificado ante un ministro de fe (por ejemplo, inspector del trabajo o notario), o firmado electrónicamente en el sitio de la Dirección del Trabajo.',pts:2,fb:'Correcto: así lo exige el art. 177. La firma electrónica en el sitio de la Dirección del Trabajo (Ley 21.361) se considera otorgada ante el inspector.',siguiente:'e5'}]},
  {id:'e5',tipo:'decision',titulo:'El finiquito de Valentina',corto:'Finiquito',competencia:'cierre',
   escena:'<p>El mutuo acuerdo quedó bien formalizado. Ahora Camila prepara el finiquito. Sergio propone: <i>"Mandémosle el finiquito electrónico por el sitio de la Dirección del Trabajo; si no lo firma ahí, que espere. ¿Qué hay que pagarle?"</i></p>',
   pregunta:'¿Qué responde Camila?',
   ideal:'ponerlo a disposición dentro de 10 días hábiles desde la separación, con las remuneraciones pendientes, horas extraordinarias si existen y el feriado proporcional, sin indemnización por años de servicio (no se pactó); se le puede proponer la vía electrónica, informándole que es voluntaria, y si la rechaza se le ofrece el finiquito presencial; el pago se hace al firmar o ratificar.',
   opciones:[
    {texto:'Dentro de 10 días hábiles desde la separación, con indemnización por años de servicio, porque todo término la genera; solo por vía electrónica.',pts:0,fb:'El mutuo acuerdo no genera indemnización legal por años de servicio, salvo que se pacte (y Valentina tiene menos de un año). Además, la vía electrónica es voluntaria para ella.',siguiente:'e6'},
    {texto:'Dentro de 10 días hábiles desde la separación: remuneraciones pendientes, horas extraordinarias si las hay y feriado proporcional, sin indemnización por años de servicio (no se pactó). Se le propone la vía electrónica informándole que es voluntaria; si la rechaza, se le ofrece el finiquito presencial. Se paga al firmar.',pts:2,fb:'Correcto: lo trabajado y el feriado se revisan en cualquier término, y la vía electrónica (Ley 21.361) es voluntaria: Valentina puede aceptarla, aceptarla con reserva de derechos o rechazarla.',siguiente:'e6'},
    {texto:'Con el contenido correcto y dentro de 10 días hábiles, pero solo por vía electrónica: si no lo firma ahí, no hay otra opción.',pts:1,fb:'El contenido y el plazo son correctos, pero aceptar la vía electrónica es voluntario. Si Valentina la rechaza, Horizonte debe ofrecerle el finiquito presencial ante un ministro de fe.',siguiente:'e6'}]},
  {id:'e5x',tipo:'decision',titulo:'"¿Ese papel vale?"',corto:'Corregir el rumbo',competencia:'cierre',
   escena:'<p>Una semana después de su último día, Valentina escribe: <i>"Firmé el documento en la oficina de Sergio, pero me dicen que eso no basta. ¿Cuándo me pagan lo que me corresponde?"</i></p>',
   pregunta:'¿Cómo corrige Camila el rumbo?',
   ideal:'explicar que el mutuo acuerdo y el finiquito deben ratificarse ante un ministro de fe o firmarse electrónicamente en la Dirección del Trabajo, poner el finiquito a disposición dentro de 10 días hábiles desde la separación y pagarlo al ratificar.',
   opciones:[
    {texto:'Le explica que el documento debe ratificarse ante un ministro de fe o firmarse electrónicamente en la Dirección del Trabajo (si ella acepta esa vía, que es voluntaria); pone el finiquito a disposición dentro de 10 días hábiles desde la separación y paga al ratificar.',pts:2,fb:'Correcto: con la ratificación (o la firma electrónica en la Dirección del Trabajo) Horizonte puede invocar el término, y el pago se hace en ese momento.',siguiente:'e6'},
    {texto:'Le responde que el papel firmado basta y que se le pagará cuando haya presupuesto.',pts:0,fb:'Sin ratificación, Horizonte no puede invocar el mutuo acuerdo. Además, el finiquito debe ponerse a disposición dentro de 10 días hábiles desde la separación.',siguiente:'e6'},
    {texto:'Agenda la ratificación ante notario, pero para dentro de un mes, cuando se cierren las remuneraciones.',pts:1,fb:'Ratificar es lo correcto, pero el finiquito debe estar a disposición dentro de 10 días hábiles desde la separación.',siguiente:'e6'}]},
  {id:'e6',tipo:'decision',titulo:'"Me faltan horas extra"',corto:'Reserva de derechos',competencia:'cierre',
   escena:'<p>Valentina revisa la propuesta de finiquito y escribe: <i>"Todo cuadra, salvo algo: en octubre hice horas extra y no aparecen. ¿Puedo firmar igual?"</i> Sergio responde: <i>"O lo firma tal cual o no hay pago."</i> Revisa el <b>registro de asistencia y la liquidación de octubre</b> en el expediente.</p>',
   pregunta:'¿Qué hace Camila?',
   ideal:'explicarle que puede aceptar el finiquito con reserva de derechos sobre las horas extraordinarias (el poder liberatorio no alcanza a lo reservado), y revisar de inmediato el registro de asistencia y la liquidación: si las 6 horas extraordinarias se trabajaron y no se pagaron, se incluyen en el finiquito.',
   opciones:[
    {texto:'Le explica que puede aceptar el finiquito con reserva de derechos sobre las horas extraordinarias, pero no revisa los registros: "si quiere, que lo vea un tribunal".',pts:1,fb:'La reserva de derechos es correcta: el finiquito no la libera respecto de lo reservado. Pero el registro de asistencia muestra 6 horas extraordinarias que la liquidación no pagó: si se deben, corresponde pagarlas ahora y no trasladar el problema a un juicio.',siguiente:'e7'},
    {texto:'Respalda a Sergio: o firma sin reserva o no se le paga.',pts:0,fb:'Valentina puede aceptar con reserva de derechos (Ley 21.361), y negarse a pagar no extingue la obligación: el plazo de 10 días hábiles obliga al empleador. Además, los registros muestran horas extraordinarias impagas.',siguiente:'e7'},
    {texto:'Le explica que puede firmar con reserva de derechos sobre las horas extraordinarias y revisa el registro de asistencia y la liquidación: como hay 6 horas registradas y no pagadas, las incluye en el finiquito.',pts:2,fb:'Correcto: la reserva protege a Valentina, y revisar la coherencia entre el registro y la liquidación permite corregir el error antes del cierre. Un finiquito que paga lo que se debe reduce el riesgo de reclamos posteriores.',siguiente:'e7'}]},
  {id:'e7',tipo:'abierta',titulo:'La evidencia que debe quedar',corto:'Explicar',verbo:'Explica',
   consigna:'a Sergio qué documentos deben quedar en la carpeta de Valentina para demostrar que su término se hizo bien, y por qué el finiquito firmado no basta por sí solo. Usa lo ocurrido en el caso (la segunda renovación, el mutuo acuerdo, las horas extraordinarias).',minPalabras:60,
   modelo:'En la carpeta de Valentina deben quedar: el contrato y sus dos renovaciones (que muestran que pasó a ser indefinida), el mutuo acuerdo escrito y ratificado o firmado electrónicamente en la Dirección del Trabajo, el registro de asistencia y las liquidaciones (incluida la corrección de las horas extraordinarias de octubre), el cálculo del feriado proporcional y el finiquito con el comprobante de pago. El finiquito no basta porque su poder liberatorio no alcanza a lo que la persona se reserva, y porque solo con la cadena completa se puede reconstruir qué pasó y por qué. Hay que conservarla ordenada mientras estén abiertos los plazos de prescripción: 2 años desde que los derechos se hicieron exigibles y 6 meses desde el término para las acciones del contrato.',
   criterios:['Enumera documentos de la cadena: contrato y renovaciones, mutuo acuerdo ratificado, registro de asistencia, liquidaciones y finiquito con pago.','Explica que el finiquito no cubre lo reservado ni reemplaza la evidencia previa.','Relaciona la conservación con los plazos de prescripción (art. 510), sin afirmar un plazo fijo de conservación.']}
 ],
 cierre:'<b>Idea clave:</b> antes de terminar un contrato, pregunta quién toma la decisión y revisa su historia. Un plazo fijo renovado dos veces, o que continúa después de vencer, ya es indefinido. Renuncia y mutuo acuerdo se firman y se ratifican; el finiquito se pone a disposición en 10 días hábiles, la vía electrónica es voluntaria y la reserva de derechos deja abiertas las materias reservadas. Lo que no está en los registros no se puede demostrar.'
