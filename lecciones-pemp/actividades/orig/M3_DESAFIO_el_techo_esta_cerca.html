<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafío TLS — El Techo Está Cerca</title>
<style>
  :root{
    --azul-profundo:#171697;
    --teal:#00A5AB;
    --azul-marino:#0B0B4D;
    --amarillo:#FFC72C;
    --gris:#6B7280;
    --gris-claro:#F2F3F7;
    --blanco:#FFFFFF;
    --rojo:#D32F2F;
    --radio:18px;
    --sombra:0 10px 30px rgba(11,11,77,0.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--azul-marino) 0%,var(--azul-profundo) 55%,var(--teal) 130%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:var(--azul-marino);
  }
  .app{
    width:100%;
    max-width:760px;
  }
  .card{
    background:var(--blanco);
    border-radius:var(--radio);
    box-shadow:var(--sombra);
    padding:36px 32px;
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .progress-bar{
    width:100%;
    height:6px;
    background:var(--gris-claro);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--azul-profundo));
    border-radius:6px;
    transition:width .4s ease;
    width:12.5%;
  }
  .eyebrow{
    display:inline-block;
    background:var(--azul-profundo);
    color:var(--blanco);
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    padding:6px 14px;
    border-radius:30px;
    margin-bottom:16px;
    text-transform:uppercase;
    width:fit-content;
  }
  h1{
    font-size:26px;
    color:var(--azul-marino);
    line-height:1.25;
    margin-bottom:14px;
  }
  h2{
    font-size:20px;
    color:var(--azul-profundo);
    margin-bottom:14px;
    line-height:1.3;
  }
  p{
    font-size:16px;
    line-height:1.55;
    color:#33334d;
    margin-bottom:14px;
  }
  .hook{
    font-size:18px;
    font-style:italic;
    color:var(--teal);
    border-left:4px solid var(--teal);
    padding-left:16px;
    margin:18px 0 26px;
  }
  .img-frame{
    width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    background:linear-gradient(135deg,#dfe3ec,#c7cde0);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
    position:relative;
  }
  .img-frame svg{width:100%;height:100%;display:block;}
  .img-frame.integrated-frame{background:#eef1f6;}
  .img-frame.integrated-frame img{width:100%;height:100%;object-fit:cover;display:block;}
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    padding:15px 26px;
    border-radius:12px;
    background:var(--azul-profundo);
    color:var(--blanco);
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
    width:100%;
    box-shadow:0 6px 16px rgba(23,22,151,0.25);
  }
  .btn:hover{background:var(--teal);transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{background:#b9bcd8;cursor:not-allowed;box-shadow:none;transform:none;}
  .btn.secondary{
    background:var(--blanco);
    color:var(--azul-profundo);
    border:2px solid var(--azul-profundo);
    box-shadow:none;
  }
  .btn.secondary:hover{background:var(--gris-claro);}
  .btn-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;min-width:140px;}
  .compare{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:18px 0;
  }
  .compare-col{
    background:var(--gris-claro);
    border-radius:12px;
    padding:16px;
    text-align:center;
  }
  .compare-col h3{
    font-size:13px;
    letter-spacing:1px;
    color:var(--azul-profundo);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .reveal-box{
    background:var(--gris-claro);
    border-radius:12px;
    padding:18px;
    margin-top:14px;
    text-align:center;
    font-weight:700;
    color:var(--azul-profundo);
    display:none;
    animation:fadeIn .4s ease;
  }
  .reveal-box.show{display:block;}
  .option{
    display:block;
    width:100%;
    text-align:left;
    background:var(--gris-claro);
    border:2px solid transparent;
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    font-size:15px;
    cursor:pointer;
    transition:all .2s ease;
    color:var(--azul-marino);
  }
  .option:hover{border-color:var(--teal);}
  .option.correct{
    background:#E4F8F4;
    border-color:var(--teal);
    font-weight:700;
  }
  .option.incorrect{
    background:#FBE9E9;
    border-color:var(--rojo);
  }
  .option:disabled{cursor:default;}
  .feedback{
    margin-top:16px;
    padding:16px;
    border-radius:12px;
    font-size:15px;
    line-height:1.5;
    display:none;
    animation:fadeIn .4s ease;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:#E4F8F4;color:#0B5750;border-left:4px solid var(--teal);}
  .feedback.err{background:#FBE9E9;color:#7A1E1E;border-left:4px solid var(--rojo);}
  .checklist{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:16px 0;
  }
  .check-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--gris-claro);
    border:2px solid transparent;
    border-radius:12px;
    padding:14px 16px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .check-item.active{border-color:var(--azul-profundo);background:#EAEAFB;}
  .check-item .box{
    width:22px;height:22px;
    border-radius:6px;
    border:2px solid var(--gris);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--blanco);
    background:var(--blanco);
  }
  .check-item.active .box{background:var(--azul-profundo);border-color:var(--azul-profundo);}
  .tf-row{display:flex;gap:14px;margin:20px 0;}
  .tf-btn{
    flex:1;
    padding:20px;
    border-radius:12px;
    border:2px solid var(--gris-claro);
    background:var(--gris-claro);
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    color:var(--azul-marino);
    transition:all .2s ease;
  }
  .tf-btn:hover{border-color:var(--teal);}
  .statement-box{
    background:var(--azul-marino);
    color:var(--blanco);
    text-align:center;
    padding:34px 20px;
    border-radius:14px;
    font-size:24px;
    font-weight:800;
    letter-spacing:.5px;
    margin:16px 0;
  }
  .steps{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:18px 0;
  }
  .step-card{
    background:var(--gris-claro);
    border-radius:12px;
    padding:16px 18px;
    cursor:pointer;
    border-left:5px solid var(--gris);
    transition:all .25s ease;
  }
  .step-card.open{
    border-left-color:var(--teal);
    background:#EAF9F8;
  }
  .step-title{
    font-weight:700;
    color:var(--azul-profundo);
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:15px;
  }
  .step-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    font-size:14px;
    color:#33334d;
  }
  .step-card.open .step-body{max-height:200px;margin-top:8px;}
  .arrow-down{
    text-align:center;
    color:var(--teal);
    font-size:20px;
    margin:2px 0;
  }
  .badge-final{
    text-align:center;
    padding:10px;
  }
  .badge-final .circle{
    width:96px;height:96px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--teal),var(--azul-profundo));
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;
    color:var(--blanco);
    font-size:42px;
  }
  .idea-fuerza{
    background:var(--gris-claro);
    border-left:5px solid var(--amarillo);
    padding:18px;
    border-radius:10px;
    font-size:17px;
    font-weight:700;
    color:var(--azul-marino);
    margin:18px 0;
  }
  .multi-select-hint{
    font-size:13px;
    color:var(--gris);
    margin-bottom:10px;
  }
  .footer-nav{
    display:flex;
    justify-content:space-between;
    margin-top:24px;
    font-size:13px;
    color:var(--gris);
  }
  @media (max-width:520px){
    .card{padding:26px 20px;}
    h1{font-size:22px;}
    .compare{grid-template-columns:1fr;}
    .tf-row{flex-direction:column;}
  }
</style>
</head>

  var photoAlts = ['Operador dentro de una plataforma de tijera evaluando una estructura superior cercana','Plataforma de tijera posicionada en una superficie de trabajo controlada','Plataforma de tijera próxima a una interferencia superior durante la planificación'];
  function photoPlaceholder(labelHtml){
    var i = Math.min(photoIndex++, photoAssets.length - 1);
    return '<div class="img-frame integrated-frame"><img src="'+photoAssets[i]+'" alt="'+photoAlts[i]+'" loading="lazy"></div>';

  function setProgress(){
    var pct = (state.screen / state.totalScreens) * 100;
    progressFill.style.width = pct + '%';
  }

  function goTo(n){
    state.screen = n;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function render(){
    setProgress();
    switch(state.screen){
      case 1: renderScreen1(); break;
      case 2: renderScreen2(); break;
      case 3: renderScreen3(); break;
      case 4: renderScreen4(); break;
      case 5: renderScreen5(); break;
      case 6: renderScreen6(); break;
      case 7: renderScreen7(); break;
      case 8: renderScreen8(); break;
    }
  }

  // ---------- PANTALLA 1 ----------
  function renderScreen1(){
    content.innerHTML =
      '<span class="eyebrow">Desafío TLS®</span>' +
      '<h1>EL TECHO ESTÁ CERCA</h1>' +
      photoPlaceholder('plataforma de tijera elevándose hacia una estructura superior en un espacio industrial cerrado') +
      '<p class="hook">"Llegar al punto de trabajo no significa que todavía sea seguro continuar."</p>' +
      '<button class="btn" id="btnStart">ACEPTAR DESAFÍO</button>';
    document.getElementById('btnStart').addEventListener('click', function(){ goTo(2); });
  }

  // ---------- PANTALLA 2 ----------
  function renderScreen2(){
    content.innerHTML =
      '<span class="eyebrow">Escenario</span>' +
      '<h2>Una tarea que comenzó según lo previsto</h2>' +
      '<p>Una plataforma de tijera fue posicionada para realizar una tarea en altura. Durante la planificación se observó el espacio disponible.</p>' +
      '<p>Sin embargo, mientras la plataforma se eleva, el operador advierte que una estructura superior está más próxima de lo previsto.</p>' +
      '<div class="compare">' +
        '<div class="compare-col">' +
          '<h3>Lo planificado</h3>' +
          photoPlaceholder('vista del espacio de trabajo despejado durante la planificación, antes de la elevación') +
        '</div>' +
        '<div class="compare-col">' +
          '<h3>Lo que está ocurriendo</h3>' +
          photoPlaceholder('vista durante la elevación mostrando la proximidad inesperada de una estructura superior') +
        '</div>' +
      '</div>' +
      '<p><strong>¿Qué cambió?</strong></p>' +
      '<button class="btn secondary" id="btnReveal">REVELAR</button>' +
      '<div class="reveal-box" id="revealBox">Cambió una condición del entorno.</div>' +
      '<button class="btn" id="btnNext2" style="margin-top:18px;" disabled>CONTINUAR</button>';

    document.getElementById('btnReveal').addEventListener('click', function(){
      document.getElementById('revealBox').classList.add('show');
      document.getElementById('btnNext2').disabled = false;
      this.disabled = true;
    });
    document.getElementById('btnNext2').addEventListener('click', function(){ goTo(3); });
  }

  // ---------- PANTALLA 3 ----------
  function renderScreen3(){
    var options = [
      {id:'A', text:'Continuar lentamente.', correct:false,
        fb:'Continuar, incluso lentamente, mantiene la elevación en curso sin haber reevaluado la condición que cambió.'},
      {id:'B', text:'Detener y reevaluar.', correct:true,
        fb:'Correcto. Un cambio en el entorno exige detener la elevación y reevaluar antes de decidir cómo continuar.'},
      {id:'C', text:'Agacharse para seguir.', correct:false,
        fb:'Adaptar la postura no resuelve el cambio en la condición del entorno ni recupera el control de la trayectoria.'},
      {id:'D', text:'Continuar mientras visualmente parezca posible.', correct:false,
        fb:'Que algo parezca posible visualmente no reemplaza una evaluación real de la condición y la trayectoria.'}
    ];

    content.innerHTML =
      '<span class="eyebrow">Decisión crítica</span>' +
      '<h2>¿Qué corresponde hacer?</h2>' +
      '<div id="optionsWrap"></div>' +
      '<div class="feedback" id="fb3"></div>' +
      '<button class="btn" id="btnNext3" style="margin-top:10px;" disabled>CONTINUAR</button>';

    var wrap = document.getElementById('optionsWrap');
    options.forEach(function(opt){
      var b = document.createElement('button');
      b.className = 'option';
      b.textContent = opt.id + '. ' + opt.text;
      b.addEventListener('click', function(){
        if(state.q3Answered) return;
        state.q3Answered = true;
        var allBtns = wrap.querySelectorAll('.option');
        allBtns.forEach(function(ob, idx){
          ob.disabled = true;
          if(options[idx].correct) ob.classList.add('correct');
        });
        if(!opt.correct) b.classList.add('incorrect');
        var fb = document.getElementById('fb3');
        fb.textContent = opt.fb;
        fb.className = 'feedback show ' + (opt.correct ? 'ok' : 'err');
        document.getElementById('btnNext3').disabled = false;
      });
      wrap.appendChild(b);
    });

    document.getElementById('btnNext3').addEventListener('click', function(){ goTo(4); });
  }

  // ---------- PANTALLA 4 ----------
  function renderScreen4(){
    var items = [
      {id:'posicion', label:'Posición', valid:true},
      {id:'trayectoria', label:'Trayectoria', valid:true},
      {id:'estructura', label:'Estructura superior', valid:true},
      {id:'espacio', label:'Espacio disponible', valid:true},
      {id:'reposicion', label:'Posibilidad de reposicionamiento', valid:true},
      {id:'condiciones', label:'Condiciones del área', valid:true},
      {id:'velocidad', label:'Velocidad máxima del equipo', valid:false},
      {id:'horario', label:'Horario de término de la jornada', valid:false}
    ];

    content.innerHTML =
      '<span class="eyebrow">Reevaluación</span>' +
      '<h2>¿Qué corresponde reevaluar?</h2>' +
      '<p class="multi-select-hint">Selecciona todos los elementos que deben reevaluarse antes de continuar.</p>' +
      '<div class="checklist" id="checklist4"></div>' +
      '<button class="btn" id="btnCheck4" style="margin-top:6px;">VERIFICAR</button>' +
      '<div class="feedback" id="fb4"></div>' +
      '<button class="btn" id="btnNext4" style="margin-top:14px;display:none;">CONTINUAR</button>';

    var wrap = document.getElementById('checklist4');
    var checked = false;
    items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'check-item';
      row.innerHTML = '<div class="box"></div><span>' + it.label + '</span>';
      row.addEventListener('click', function(){
        if(checked) return;
        row.classList.toggle('active');
        if(row.classList.contains('active')){
          state.q4Selections.add(it.id);
          row.querySelector('.box').textContent = '✓';
        } else {
          state.q4Selections.delete(it.id);
          row.querySelector('.box').textContent = '';
        }
      });
      wrap.appendChild(row);
    });

    document.getElementById('btnCheck4').addEventListener('click', function(){
      if(checked) return;
      checked = true;
      var correctIds = items.filter(function(i){return i.valid;}).map(function(i){return i.id;});
      var missed = correctIds.filter(function(id){ return !state.q4Selections.has(id); });
      var extra = Array.from(state.q4Selections).filter(function(id){
        var item = items.find(function(i){return i.id===id;});
        return item && !item.valid;
      });

      var rows = wrap.querySelectorAll('.check-item');
      rows.forEach(function(row, idx){
        row.style.cursor='default';
        var it = items[idx];
        if(it.valid && state.q4Selections.has(it.id)){
          row.style.borderColor = 'var(--teal)';
        } else if(!it.valid && state.q4Selections.has(it.id)){
          row.style.borderColor = 'var(--rojo)';
        } else if(it.valid && !state.q4Selections.has(it.id)){
          row.style.borderColor = 'var(--amarillo)';
        }
      });

      var fb = document.getElementById('fb4');
      if(missed.length === 0 && extra.length === 0){
        fb.textContent = 'Identificaste correctamente los elementos que deben reevaluarse: posición, trayectoria, estructura superior, espacio disponible, posibilidad de reposicionamiento y condiciones del área.';
        fb.className = 'feedback show ok';
      } else {
        fb.textContent = 'La reevaluación debe cubrir: posición, trayectoria, estructura superior, espacio disponible, posibilidad de reposicionamiento y condiciones del área. La velocidad máxima del equipo y el horario de la jornada no son parte de esta reevaluación.';
        fb.className = 'feedback show err';
      }
      this.disabled = true;
      document.getElementById('btnNext4').style.display = 'block';
    });

    document.getElementById('btnNext4').addEventListener('click', function(){ goTo(5); });
  }

  // ---------- PANTALLA 5 ----------
  function renderScreen5(){
    var options = [
      {id:'A', text:'Elegir siempre la posición más rápida.', correct:false,
        fb:'La rapidez no es el criterio: una posición más rápida puede no recuperar el control de la condición que cambió.'},
      {id:'B', text:'Elegir la posición que permita recuperar condiciones controladas.', correct:true,
        fb:'Correcto. El criterio es recuperar una condición controlada, no solo encontrar otra ubicación posible.'},
      {id:'C', text:'Continuar desde donde está porque ya comenzó.', correct:false,
        fb:'Haber comenzado la tarea no es una razón para continuar bajo una condición que ya no es controlada.'},
      {id:'D', text:'Elevar hasta comprobar físicamente si cabe.', correct:false,
        fb:'Comprobar físicamente el espacio elevando implica asumir el riesgo antes de confirmarlo, en lugar de reevaluar primero.'}
    ];

    content.innerHTML =
      '<span class="eyebrow">Segunda decisión</span>' +
      '<h2>Existe otra ubicación desde la cual podría realizarse la tarea.</h2>' +
      '<p><strong>¿Qué criterio debe guiar la decisión?</strong></p>' +
      '<div id="optionsWrap5"></div>' +
      '<div class="feedback" id="fb5"></div>' +
      '<button class="btn" id="btnNext5" style="margin-top:10px;" disabled>CONTINUAR</button>';

    var wrap = document.getElementById('optionsWrap5');
    options.forEach(function(opt){
      var b = document.createElement('button');
      b.className = 'option';
      b.textContent = opt.id + '. ' + opt.text;
      b.addEventListener('click', function(){
        if(state.q5Answered) return;
        state.q5Answered = true;
        var allBtns = wrap.querySelectorAll('.option');
        allBtns.forEach(function(ob, idx){
          ob.disabled = true;
          if(options[idx].correct) ob.classList.add('correct');
        });
        if(!opt.correct) b.classList.add('incorrect');
        var fb = document.getElementById('fb5');
        fb.textContent = opt.fb;
        fb.className = 'feedback show ' + (opt.correct ? 'ok' : 'err');
        document.getElementById('btnNext5').disabled = false;
      });
      wrap.appendChild(b);
    });

    document.getElementById('btnNext5').addEventListener('click', function(){ goTo(6); });
  }

  // ---------- PANTALLA 6 ----------
  function renderScreen6(){
    content.innerHTML =
      '<span class="eyebrow">Error frecuente</span>' +
      '<h2>Evalúa la siguiente afirmación</h2>' +
      '<div class="statement-box">"SI CABE, PUEDO CONTINUAR."</div>' +
      '<div class="tf-row" id="tfRow6">' +
        '<button class="tf-btn" id="tfTrue">VERDADERO</button>' +
        '<button class="tf-btn" id="tfFalse">FALSO</button>' +
      '</div>' +
      '<div class="feedback" id="fb6"></div>' +
      '<button class="btn" id="btnNext6" style="margin-top:10px;" disabled>CONTINUAR</button>';

    function answer(isTrue, btn){
      if(state.q6Answered) return;
      state.q6Answered = true;
      var trueBtn = document.getElementById('tfTrue');
      var falseBtn = document.getElementById('tfFalse');
      trueBtn.disabled = true;
      falseBtn.disabled = true;
      falseBtn.style.borderColor = 'var(--teal)';
      falseBtn.style.background = '#E4F8F4';
      if(isTrue){
        trueBtn.style.borderColor = 'var(--rojo)';
        trueBtn.style.background = '#FBE9E9';
      }
      var fb = document.getElementById('fb6');
      fb.textContent = 'FALSO. La posibilidad física de continuar no reemplaza la evaluación del entorno ni el control de la trayectoria.';
      fb.className = 'feedback show ' + (isTrue ? 'err' : 'ok');
      document.getElementById('btnNext6').disabled = false;
    }

    document.getElementById('tfTrue').addEventListener('click', function(){ answer(true, this); });
    document.getElementById('tfFalse').addEventListener('click', function(){ answer(false, this); });
    document.getElementById('btnNext6').addEventListener('click', function(){ goTo(7); });
  }

  // ---------- PANTALLA 7 ----------
  function renderScreen7(){
    var steps = [
      {id:'observa', title:'OBSERVA', body:'Presta atención activa a lo que ocurre alrededor mientras el equipo se desplaza o eleva.'},
      {id:'detecta', title:'DETECTA EL CAMBIO', body:'Identifica cualquier variación respecto de lo planificado, por pequeña que parezca.'},
      {id:'deten', title:'DETÉN', body:'Interrumpe la maniobra en curso antes de seguir avanzando.'},
      {id:'reevalua', title:'REEVALÚA', body:'Analiza la nueva condición: posición, trayectoria, estructura y espacio disponible.'},
      {id:'continua', title:'CONTINÚA SOLO SI RECUPERAS EL CONTROL', body:'Retoma la maniobra únicamente cuando la condición vuelva a ser controlada.'}
    ];

    var html = '<span class="eyebrow">Herramienta mental TLS</span>' +
      '<h2>Toca cada paso para revisarlo</h2>' +
      '<div class="steps" id="stepsWrap">';

    steps.forEach(function(s, idx){
      html += '<div class="step-card" data-id="' + s.id + '">' +
        '<div class="step-title"><span>' + (idx+1) + '. ' + s.title + '</span><span>+</span></div>' +
        '<div class="step-body">' + s.body + '</div>' +
      '</div>';
      if(idx < steps.length - 1){
        html += '<div class="arrow-down">↓</div>';
      }
    });

    html += '</div>' +
      '<button class="btn" id="btnNext7" style="margin-top:18px;" disabled>CONTINUAR</button>';

    content.innerHTML = html;

    var cards = document.querySelectorAll('.step-card');
    cards.forEach(function(card){
      card.addEventListener('click', function(){
        var isOpen = card.classList.contains('open');
        if(isOpen){
          card.classList.remove('open');
        } else {
          card.classList.add('open');
          state.revealedSteps.add(card.getAttribute('data-id'));
        }
        if(state.revealedSteps.size >= steps.length){
          document.getElementById('btnNext7').disabled = false;
        }
      });
    });

    document.getElementById('btnNext7').addEventListener('click', function(){ goTo(8); });
  }

  // ---------- PANTALLA 8 ----------
  function renderScreen8(){
    content.innerHTML =
      '<div class="badge-final">' +
        '<div class="circle">✓</div>' +
        '<h2>DESAFÍO COMPLETADO</h2>' +
      '</div>' +
      '<div class="idea-fuerza">"Cuando el espacio disponible cambia, la decisión segura puede ser detener antes de llegar."</div>' +
      '<button class="btn" id="btnRestart">REINICIAR DESAFÍO</button>';

    document.getElementById('btnRestart').addEventListener('click', function(){
      state = {
        screen: 1,
        totalScreens: 8,
        q3Answered:false,
        q4Selections:new Set(),
        q5Answered:false,
        q6Answered:false,
        revealedSteps:new Set()
      };
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
