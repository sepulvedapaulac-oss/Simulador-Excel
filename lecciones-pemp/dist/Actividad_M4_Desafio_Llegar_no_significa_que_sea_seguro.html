<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M4 — Llegar no significa que sea seguro | TLS®</title>
<style>
  :root{
    --tls-dark:#171697;
    --tls-teal:#00A5AB;
    --tls-red:#C81E1E;
    --bg:#0d0d1a;
    --panel:#ffffff;
    --ink:#171697;
    --ink-soft:#3d3d6b;
    --grey-bg:#f2f4f8;
    --shadow: 0 10px 30px rgba(23,22,151,0.18);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background: linear-gradient(160deg, var(--tls-dark) 0%, #0d0d3a 45%, #062b2d 100%);
    color:var(--ink);
  }
  #app{
    max-width:980px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding: 18px 16px 40px;
  }
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#fff;
    padding:6px 4px 14px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:700;
    letter-spacing:.5px;
    font-size:14px;
  }
  .brand .dot{
    width:12px;height:12px;border-radius:50%;
    background:var(--tls-teal);
    box-shadow:0 0 0 4px rgba(0,165,171,0.25);
  }
  .progress-wrap{
    flex:1;
    margin:0 18px;
    height:8px;
    background:rgba(255,255,255,0.15);
    border-radius:6px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:12.5%;
    background:linear-gradient(90deg, var(--tls-teal), #4fe0d8);
    transition:width .4s ease;
  }
  .step-count{
    color:#fff;font-size:13px;font-weight:600;opacity:.85;white-space:nowrap;
  }
  main.card{
    background:var(--panel);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:clamp(20px,4vw,44px);
    flex:1;
    display:flex;
    flex-direction:column;
    gap:18px;
    animation: fadeIn .45s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-size:12px;
    font-weight:800;
    color:var(--tls-teal);
  }
  h1{
    font-size:clamp(22px,4vw,34px);
    line-height:1.15;
    margin:0;
    color:var(--tls-dark);
  }
  h2{
    font-size:clamp(18px,3vw,24px);
    margin:0 0 4px;
    color:var(--tls-dark);
  }
  p{
    font-size:16px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0;
  }
  .hook{
    font-size:clamp(18px,2.6vw,24px);
    font-style:italic;
    color:var(--tls-dark);
    border-left:5px solid var(--tls-teal);
    padding:10px 18px;
    background:var(--grey-bg);
    border-radius:0 12px 12px 0;
  }
  /* Photo-style illustration frame, 16:9 */
  .photo-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05), 0 8px 24px rgba(0,0,0,0.15);
    background: linear-gradient(180deg,#cfd8e3 0%, #aab7c9 55%, #8b98a8 100%);
  }
  .photo-frame svg{ width:100%; height:100%; display:block; }
  .photo-caption{
    position:absolute;
    bottom:0;left:0;right:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.55), transparent);
    color:#fff;
    font-size:12px;
    padding:8px 12px;
    letter-spacing:.3px;
  }
  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:6px;
  }
  button.opt{
    flex:1 1 160px;
    background:var(--grey-bg);
    border:2px solid transparent;
    border-radius:12px;
    padding:16px 18px;
    font-size:16px;
    font-weight:700;
    color:var(--tls-dark);
    cursor:pointer;
    transition:.2s ease;
    text-align:left;
  }
  button.opt:hover{
    border-color:var(--tls-teal);
    transform:translateY(-2px);
    box-shadow:0 6px 14px rgba(0,165,171,0.25);
  }
  button.opt.correct{
    background:#e6f8f8;
    border-color:var(--tls-teal);
    color:var(--tls-dark);
  }
  button.opt.incorrect{
    background:#fdeaea;
    border-color:var(--tls-red);
    color:var(--tls-red);
  }
  button.opt:disabled{ cursor:default; transform:none; }
  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:auto;
    padding-top:18px;
  }
  .btn-primary, .btn-secondary{
    border:none;
    border-radius:30px;
    padding:13px 28px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
  }
  .btn-primary{
    background:var(--tls-dark);
    color:#fff;
  }
  .btn-primary:hover{ background:#100f6e; transform:translateY(-1px); }
  .btn-primary:disabled{ background:#c7c7dc; cursor:not-allowed; transform:none; }
  .btn-secondary{
    background:transparent;
    color:var(--tls-dark);
    border:2px solid var(--grey-bg);
  }
  .btn-secondary:hover{ border-color:var(--tls-dark); }
  .feedback-box{
    border-radius:12px;
    padding:16px 18px;
    font-size:15px;
    line-height:1.5;
    display:none;
  }
  .feedback-box.show{ display:block; animation: fadeIn .3s ease; }
  .feedback-box.ok{ background:#e6f8f8; color:var(--tls-dark); border-left:5px solid var(--tls-teal); }
  .feedback-box.bad{ background:#fdeaea; color:#7a1414; border-left:5px solid var(--tls-red); }
  .feedback-box.info{ background:var(--grey-bg); color:var(--ink-soft); border-left:5px solid var(--tls-dark); }

  /* Hotspot map - built as UI, not photo overlay */
  .map-wrap{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
  }
  .hotspot{
    position:relative;
    background:var(--grey-bg);
    border:2px solid transparent;
    border-radius:14px;
    padding:16px 14px 14px;
    cursor:pointer;
    transition:.2s ease;
    min-height:110px;
    display:flex;
    flex-direction:column;
    gap:8px;
    justify-content:flex-start;
  }
  .hotspot:hover{ border-color:var(--tls-teal); transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,165,171,0.2); }
  .hotspot.open{ border-color:var(--tls-dark); background:#eef0fb; }
  .hotspot .icon{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--tls-teal);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:15px;
    flex-shrink:0;
  }
  .hotspot .label{ font-weight:700; font-size:14.5px; color:var(--tls-dark); }
  .hotspot .detail{
    font-size:13px;
    color:var(--ink-soft);
    display:none;
    line-height:1.4;
  }
  .hotspot.open .detail{ display:block; }
  .map-hint{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .badge-critical{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--tls-red);
    color:#fff;
    font-size:12px;
    font-weight:800;
    padding:4px 10px;
    border-radius:20px;
    letter-spacing:.4px;
    text-transform:uppercase;
  }
  .tool-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .tool-item{
    background:var(--grey-bg);
    border-radius:12px;
    padding:16px 18px;
    cursor:pointer;
    border:2px solid transparent;
    transition:.2s ease;
  }
  .tool-item:hover{ border-color:var(--tls-teal); }
  .tool-item.open{ border-color:var(--tls-dark); background:#eef0fb; }
  .tool-q{
    font-weight:800;
    color:var(--tls-dark);
    font-size:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .tool-a{
    display:none;
    margin-top:10px;
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.5;
    border-top:1px dashed #c9cce6;
    padding-top:10px;
  }
  .tool-item.open .tool-a{ display:block; }
  .chevron{ transition:transform .2s ease; font-size:14px; color:var(--tls-teal); }
  .tool-item.open .chevron{ transform:rotate(180deg); }
  .final-badge{
    text-align:center;
    padding:26px 20px;
    background:linear-gradient(135deg, var(--tls-dark), #0a2f66);
    border-radius:16px;
    color:#fff;
  }
  .final-badge .check{
    width:60px;height:60px;
    margin:0 auto 12px;
    border-radius:50%;
    background:var(--tls-teal);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;
    font-weight:800;
  }
  .final-badge h2{ color:#fff; }
  .final-badge .sub{
    color:#cfe9ea;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:800;
    margin-top:4px;
  }
  .locked-msg{
    font-size:13px;
    color:var(--tls-red);
    font-weight:700;
    display:none;
    margin-top:4px;
  }
  .locked-msg.show{ display:block; }
  /* Ajustes TLS: navegación siempre visible, resultado y diseño en celular */
  .nav-row{position:sticky;bottom:0;z-index:5;background:#fff;padding:12px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid #eef0f6;gap:12px;}
  .resultado-nota{background:var(--grey-bg);border-radius:12px;padding:14px 18px;text-align:center;font-size:16px;color:var(--tls-dark);}
  .resultado-nota strong{font-size:22px;}
  .resultado-nota small{display:block;margin-top:4px;color:var(--ink-soft);font-size:13px;}
  img{max-width:100%;}
  button.opt,.hotspot,.tool-item{-webkit-tap-highlight-color:transparent;}
  @media (max-width:560px){
    #app{padding:12px 10px 24px;}
    button.opt{ flex:1 1 100%; }
    .nav-row .btn-primary,.nav-row .btn-secondary{padding:12px 18px;}
    .map-wrap{grid-template-columns:1fr 1fr;gap:10px;}
    .hotspot{min-height:0;padding:12px;}
  }

.photo-frame img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:16/9}
.final-photo{margin:18px 0;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(11,23,48,.16)}
.final-photo img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
</style>
<script>
/* Registro SCORM 1.2 para Moodle: estado, nota y cierre de la sesión */
(function(){
  function buscar(w){var n=0;while(w&&!w.API&&w.parent&&w.parent!==w&&n<10){w=w.parent;n++;}return w&&w.API?w.API:null;}
  var api=buscar(window)||(window.opener?buscar(window.opener):null), activo=false, cerrado=false;
  function leer(k){try{return api?String(api.LMSGetValue(k)):'';}catch(e){return '';}}
  function escribir(k,v){try{if(activo)api.LMSSetValue(k,String(v));}catch(e){}}
  function guardar(){try{if(activo)api.LMSCommit('');}catch(e){}}
  if(api){try{activo=String(api.LMSInitialize(''))==='true';}catch(e){}}
  if(activo){var st=leer('cmi.core.lesson_status');if(st===''||st==='not attempted'){escribir('cmi.core.lesson_status','incomplete');guardar();}}
  window.TLS_SCORM={
    completar:function(nota){
      if(!activo)return;
      escribir('cmi.core.score.min','0');escribir('cmi.core.score.max','100');
      escribir('cmi.core.score.raw',Math.max(0,Math.min(100,Math.round(nota))));
      escribir('cmi.core.lesson_status','completed');guardar();
    },
    finalizar:function(){if(!activo||cerrado)return;cerrado=true;guardar();try{api.LMSFinish('');}catch(e){}}
  };
  window.addEventListener('pagehide',function(){window.TLS_SCORM.finalizar();});
})();
</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> TLS® · M4</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="step-count" id="stepCount">1 / 8</div>
  </header>

  <main class="card" id="cardRoot"></main>
</div>

<script>
/* =========================================================
   ESTADO GENERAL
   ========================================================= */
const state = {
  screen: 0,
  totalScreens: 8,
  decisionAnswered:false,
  decisionCorrect:false,
  mapOpened:new Set(),
  case1Answered:false,
  case2Answered:false,
  toolOpened:new Set()
};

const REQUIRED_MAP_ITEMS = 8;
const REQUIRED_TOOL_ITEMS = 5;

function goTo(n){
  state.screen = n;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function next(){ if(state.screen < state.totalScreens-1) goTo(state.screen+1); }
function prev(){ if(state.screen > 0) goTo(state.screen-1); }

// Puntaje: primera respuesta de las tres decisiones (pantallas 3, 5 y 6)
function notaDesafio(){
  const ok = (state.decisionCorrect ? 1 : 0) + (state.case1Val === 'detener' ? 1 : 0) + (state.case2Val === 'toda' ? 1 : 0);
  return Math.round(ok / 3 * 100);
}

// Al volver a una pantalla ya respondida, se muestra de nuevo la respuesta elegida y su retroalimentación
function marcarRespondidas(){
  const mapa = {2:['decisionAnswered','decisionVal'], 4:['case1Answered','case1Val'], 5:['case2Answered','case2Val']};
  const m = mapa[state.screen];
  if(!m || !state[m[1]]) return;
  document.querySelectorAll('.opt').forEach(o=>o.disabled=false);
  state[m[0]] = false;
  const b = document.querySelector('.opt[data-val="'+state[m[1]]+'"]');
  if(b) b.click();
}

function updateHeader(){
  const pct = ((state.screen+1)/state.totalScreens)*100;
  document.getElementById('progressBar').style.width = pct+'%';
  document.getElementById('stepCount').textContent = (state.screen+1)+' / '+state.totalScreens;
}

function photoFrame(svgFn, caption){
  var key = /telescópico/i.test(caption) ? 'telescopico' : (/articulado/i.test(caption) ? 'articulado' : 'proximidad');
  return `<div class="photo-frame"><img src="${TLS_PHOTOS[key]}" alt="${caption}"><div class="photo-caption">${caption}</div></div>`;
}

/* =========================================================
   RENDER PRINCIPAL POR PANTALLA
   ========================================================= */
function render(){
  updateHeader();
  const root = document.getElementById('cardRoot');
  root.innerHTML = screens[state.screen]();
  bindScreenEvents();
  marcarRespondidas();
  if(state.screen === state.totalScreens-1 && window.TLS_SCORM) window.TLS_SCORM.completar(notaDesafio());
}

/* =========================================================
   DEFINICIÓN DE PANTALLAS
   ========================================================= */
const screens = [
  screen0_portada,
  screen1_escenario,
  screen2_decision,
  screen3_mapa,
  screen4_caso1,
  screen5_caso2,
  screen6_herramienta,
  screen7_cierre
];

function navButtons(opts){
  const {backDisabled=false, nextDisabled=false, nextLabel='Continuar', onNextGuardMsg=''} = opts||{};
  return `
    <div class="nav-row">
      <button class="btn-secondary" id="btnPrev" ${backDisabled?'style="visibility:hidden"':''}>← Atrás</button>
      <div>
        <div class="locked-msg" id="lockMsg">${onNextGuardMsg}</div>
        <button class="btn-primary" id="btnNext" ${nextDisabled?'disabled':''}>${nextLabel}</button>
      </div>
    </div>`;
}

/* ---------- 1. PORTADA ---------- */
function screen0_portada(){
  return `
    <span class="eyebrow">Desafío TLS® · M4 — Operar brazos articulados y telescópicos</span>
    <h1>Llegar no significa que sea seguro</h1>
    ${photoFrame(svgArticulatedBoom, 'Brazo articulado aproximándose a un punto de trabajo en altura')}
    <p class="hook">"El brazo puede llegar. La pregunta es: ¿puede hacerlo manteniendo controlada toda la maniobra?"</p>
    <p>Este desafío autónomo te entrena para analizar la <strong>trayectoria completa</strong> de un brazo articulado o telescópico, en lugar de limitarte a verificar si la plataforma alcanza físicamente el punto de trabajo.</p>
    ${navButtons({backDisabled:true, nextLabel:'Comenzar desafío'})}
  `;
}

/* ---------- 2. ESCENARIO ---------- */
function screen1_escenario(){
  return `
    <span class="eyebrow">Escenario</span>
    <h1>Un punto de mantenimiento al alcance</h1>
    ${photoFrame(svgTelescopicBoom, 'Brazo telescópico extendido hacia una estructura de mantenimiento')}
    <p>Un brazo puede alcanzar físicamente un punto de mantenimiento. Para hacerlo deberá:</p>
    <ul style="color:var(--ink-soft); line-height:1.7; font-size:16px; padding-left:22px; margin:0;">
      <li>extenderse;</li>
      <li>girar;</li>
      <li>aproximarse a estructuras;</li>
      <li>utilizar espacio próximo a tránsito.</li>
    </ul>
    <p class="hook">¿Alcanzar confirma que la maniobra es segura?</p>
    ${navButtons({})}
  `;
}

/* ---------- 3. DECISIÓN ---------- */
function screen2_decision(){
  const answered = state.decisionAnswered;
  return `
    <span class="eyebrow">Decisión</span>
    <h1>¿Alcanzar el punto confirma que la maniobra es segura?</h1>
    <div class="btn-row">
      <button class="opt" data-val="si" id="optSi" ${answered?'disabled':''}>SÍ</button>
      <button class="opt" data-val="no" id="optNo" ${answered?'disabled':''}>NO</button>
    </div>
    <div class="feedback-box ${answered?'show':''} ${answered?'ok':''}" id="decisionFeedback">
      <strong>NO.</strong> También debe analizarse el recorrido completo del brazo y el espacio ocupado por todo el equipo durante la maniobra: extensión, giro, contrapeso/cola, y proximidad a estructuras y a zonas de tránsito.
    </div>
    ${navButtons({nextDisabled:!answered, onNextGuardMsg:'Selecciona una opción para continuar.'})}
  `;
}

/* ---------- 4. MAPA DE LA MANIOBRA ---------- */
const mapFactors = [
  {id:'alcance', icon:'A', label:'Alcance', detail:'Distancia máxima que el brazo debe cubrir para llegar al punto de trabajo.'},
  {id:'giro', icon:'G', label:'Giro', detail:'Movimiento de rotación de la torreta que desplaza todo el conjunto, no solo la canasta.'},
  {id:'cola', icon:'C', label:'Contrapeso / cola', detail:'Parte posterior del equipo que se desplaza en sentido opuesto durante el giro.'},
  {id:'obstaculos', icon:'O', label:'Obstáculos', detail:'Elementos fijos o móviles que pueden interferir en cualquier tramo del recorrido.'},
  {id:'estructuras', icon:'E', label:'Estructuras', detail:'Superficies, columnas o instalaciones cercanas a la trayectoria del brazo.'},
  {id:'atrapamiento', icon:'AT', label:'Atrapamiento', detail:'Zonas donde una parte del cuerpo o del equipo podría quedar comprimida entre elementos.'},
  {id:'transito', icon:'T', label:'Tránsito', detail:'Circulación de personas o vehículos en el espacio que ocupará el equipo.'},
  {id:'superficie', icon:'S', label:'Superficie', detail:'Condición del terreno o piso donde se apoya y opera el equipo.'}
];

function screen3_mapa(){
  const opened = state.mapOpened.size;
  const items = mapFactors.map(f=>`
    <div class="hotspot ${state.mapOpened.has(f.id)?'open':''}" data-id="${f.id}">
      <div class="icon">${f.icon}</div>
      <div class="label">${f.label}</div>
      <div class="detail">${f.detail}</div>
    </div>
  `).join('');
  return `

}

  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  if(btnPrev) btnPrev.addEventListener('click', prev);
  if(btnNext) btnNext.addEventListener('click', ()=>{
    if(btnNext.disabled){
      const lockMsg = document.getElementById('lockMsg');
      if(lockMsg) lockMsg.classList.add('show');
      return;
    }
    next();
  });

  // Pantalla 3: Decisión
  if(state.screen===2){
    ['optSi','optNo'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('click', (e)=>{
        if(state.decisionAnswered) return;
        state.decisionAnswered = true;
        state.decisionCorrect = (id==='optNo');
        state.decisionVal = document.getElementById(id).getAttribute('data-val');
        document.getElementById('optSi').disabled = true;
        document.getElementById('optNo').disabled = true;
        if(id==='optSi'){ document.getElementById('optSi').classList.add('incorrect'); }
        document.getElementById('optNo').classList.add('correct');
        const fb = document.getElementById('decisionFeedback');
        fb.classList.add('show','ok');
        document.getElementById('btnNext').disabled = false;
      });
    });
  }

  // Pantalla 4: Mapa
  if(state.screen===3){
    document.querySelectorAll('.hotspot').forEach(h=>{
      h.addEventListener('click', ()=>{
        const id = h.getAttribute('data-id');
        state.mapOpened.add(id);
        h.classList.add('open');
        const opened = state.mapOpened.size;
        document.querySelector('.map-hint').textContent = `Toca cada factor para revisar qué debe evaluarse (${opened}/${REQUIRED_MAP_ITEMS} revisados).`;
        if(opened >= REQUIRED_MAP_ITEMS){
          document.getElementById('btnNext').disabled = false;
        }
      });
    });
  }

  // Pantalla 5: Microcaso 1
  if(state.screen===4){
    document.querySelectorAll('.opt').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(state.case1Answered) return;
        state.case1Answered = true;
        const val = b.getAttribute('data-val');
        state.case1Val = val;
        document.querySelectorAll('.opt').forEach(o=>o.disabled=true);
        const fb = document.getElementById('case1Feedback');
        fb.classList.add('show');
        if(val==='detener'){
          b.classList.add('correct');
          fb.classList.add('ok');
          fb.innerHTML = '<strong>Correcto.</strong> Cuando el espacio disponible disminuye durante la aproximación, la maniobra debe detenerse para reevaluar antes de continuar.';
        } else {
          b.classList.add('incorrect');
          fb.classList.add('bad');
          const msg = val==='continuar'
            ? 'Continuar sin reevaluar el espacio reduce el margen de control de la maniobra.'
            : 'Corregir sobre la marcha no elimina el riesgo si el espacio sigue disminuyendo.';
          fb.innerHTML = `<strong>Esta opción no es la más segura.</strong> ${msg} Lo correcto es <strong>DETENER</strong> y reevaluar el espacio disponible.`;
        }
        document.getElementById('btnNext').disabled = false;
      });
    });
  }

  // Pantalla 6: Microcaso 2
  if(state.screen===5){
    document.querySelectorAll('.opt').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(state.case2Answered) return;
        state.case2Answered = true;
        const val = b.getAttribute('data-val');
        state.case2Val = val;
        document.querySelectorAll('.opt').forEach(o=>o.disabled=true);
        if(val==='toda'){ b.classList.add('correct'); }
        else { b.classList.add('incorrect'); }
        document.getElementById('case2Feedback').classList.add('show','ok');
        document.getElementById('btnNext').disabled = false;
      });
    });
  }

  // Pantalla 7: Herramienta TLS
  if(state.screen===6){
    document.querySelectorAll('.tool-item').forEach(t=>{
      t.addEventListener('click', ()=>{
        const id = t.getAttribute('data-id');
        state.toolOpened.add(id);
        t.classList.add('open');
        const opened = state.toolOpened.size;
        document.querySelector('.map-hint').textContent = `Toca cada pregunta para revisarla (${opened}/${REQUIRED_TOOL_ITEMS} revisadas).`;
        if(opened >= REQUIRED_TOOL_ITEMS){
          document.getElementById('btnNext').disabled = false;
        }
      });
    });
  }

  // Pantalla 8: Cierre
  if(state.screen===7){
    const btnRestart = document.getElementById('btnRestart');
    if(btnRestart) btnRestart.addEventListener('click', ()=>{
      state.decisionAnswered=false;
      state.decisionCorrect=false;
      state.mapOpened=new Set();
      state.case1Answered=false;
      state.case2Answered=false;
      state.toolOpened=new Set();
      state.decisionVal=null; state.case1Val=null; state.case2Val=null;
      goTo(0);
    });
  }
}

/* =========================================================
   INICIO
   ========================================================= */
render();
</script>
</body>
</html>
