<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafío TLS — Continuar, Corregir o Detener</title>
<style>
  :root{
    --azul-profundo:#171697;
    --teal:#00A5AB;
    --azul-marino:#0B0B4D;
    --amarillo:#FFC72C;
    --gris:#6B7280;
    --gris-claro:#F2F3F7;
    --blanco:#FFFFFF;
    --rojo:#D32F2F;
    --verde:#1E8E5A;
    --naranjo:#C97A00;
    --radio:18px;
    --sombra:0 10px 30px rgba(11,11,77,0.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:'Segoe UI',Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--azul-marino) 0%,var(--azul-profundo) 55%,var(--teal) 130%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:var(--azul-marino);
  }
  .app{width:100%;max-width:780px;margin:auto;}
  .card{
    background:var(--blanco);
    border-radius:var(--radio);
    box-shadow:var(--sombra);
    padding:36px 32px;
    min-height:440px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:clip;
    animation:fadeIn .5s ease;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .progress-bar{
    width:100%;height:6px;background:var(--gris-claro);
    border-radius:6px;overflow:hidden;margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--azul-profundo));
    border-radius:6px;transition:width .4s ease;width:12.5%;
  }
  .eyebrow{
    display:inline-block;background:var(--azul-profundo);color:var(--blanco);
    font-size:12px;font-weight:700;letter-spacing:1.5px;padding:6px 14px;
    border-radius:30px;margin-bottom:16px;text-transform:uppercase;width:fit-content;
  }
  h1{font-size:26px;color:var(--azul-marino);line-height:1.25;margin-bottom:14px;}
  h2{font-size:20px;color:var(--azul-profundo);margin-bottom:14px;line-height:1.3;}
  h3{font-size:15px;color:var(--azul-profundo);}
  p{font-size:16px;line-height:1.55;color:#33334d;margin-bottom:14px;}
  .hook{
    font-size:18px;font-style:italic;color:var(--teal);
    border-left:4px solid var(--teal);padding-left:16px;margin:18px 0 26px;
  }
  .img-frame{
    width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
    background:linear-gradient(135deg,#dfe3ec,#c7cde0);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;position:relative;
  }
  .img-frame svg{width:100%;height:100%;display:block;}
  .btn{
    appearance:none;border:none;cursor:pointer;font-size:16px;font-weight:700;
    padding:15px 26px;border-radius:12px;background:var(--azul-profundo);color:var(--blanco);
    transition:transform .15s ease, background .2s ease, box-shadow .2s ease;
    width:100%;box-shadow:0 6px 16px rgba(23,22,151,0.25);
  }
  .btn:hover{background:var(--teal);transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{background:#b9bcd8;cursor:not-allowed;box-shadow:none;transform:none;}
  .btn.secondary{background:var(--blanco);color:var(--azul-profundo);border:2px solid var(--azul-profundo);box-shadow:none;}
  .btn.secondary:hover{background:var(--gris-claro);}

  .concept-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;
  }
  .concept-card{
    background:var(--gris-claro);border:2px solid transparent;border-radius:14px;
    padding:18px 14px;cursor:pointer;transition:all .25s ease;text-align:center;
  }
  .concept-card:hover{border-color:var(--teal);}
  .concept-card.open{background:var(--blanco);border-color:var(--azul-profundo);box-shadow:0 6px 16px rgba(23,22,151,0.12);}
  .concept-icon{
    width:48px;height:48px;border-radius:50%;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--blanco);font-weight:800;
  }
  .concept-card[data-tipo="continuar"] .concept-icon{background:var(--verde);}
  .concept-card[data-tipo="corregir"] .concept-icon{background:var(--amarillo);color:var(--azul-marino);}
  .concept-card[data-tipo="detener"] .concept-icon{background:var(--rojo);}
  .concept-title{font-weight:800;font-size:14px;letter-spacing:.5px;color:var(--azul-profundo);margin-bottom:6px;}
  .concept-body{
    font-size:13px;color:#33334d;line-height:1.4;
    max-height:0;overflow:hidden;transition:max-height .3s ease;
  }
  .concept-card.open .concept-body{max-height:120px;margin-top:4px;}

  .decision-row{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap;}
  .decision-btn{
    flex:1;min-width:150px;padding:18px 14px;border-radius:12px;border:2px solid var(--gris-claro);
    background:var(--gris-claro);font-size:15px;font-weight:800;letter-spacing:.4px;
    cursor:pointer;color:var(--azul-marino);transition:all .2s ease;
  }
  .decision-btn:hover{border-color:var(--teal);}
  .decision-btn[data-tipo="continuar"]{color:var(--verde);}
  .decision-btn[data-tipo="corregir"]{color:var(--naranjo);}
  .decision-btn[data-tipo="detener"]{color:var(--rojo);}
  .decision-btn.correct{background:#E4F8F4;border-color:var(--teal);}
  .decision-btn.incorrect{background:#FBE9E9;border-color:var(--rojo);}
  .decision-btn:disabled{cursor:default;}

  .feedback{
    margin-top:16px;padding:16px;border-radius:12px;font-size:15px;line-height:1.5;
    display:none;animation:fadeIn .4s ease;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:#E4F8F4;color:#0B5750;border-left:4px solid var(--teal);}
  .feedback.err{background:#FBE9E9;color:#7A1E1E;border-left:4px solid var(--rojo);}
  .feedback.note{background:#FFF6DF;color:#6B4E00;border-left:4px solid var(--amarillo);}

  .tree{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0;}
  .tree-node{
    background:var(--gris-claro);border:2px solid transparent;border-radius:12px;
    padding:14px 18px;text-align:center;font-weight:700;font-size:14px;color:var(--azul-marino);
    width:100%;
  }
  .tree-node.active{border-color:var(--azul-profundo);background:#EAEAFB;}
  .tree-choices{display:flex;gap:10px;width:100%;}
  .tree-choice{
    flex:1;padding:14px;border-radius:10px;border:none;cursor:pointer;
    font-weight:700;font-size:14px;color:var(--blanco);transition:transform .15s ease;
  }
  .tree-choice:hover{transform:translateY(-2px);}
  .tree-choice.si{background:var(--azul-profundo);}
  .tree-choice.no{background:var(--gris);}
  .tree-choice:disabled{opacity:.45;cursor:default;transform:none;}
  .tree-arrow{color:var(--teal);font-size:18px;}
  .tree-result{
    width:100%;text-align:center;padding:18px;border-radius:12px;font-weight:800;
    font-size:16px;letter-spacing:.5px;color:var(--blanco);display:none;animation:fadeIn .4s ease;
  }
  .tree-result.show{display:block;}
  .tree-result.continuar{background:var(--verde);}
  .tree-result.corregir{background:var(--naranjo);}
  .tree-result.detener{background:var(--rojo);}
  .tree-path{
    font-size:13px;color:var(--gris);text-align:center;margin-top:8px;line-height:1.6;
  }

  .badge-final{text-align:center;padding:10px;}
  .badge-final .circle{
    width:96px;height:96px;border-radius:50%;
    background:linear-gradient(135deg,var(--teal),var(--azul-profundo));
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--blanco);font-size:42px;
  }
  .idea-fuerza{
    background:var(--gris-claro);border-left:5px solid var(--amarillo);padding:18px;border-radius:10px;
    font-size:17px;font-weight:700;color:var(--azul-marino);margin:18px 0;
  }
  .multi-select-hint{font-size:13px;color:var(--gris);margin-bottom:10px;}

  /* Ajustes TLS: botón de avance siempre visible, resultado y diseño en celular */
  .btn.sticky-next{position:sticky;bottom:12px;z-index:5;}
  .btn.sticky-next:disabled{background:#b9bcd8;}
  .resultado-nota{background:var(--gris-claro);border-radius:12px;padding:14px 18px;margin:6px 0 4px;text-align:center;font-size:16px;color:var(--azul-marino);}
  .resultado-nota strong{font-size:22px;color:var(--azul-profundo);}
  .resultado-nota small{display:block;margin-top:4px;color:var(--gris);font-size:13px;}
  .decision-btn,.concept-card,.tree-choice,.btn{-webkit-tap-highlight-color:transparent;}
  img{max-width:100%;}
  @media (max-width:560px){
    body{padding:10px;}
    .decision-row{gap:10px;}
    .decision-btn{padding:15px 14px;}
    .btn.sticky-next{bottom:8px;}
    .card{padding:26px 20px;}
    h1{font-size:22px;}
    .concept-grid{grid-template-columns:1fr;}
    .decision-row{flex-direction:column;}
    .tree-choices{flex-direction:column;}
  }

.img-frame img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
</style>
<script>
/* Registro SCORM 1.2 para Moodle: estado, nota y cierre de la sesión */
(function(){
  function buscar(w){var n=0;while(w&&!w.API&&w.parent&&w.parent!==w&&n<10){w=w.parent;n++;}return w&&w.API?w.API:null;}
  var api=buscar(window)||(window.opener?buscar(window.opener):null), activo=false, cerrado=false;
  function leer(k){try{return api?String(api.LMSGetValue(k)):'';}catch(e){return '';}}
  function escribir(k,v){try{if(activo)api.LMSSetValue(k,String(v));}catch(e){}}
  function guardar(){try{if(activo)api.LMSCommit('');}catch(e){}}
  if(api){try{activo=String(api.LMSInitialize(''))==='true';}catch(e){}}
  if(activo){var st=leer('cmi.core.lesson_status');if(st===''||st==='not attempted'){escribir('cmi.core.lesson_status','incomplete');guardar();}}
  window.TLS_SCORM={
    completar:function(nota){
      if(!activo)return;
      escribir('cmi.core.score.min','0');escribir('cmi.core.score.max','100');
      escribir('cmi.core.score.raw',Math.max(0,Math.min(100,Math.round(nota))));
      escribir('cmi.core.lesson_status','completed');guardar();
    },
    finalizar:function(){if(!activo||cerrado)return;cerrado=true;guardar();try{api.LMSFinish('');}catch(e){}}
  };
  window.addEventListener('pagehide',function(){window.TLS_SCORM.finalizar();});
})();
</script>

  function photoPlaceholder(labelHtml){
    var plain = labelHtml.replace(/<[^>]*>/g,'');
    var low = plain.toLowerCase();
    var key = low.indexOf('tránsito')>=0 ? 'transito' : (low.indexOf('alerta')>=0 || low.indexOf('anómalo')>=0 ? 'anormal' : (low.indexOf('ambient')>=0 ? 'ambiente' : (low.indexOf('despejada')>=0 ? 'controlada' : 'portada')));
    return '<div class="img-frame"><img src="'+TLS_PHOTOS[key]+'" alt="'+plain.replace(/"/g,'&quot;')+'"></div>';
  }

  function setProgress(){
    progressFill.style.width = ((state.screen / state.totalScreens) * 100) + '%';
  }

  function goTo(n){
    state.screen = n;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function render(){
    setProgress();
    switch(state.screen){
      case 1: renderScreen1(); break;
      case 2: renderScreen2(); break;
      case 3: renderScreen3(); break;
      case 4: renderScreen4(); break;
      case 5: renderScreen5(); break;
      case 6: renderScreen6(); break;
      case 7: renderScreen7(); break;
      case 8: renderScreen8(); break;
    }
    var principal = content.querySelector('[id^="btnNext"]');
    if(principal) principal.classList.add('sticky-next');
  }

  // ---------- PANTALLA 1 ----------
  function renderScreen1(){
    content.innerHTML =
      '<span class="eyebrow">Desafío TLS®</span>' +
      '<h1>CONTINUAR, CORREGIR O DETENER</h1>' +
      photoPlaceholder('operador frente al panel de mandos de una PEMP evaluando la condición de la operación') +
      '<p class="hook">"La decisión más importante no siempre es cómo continuar. A veces es reconocer cuándo no debes hacerlo."</p>' +
      '<button class="btn" id="btnStart">ACEPTAR DESAFÍO</button>';
    document.getElementById('btnStart').addEventListener('click', function(){ goTo(2); });
  }

  // ---------- PANTALLA 2 ----------
  function renderScreen2(){
    var conceptos = [
      {tipo:'continuar', letra:'C', titulo:'CONTINUAR', texto:'La condición permanece controlada y coincide con lo previsto.'},
      {tipo:'corregir', letra:'!', titulo:'CORREGIR', texto:'Existe una desviación que puede ser controlada antes de continuar.'},
      {tipo:'detener', letra:'✕', titulo:'DETENER', texto:'La condición impide mantener controlada la operación o requiere evaluación adicional.'}
    ];

    var html = '<span class="eyebrow">Tres conceptos</span>' +
      '<h2>Toca cada tarjeta para revisarla</h2>' +
      '<div class="concept-grid" id="conceptGrid">';

    conceptos.forEach(function(c){
      html += '<div class="concept-card" data-tipo="' + c.tipo + '">' +
        '<div class="concept-icon">' + c.letra + '</div>' +
        '<div class="concept-title">' + c.titulo + '</div>' +
        '<div class="concept-body">' + c.texto + '</div>' +
      '</div>';
    });

    html += '</div>' +
      '<button class="btn" id="btnNext2" style="margin-top:10px;" disabled>CONTINUAR</button>';

    content.innerHTML = html;

    var cards = document.querySelectorAll('.concept-card');
    cards.forEach(function(card){
      card.addEventListener('click', function(){
        card.classList.toggle('open');
        state.conceptsOpened.add(card.getAttribute('data-tipo'));
        if(state.conceptsOpened.size >= conceptos.length){
          document.getElementById('btnNext2').disabled = false;
        }
      });
    });

    document.getElementById('btnNext2').addEventListener('click', function(){ goTo(3); });
  }

  // ---------- Helper genérico para pantallas de decisión (3 opciones) ----------
  function renderDecisionScreen(opts){
    // opts: {eyebrow, titulo, foto, descripcion, correcta, feedbacks, onAnsweredFlag, nextScreen, nota}
    var html = '<span class="eyebrow">' + opts.eyebrow + '</span>' +
      '<h2>' + opts.titulo + '</h2>' +
      photoPlaceholder(opts.foto) +
      '<p>' + opts.descripcion + '</p>' +
      '<div class="decision-row" id="decisionRow">' +
        '<button class="decision-btn" data-tipo="continuar">CONTINUAR</button>' +
        '<button class="decision-btn" data-tipo="corregir">CORREGIR</button>' +
        '<button class="decision-btn" data-tipo="detener">DETENER</button>' +
      '</div>' +
      '<div class="feedback" id="fbDecision"></div>' +
      (opts.nota ? '<div class="feedback note" id="fbNota">' + opts.nota + '</div>' : '') +
      '<button class="btn" id="btnNextDecision" style="margin-top:10px;" disabled>CONTINUAR</button>';

    content.innerHTML = html;

    var row = document.getElementById('decisionRow');
    var buttons = row.querySelectorAll('.decision-btn');
    var answered = false;

    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        if(answered) return;
        answered = true;
        var tipo = btn.getAttribute('data-tipo');
        buttons.forEach(function(b){
          b.disabled = true;
          if(b.getAttribute('data-tipo') === opts.correcta) b.classList.add('correct');
        });
        if(tipo !== opts.correcta) btn.classList.add('incorrect');

        var fb = document.getElementById('fbDecision');
        fb.textContent = opts.feedbacks[tipo];
        fb.className = 'feedback show ' + (tipo === opts.correcta ? 'ok' : 'err');
        // La nota complementaria se muestra después de responder (antes delataba la respuesta)
        var nota = document.getElementById('fbNota');
        if(nota) nota.classList.add('show');
        document.getElementById('btnNextDecision').disabled = false;
        opts.onAnswered(tipo === opts.correcta);
      });
    });

    document.getElementById('btnNextDecision').addEventListener('click', function(){ goTo(opts.nextScreen); });
  }

  // ---------- PANTALLA 3 — CASO A ----------
  function renderScreen3(){
    renderDecisionScreen({
      eyebrow:'Caso A',
      titulo:'El área permanece controlada',
      foto:'PEMP operando en un área despejada, coincidente con lo planificado, sin desviaciones visibles',
      descripcion:'El área permanece controlada y las condiciones coinciden con la planificación.',
      correcta:'continuar',
      feedbacks:{
        continuar:'Correcto. Cuando la condición coincide con lo planificado y permanece controlada, corresponde continuar.',
        corregir:'No hay una desviación que corregir: la condición coincide con lo planificado y está controlada.',
        detener:'Detener no es necesario cuando la condición está controlada y coincide con lo previsto.'
      },
      onAnswered:function(ok){ state.caseAAnswered = true; state.okA = ok; },
      nextScreen:4
    });
  }

  // ---------- PANTALLA 4 — CASO B ----------
  function renderScreen4(){
    renderDecisionScreen({
      eyebrow:'Caso B',
      titulo:'Aparece tránsito en una zona relevante',
      foto:'zona de maniobra de una PEMP con presencia de tránsito de personas o vehículos cerca del área de trabajo',
      descripcion:'Aparece tránsito en una zona relevante para la maniobra.',
      correcta:'corregir',
      feedbacks:{
        continuar:'Continuar sin corregir ignora una desviación que aún puede controlarse antes de seguir.',
        corregir:'Correcto. Corresponde corregir la condición antes de continuar, cuando pueda controlarse de forma segura y conforme al procedimiento aplicable.',
        detener:'Detener por completo no es necesario si la condición puede corregirse de forma segura y autorizada.'
      },
      onAnswered:function(ok){ state.caseBAnswered = true; state.okB = ok; },
      nextScreen:5,
      nota:'Corregir la condición antes de continuar solo cuando pueda controlarse de forma segura y conforme al procedimiento aplicable.'
    });
  }

  // ---------- PANTALLA 5 — CASO C ----------
  function renderScreen5(){
    renderDecisionScreen({
      eyebrow:'Caso C',
      titulo:'El equipo presenta comportamiento anormal',
      foto:'panel de mandos o componente de una PEMP mostrando una señal de alerta o comportamiento anómalo',
      descripcion:'El equipo presenta comportamiento anormal.',
      correcta:'detener',
      feedbacks:{
        continuar:'Un comportamiento anormal del equipo no debe ignorarse continuando la operación.',
        corregir:'Un comportamiento anormal del equipo no corresponde intentar corregirlo ni diagnosticarlo en el momento: corresponde detener.',
        detener:'Correcto. Ante un comportamiento anormal del equipo, corresponde detener. No corresponde diagnosticar la falla.'
      },
      onAnswered:function(ok){ state.caseCAnswered = true; state.okC = ok; },
      nextScreen:6,
      nota:'No corresponde diagnosticar la falla en este momento.'
    });
  }

  // ---------- PANTALLA 6 — CASO D ----------
  function renderScreen6(){
    renderDecisionScreen({
      eyebrow:'Caso D',
      titulo:'Cambian las condiciones del entorno',
      foto:'entorno de trabajo de una PEMP con condiciones ambientales visiblemente distintas a las planificadas',
      descripcion:'Las condiciones ambientales o del entorno han cambiado y ya no coinciden con lo planificado.',
      correcta:'detener',
      feedbacks:{
        continuar:'Continuar sin reevaluar mantiene la operación bajo una condición que ya no coincide con lo planificado.',
        corregir:'Un cambio en las condiciones ambientales o del entorno no se resuelve con una corrección puntual, sino deteniendo y reevaluando.',
        detener:'Correcto. Corresponde detener y reevaluar hasta recuperar condiciones controladas.'
      },
      onAnswered:function(ok){ state.caseDAnswered = true; state.okD = ok; },
      nextScreen:7
    });
  }

  // ---------- PANTALLA 7 — ÁRBOL DE DECISIÓN ----------
  function renderScreen7(){
    content.innerHTML =
      '<span class="eyebrow">Herramienta de decisión</span>' +
      '<h2>Recorre el árbol de decisión</h2>' +
      '<p class="multi-select-hint">Responde cada pregunta para avanzar por el árbol.</p>' +
      '<div class="tree" id="treeWrap"></div>' +
      '<div class="tree-path" id="treePath"></div>' +
      '<button class="btn" id="btnNext7" style="margin-top:18px;display:none;">CONTINUAR</button>';

    var wrap = document.getElementById('treeWrap');
    var pathLabel = document.getElementById('treePath');
    var path = [];

    function updatePath(){
      pathLabel.textContent = path.join('  →  ');
    }

    function showQuestion(text){
      var q = document.createElement('div');
      q.className = 'tree-node active';
      q.textContent = text;
      wrap.appendChild(q);
    }

    function showChoices(step){
      var row = document.createElement('div');
      row.className = 'tree-choices';

      var siBtn = document.createElement('button');
      siBtn.className = 'tree-choice si';
      siBtn.textContent = 'SÍ';

      var noBtn = document.createElement('button');
      noBtn.className = 'tree-choice no';
      noBtn.textContent = 'NO';

      row.appendChild(siBtn);
      row.appendChild(noBtn);
      wrap.appendChild(row);

      function disable(){
        siBtn.disabled = true;
        noBtn.disabled = true;
      }

      siBtn.addEventListener('click', function(){ disable(); handleAnswer(step, true, path, updatePath, wrap, showResult); });
      noBtn.addEventListener('click', function(){ disable(); handleAnswer(step, false, path, updatePath, wrap, showResult); });
    }

    function showResult(tipo, texto){
      var res = document.createElement('div');
      res.className = 'tree-result show ' + tipo;
      res.textContent = texto;
      wrap.appendChild(res);
      document.getElementById('btnNext7').style.display = 'block';
    }

    function handleAnswer(step, isSi, path, updatePath, wrap, showResult){
      if(step === 'planificada'){
        path.push(isSi ? 'SÍ, es la condición planificada' : 'NO es la condición planificada');
        updatePath();
        if(isSi){
          showQuestion('¿SE MANTIENE CONTROLADA?');
          showChoices('controlada');
        } else {
          showQuestion('¿PUEDE CORREGIRSE DE FORMA SEGURA Y AUTORIZADA?');
          showChoices('corregible');
        }
      } else if(step === 'controlada'){
        if(isSi){
          path.push('Se mantiene controlada');
          updatePath();
          showResult('continuar', 'CONTINUAR');
        } else {
          path.push('No se mantiene controlada');
          updatePath();
          showQuestion('¿PUEDE CORREGIRSE DE FORMA SEGURA Y AUTORIZADA?');
          showChoices('corregible');
        }
      } else if(step === 'corregible'){
        if(isSi){
          path.push('Puede corregirse de forma segura y autorizada');
          updatePath();
          showQuestion('VERIFICAR LA CORRECCIÓN');
          var verifyBtn = document.createElement('button');
          verifyBtn.className = 'btn';
          verifyBtn.textContent = 'VERIFICAR';
          verifyBtn.style.marginTop = '0';
          verifyBtn.addEventListener('click', function(){
            verifyBtn.disabled = true;
            path.push('Verificada la corrección');
            updatePath();
            showResult('corregir', 'CORREGIR → VERIFICAR → CONTINUAR');
          });
          wrap.appendChild(verifyBtn);
        } else {
          path.push('No puede corregirse de forma segura y autorizada, hay duda, o la condición es crítica');
          updatePath();
          showQuestion('ASEGURAR Y COMUNICAR');
          var ackBtn = document.createElement('button');
          ackBtn.className = 'btn';
          ackBtn.textContent = 'ASEGURAR Y COMUNICAR';
          ackBtn.style.marginTop = '0';
          ackBtn.addEventListener('click', function(){
            ackBtn.disabled = true;
            path.push('Asegurada y comunicada la condición');
            updatePath();
            showResult('detener', 'DETENER → ASEGURAR → COMUNICAR');
          });
          wrap.appendChild(ackBtn);
        }
      }
    }

    showQuestion('¿LA CONDICIÓN ES LA PLANIFICADA?');
    showChoices('planificada');

    document.getElementById('btnNext7').addEventListener('click', function(){ goTo(8); });
  }

  // ---------- PANTALLA 8 ----------
  function renderScreen8(){
    var nota = notaDesafio();
    if(window.TLS_SCORM) window.TLS_SCORM.completar(nota);
    content.innerHTML =
      '<div class="badge-final">' +
        '<div class="circle">✓</div>' +
        '<h2>DESAFÍO COMPLETADO</h2>' +
      '</div>' +
      '<div class="resultado-nota">Tu puntaje: <strong>' + nota + '</strong> / 100<small>Se considera tu primera respuesta en cada uno de los cuatro casos.</small></div>' +
      '<div class="idea-fuerza">"Detener una operación cuando las condiciones lo exigen es una decisión de control."</div>' +
      '<button class="btn" id="btnRestart">VOLVER A INTENTAR</button>';

    document.getElementById('btnRestart').addEventListener('click', function(){
      state = initialState();
      render();
    });
  }

  render();
})();
</script>
