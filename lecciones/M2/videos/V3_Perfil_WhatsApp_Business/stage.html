.screen{position:relative;width:390px;height:844px;border-radius:40px;overflow:hidden;background:#fff;font-size:15px}
.sb{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;color:#111}

.ico{width:24px;height:24px;fill:#54656f;flex:none}
.top{height:56px;display:flex;align-items:center;gap:18px;padding:0 16px;font-size:20px;font-weight:600}
.top .t{flex:1}.top .ico{fill:#3b4a54}
.brand{color:#1daa61;font-size:22px;font-weight:700}
.srch{margin:2px 16px 10px;height:42px;border-radius:21px;background:#f0f2f5;display:flex;align-items:center;gap:12px;padding:0 16px;color:#667781}
.chips{display:flex;gap:8px;padding:0 16px 10px;overflow:hidden;white-space:nowrap}
.chips span{border-radius:16px;background:#f0f2f5;color:#54656f;padding:6px 13px;font-size:13.5px;font-weight:500;flex:none}
.chips span.on{background:#d9fdd3;color:#0a7d42}
.row{display:flex;align-items:center;gap:14px;padding:11px 16px;position:relative}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.cl .nm{font-size:16.5px;font-weight:600}.cl .ms{font-size:14px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.cl .tm{margin-left:auto;align-self:flex-start;text-align:right;font-size:12px;color:#667781;padding-top:4px}
.badge{display:inline-grid;place-items:center;min-width:21px;height:21px;border-radius:11px;background:#25d366;color:#fff;font-size:12px;font-weight:700;margin-top:6px}
.lab{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:9px;padding:1px 8px;margin-top:3px}
.nav{position:absolute;left:0;right:0;bottom:0;height:78px;border-top:1px solid #e9edef;background:#fff;display:flex;justify-content:space-around;padding-top:9px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:#3b4a54;width:84px}
.nav b{display:grid;place-items:center;width:62px;height:32px;border-radius:16px}
.nav .on b{background:#d9fdd3}.nav .on .ico{fill:#0a7d42}
.sec{font-size:14px;color:#667781;font-weight:500;padding:16px 16px 6px}
.li{display:flex;align-items:center;gap:22px;padding:13px 18px;font-size:16px}
.li .ico{fill:#54656f}.li small{display:block;font-size:13px;color:#667781;margin-top:2px}
.li.hov{background:#f0f2f5}
.green{color:#008069}
.pf{text-align:center;padding:14px 0 8px}
.pf .big{width:128px;height:128px;border-radius:50%;margin:0 auto;position:relative;background:#dfe5e7;display:grid;place-items:center;overflow:visible}
.pf .big img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.pf .cam{position:absolute;right:2px;bottom:2px;width:38px;height:38px;border-radius:50%;background:#1daa61;display:grid;place-items:center}
.pf .cam .ico{fill:#fff;width:20px;height:20px}
.fld{display:flex;gap:20px;padding:12px 20px;align-items:flex-start}
.fld .ico{margin-top:4px}
.fld .k{font-size:13px;color:#667781}.fld .v{font-size:15.5px;margin-top:2px;line-height:1.35}
.fld .v.ph{color:#008069;font-weight:500}
.fld .pen{margin-left:auto;margin-top:8px;width:20px;height:20px;fill:#008069}
.dim{position:absolute;inset:0;background:rgba(11,20,26,.45);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:21;padding:20px 22px 12px}
.sheet h4{font-size:17px;font-weight:600;margin-bottom:14px}
.inp{border-bottom:2px solid #1daa61;padding:6px 2px 8px;font-size:16px;line-height:1.4;min-height:36px}
.cnt{text-align:right;font-size:12px;color:#8696a0;margin-top:4px}
.sbtn{display:flex;justify-content:flex-end;gap:30px;margin-top:14px;font-weight:600;color:#008069;font-size:15px}
.sbtn span{padding:6px 4px}
.caret{display:inline-block;width:2px;height:19px;background:#1daa61;vertical-align:-3px;margin-left:1px}
.kb{background:#e8eaed;margin:12px -22px -12px;padding:8px 4px 14px}
.kb div{display:flex;justify-content:center;gap:5px;margin:6px 0}
.kb span{width:33px;height:42px;border-radius:6px;background:#fff;display:grid;place-items:center;font-size:17px;color:#222;box-shadow:0 1px 0 #b9bdc2}
.kb span.w{width:180px}.kb span.g{background:#cfd3d8;width:48px}
.tg{width:44px;height:26px;border-radius:13px;background:#c4ccd0;position:relative;flex:none;margin-left:auto}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg.on{background:#1daa61}.tg.on:after{left:21px}
.bubble{max-width:290px;padding:8px 11px 7px;border-radius:10px;font-size:15px;line-height:1.35;margin:6px 12px;position:relative;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.bubble.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.bubble.out{background:#d9fdd3;align-self:flex-end;border-top-right-radius:2px}
.bubble small{display:block;text-align:right;font-size:11px;color:#667781;margin-top:2px}
.chat{position:absolute;top:90px;left:0;right:0;bottom:70px;background:#efeae2;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:10px}
.ibar{position:absolute;left:0;right:0;bottom:0;height:70px;background:#efeae2;display:flex;align-items:center;gap:8px;padding:0 8px 8px}
.ibar .f{flex:1;height:48px;border-radius:24px;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:16px;color:#8696a0}
.ibar .f.t{color:#111b21}
.ibar .mic{width:48px;height:48px;border-radius:50%;background:#1daa61;display:grid;place-items:center}
.ibar .mic .ico{fill:#fff}
.qr{position:absolute;left:8px;right:8px;bottom:72px;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:6;overflow:hidden}
.qr div{padding:11px 16px;border-bottom:1px solid #f0f2f5;font-size:14px;color:#3b4a54}
.qr div b{color:#111b21;margin-right:8px}
.qr div.hov{background:#f0f2f5}
.prod{display:flex;gap:14px;padding:10px 16px;align-items:center}
.prod img{width:62px;height:62px;border-radius:8px;object-fit:cover}
.prod .n{font-size:15.5px;font-weight:600}.prod .p{font-size:14px;color:#667781;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px}
.tile{border-radius:10px;overflow:hidden;background:#f7f8fa}
.tile img{width:100%;height:150px;object-fit:cover;display:block}
.tile div{padding:8px 10px;font-size:13.5px;font-weight:600}.tile small{display:block;font-weight:500;color:#667781;margin-top:2px}
.fab{position:absolute;right:18px;bottom:96px;width:58px;height:58px;border-radius:17px;background:#1daa61;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:4}

.formf{padding:10px 20px}
.formf .k{font-size:13px;color:#008069;font-weight:600;margin-bottom:2px}

.imgs{display:flex;gap:10px;padding:14px 20px}

.opt{display:flex;align-items:center;gap:18px;padding:13px 6px;font-size:15.5px}

.empty{color:#8696a0;font-size:14px;padding:6px 0}

.info h2{font-size:56px;font-weight:800;margin-bottom:34px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.col{border-radius:26px;padding:32px 36px;min-height:560px}

.col.pay{background:rgba(255,190,0,.14);border:3px solid #ffd666}
.col h3{font-size:38px;margin-bottom:6px}.col .tag{display:inline-block;font-size:26px;font-weight:800;padding:6px 18px;border-radius:18px;margin:10px 0 22px}
.col.free .tag{background:#7ee2a8;color:#0b3a28}.col.pay .tag{background:#ffd666;color:#4a3500}

.srcn{margin-top:26px;font-size:21px;color:rgba(255,255,255,.75)}

.lbl{position:absolute;top:22px;font-size:34px;font-weight:800;color:#fff;padding:8px 28px;border-radius:24px;z-index:5}
.chkl{position:absolute;left:180px;right:180px;top:150px;color:#fff}
.chkl h2{font-size:56px;font-weight:800;text-align:center;margin-bottom:46px;line-height:1.15}
.ci2{font-size:42px;font-weight:700;padding:26px 34px;border-radius:20px;background:rgba(255,255,255,.12);margin-bottom:20px;display:flex;gap:24px;align-items:center}
.box{width:56px;height:56px;border-radius:14px;border:4px solid #8fe4df;display:grid;place-items:center;font-size:38px;color:#0b3a40;flex:none}
.box.on{background:#8fe4df}

#sub{position:absolute;left:150px;right:150px;bottom:26px;text-align:center;z-index:120}

#sub span:empty{display:none}
