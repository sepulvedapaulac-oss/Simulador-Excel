<style>

.box{width:56px;height:56px;border-radius:14px;border:4px solid #8fe4df;display:grid;place-items:center;font-size:38px;color:#0b3a40;flex:none}.box.on{background:#8fe4df}

.qb s{text-decoration-color:#e05a47;text-decoration-thickness:4px}
.photo{position:absolute;inset:0;background:url(img/m6_preparacion.jpg) center/cover}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,59,74,.95) 0%,rgba(18,59,74,.82) 52%,rgba(18,59,74,.2) 100%)}
.cta{position:absolute;left:110px;top:150px;width:1000px;color:#fff;z-index:2}
.cta h2{font-size:62px;font-weight:800;line-height:1.1;margin-bottom:34px}
/* destacado, cursor y subtítulos */
#hl{position:absolute;border:5px solid #ffd60a;border-radius:14px;box-shadow:0 0 0 4000px rgba(5,20,25,.38);z-index:80;display:none}
#hlLabel{position:absolute;background:#ffd60a;color:#1a1a1a;font-weight:800;font-size:23px;padding:8px 18px;border-radius:22px;z-index:81;display:none;white-space:nowrap}
#cursor{position:absolute;z-index:100;width:0;height:0}
#cursor .halo{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;background:rgba(255,214,10,.45);border:3px solid rgba(255,190,0,.9)}
#cursor svg{position:absolute;left:-3px;top:-2px;width:30px;height:40px}
#ripple{position:absolute;z-index:99;border:5px solid #ffbe00;border-radius:50%;display:none}
#sub{position:absolute;left:150px;right:150px;bottom:24px;text-align:center;z-index:120}
#sub span{display:inline-block;background:rgba(8,22,28,.9);color:#fff;font-size:34px;font-weight:600;line-height:1.35;padding:13px 28px;border-radius:16px}
#sub span:empty{display:none}
</style></head>
<body>
<div id="bg"></div>
<div id="note">Recreación neutra de una tienda en línea y una pasarela de pago · Casa Nativa es una empresa ficticia</div>
<section id="sc"></section>
<div id="hl"></div><div id="hlLabel"></div><div id="ripple"></div>
<div id="cursor"><div class="halo"></div><svg viewBox="0 0 30 40"><path d="M2 2 L2 32 L10 25 L15 37 L20 35 L15 23 L26 23 Z" fill="#fff" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
<div id="sub"><span></span></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t*t*(3-2*t),seg=(f,a,b)=>clamp((f-a)/(b-a),0,1),tri=(f,a,b)=>f>=a&&f<b;
const typed=(s,f,a,b)=>s.slice(0,Math.round(s.length*seg(f,a,b)));
const P={n:'Lámpara decorativa de ratán',p:'$39.990',d:'$3.990',t:'$43.980',id:'CN-1045'};
const win=(url,inner)=>`<div class="win"><div class="chrome"><i></i><i></i><i></i><div class="url">🔒 ${url}</div></div><div class="page">${inner}</div></div>`;
const shop=(c=0)=>`<div class="shop"><img src="img/logo_cn.png"><b>CASA NATIVA</b><div class="nav"><span>Inicio</span><span>Iluminación</span><span>Textiles</span><span class="cart" id="cartb">🛒 ${c}</span></div></div>`;
const steps=(k)=>`<div class="steps">${['Carrito','Datos','Pago','Confirmación'].map((s,i)=>`<span class="${i<k?'ok':i===k?'on':''}">${i<k?'✓ ':''}${i+1}. ${s}</span>`).join('')}</div>`;
function prodPage(c=0){return win('casanativa.cl/iluminacion/lampara-ratan',shop(c)+`<div class="prodp"><img id="pimg" src="img/p_lampara.jpg"><div><div style="color:#9a7b5c;font-size:15px;font-weight:600;margin-bottom:8px">ILUMINACIÓN · HECHO A MANO</div><h1>${P.n}</h1><div class="price" id="pprice">${P.p}</div><div class="desc">Pantalla de ratán tejida a mano y base de cerámica. 38 cm de alto. Ampolleta LED incluida.</div><div class="qty" id="pqty"><span>−</span><b>1</b><span>+</span></div><br><span class="btn" id="bcomprar">Agregar al carrito</span></div></div>`)}
function cartPage(){return win('casanativa.cl/carrito',shop(1)+steps(0)+`<div style="padding:10px 50px"><table class="tbl"><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th style="text-align:right">Subtotal</th></tr><tr id="crow"><td><img src="img/p_lampara.jpg">${P.n}</td><td><div class="qty" id="cqty" style="margin:0"><span>−</span><b>1</b><span>+</span></div></td><td id="cprice">${P.p}</td><td style="text-align:right">${P.p}</td></tr></table>
  <div class="sum" id="csum"><div><span>Subtotal</span><span>${P.p}</span></div><div id="cdesp"><span>Despacho (Santiago)</span><span>${P.d}</span></div><div class="tot" id="ctot"><span>Total</span><span>${P.t}</span></div><span class="btn big" id="ccont" style="margin-top:14px">Continuar</span></div></div>`)}
function formPage(f){const F=[['Nombre','Camila Rojas',.08,.18],['Correo electrónico','camila.rojas@correo.cl',.2,.32],['Teléfono','+56 9 6123 4567',.34,.42],['Dirección de entrega','Av. Irarrázaval 1234, depto. 52, Ñuñoa',.44,.58]];
  return win('casanativa.cl/checkout/datos',shop(1)+steps(1)+`<div style="padding:12px 60px 0;font-size:24px;font-weight:700">¿A quién enviamos el pedido?</div><div class="form">${F.map((x,i)=>{const v=typed(x[1],f,x[2],x[3]),a=f>=x[2]&&f<x[3]+.02;return `<div class="f ${i===3?'full':''}" id="ff${i}"><label>${x[0]}</label><div class="${a?'act':''}">${v}${a?'<span class="caret"></span>':''}</div></div>`}).join('')}</div><div style="padding:6px 60px"><span class="btn" id="fcont">Continuar al pago</span></div>`)}
function payPage(sel){const M=[['💳','Tarjeta de crédito o débito','Se confirma de inmediato a través de la pasarela'],['🏦','Transferencia bancaria','Requiere verificar el depósito y asociarlo al pedido'],['📱','Billetera digital','Pago desde el celular']];
  return win('casanativa.cl/checkout/pago',shop(1)+steps(2)+`<div style="padding:12px 60px 4px;font-size:24px;font-weight:700">Elige cómo pagar · Total ${P.t}</div>${M.map((m,i)=>`<div class="pm ${sel===i?'on':''}" id="pm${i}"><span class="rd"></span><span class="ic">${m[0]}</span><div>${m[1]}<small>${m[2]}</small></div></div>`).join('')}<div style="padding:10px 60px"><span class="btn" id="pcont">Ir a pagar</span></div>`)}
function gwPage(f){const st=f<.55?'form':f<.72?'proc':'ok';
  return win('pago.pasarela-ejemplo.com/checkout',`<div class="gw"><div class="gwc"><div class="hd">🔒 Pago seguro</div><div style="font-size:14px;color:#7a868d">Pasarela de pago (ejemplo genérico)</div>
  <div class="mer"><div>Comercio<br><b style="font-size:18px">Casa Nativa</b><br><span style="font-size:14px;color:#7a868d">Orden ${P.id}</span></div><div style="text-align:right">Monto<br><b>${P.t}</b></div></div>
  ${st==='form'?`<div class="f" id="gcard"><label>Número de tarjeta</label><div>${typed('•••• •••• •••• 4242',f,.12,.3)}</div></div><div class="row2"><div class="f"><label>Vencimiento</label><div>${typed('08/29',f,.32,.37)}</div></div><div class="f"><label>Código de seguridad</label><div>${typed('•••',f,.38,.42)}</div></div></div><div class="pay" id="gpay">Pagar ${P.t}</div><div class="lock">🔒 Tus datos viajan cifrados. Casa Nativa no ve el número completo de tu tarjeta.</div>`:
   st==='proc'?`<div class="spin" style="transform:rotate(${f*2000}deg)"></div><div style="text-align:center;font-size:18px;color:#5f6b72">Procesando el pago…</div>`:
   `<div style="text-align:center;font-size:64px">✅</div><div style="text-align:center;font-size:24px;font-weight:800;color:#16794a">Pago aprobado</div><div style="text-align:center;color:#5f6b72;margin-top:8px">Código de autorización 584201 · Orden ${P.id}</div>`}</div></div>`)}
function confPage(){return win('casanativa.cl/checkout/confirmacion',shop(0)+steps(4)+`<div style="text-align:center;padding:30px 60px"><div style="font-size:70px">🎉</div><div style="font-size:34px;font-weight:800;margin:8px 0">¡Gracias por tu compra, Camila!</div><div style="font-size:20px;color:#5f6b72">Recibimos tu pago. Te enviamos el detalle a camila.rojas@correo.cl</div>
  <div id="cbox" style="margin:26px auto 0;width:620px;text-align:left;border:2px solid #e3e7ea;border-radius:16px;padding:20px 26px;font-size:18px;line-height:1.8"><b>Pedido #${P.id}</b><br>${P.n} × 1<br>Total pagado: <b>${P.t}</b><br><span style="color:#1f7a4d;font-weight:700">Próximo paso:</span> preparamos tu pedido y te avisaremos cuando salga.</div></div>`)}
function phone(x,y,inner){return `<div class="phone" style="left:${x}px;top:${y}px"><div class="scr">${inner}</div></div>`}
const chatHd=`<div class="hd"><div class="av"><img src="img/logo_cn.png"></div>Casa Nativa</div>`;
function admin(state,{search='',rows=null}={}){const R=rows||[['CN-1043','Valentina Díaz','$18.990','st-ent','Entregado'],['CN-1044','Pedro Soto','$24.990','st-prep','En preparación'],[P.id,'Camila Rojas',P.t,...state]];
  return win('admin.casanativa.cl/pedidos',`<div class="adm"><div class="bar">🧾 Panel de pedidos · Casa Nativa<span>Hoy, 11:05</span></div><div class="ct"><h3>Pedidos</h3>${search?`<div style="border:1.5px solid #cfd6da;border-radius:10px;padding:10px 14px;margin-bottom:14px;background:#fff">🔍 ${search}</div>`:''}
  <table class="tbl" style="background:#fff;border-radius:12px"><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Estado</th></tr>${R.map(r=>`<tr id="r_${r[0]}"><td><b>#${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="chip ${r[3]}">${r[4]}</span></td></tr>`).join('')}</table>
  <div class="tl" id="tl"></div></div></div>`)}
/* utilidades */
let CUR={x:900,y:600};const PC={};
function pos(sel,dx=.5,dy=.5){const e=typeof sel==='string'?$(sel):sel;const key=sel+'|'+dx+'|'+dy;if(!e)return PC[key]||CUR;const r=e.getBoundingClientRect();return PC[key]={x:r.left+r.width*dx,y:r.top+r.height*dy}}
function path(f,keys){let p=null;for(let i=0;i<keys.length;i++){if(f>=keys[i][0])p=i}
