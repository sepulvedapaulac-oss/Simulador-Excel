<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t*t*(3-2*t),seg=(f,a,b)=>clamp((f-a)/(b-a),0,1);
const typed=(s,f,a,b)=>s.slice(0,Math.round(s.length*seg(f,a,b)));
const lerp=(a,b,t)=>a+(b-a)*t;
/* marca */
const C={ter:'#B5573B',oli:'#6B7A4B',lin:'#F3EBDD',caf:'#3A2A20',bei:'#E4D6C1'};

/* contraste WCAG */
function lum(h){const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const fr=r=>r.toFixed(1).replace('.',',')+' : 1';
/* pieza */
function handles(w,h){return [[0,0],[w/2,0],[w,0],[0,h/2],[w,h/2],[0,h],[w/2,h],[w,h]].map(p=>`<span class="hd" style="left:${p[0]-6}px;top:${p[1]-6}px"></span>`).join('')}

  if(o.logo)h+=`<div class="el" id="e_logo" style="left:36px;top:26px;font:600 12px Montserrat;letter-spacing:.32em;color:${C.oli}"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${C.ter};margin-right:8px"></span>CASA NATIVA</div>`;
  if(o.photo){const p=o.photo;h+=`<div class="el ${sel==='photo'?'sel':''}" id="e_photo" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;border-radius:${p.r??14}px;background:url(img/m7_living_hd.jpg) ${p.pos||'50% 55%'}/cover">${sel==='photo'?handles(p.w,p.h):''}</div>`}
  if(o.title!=null){const t=o.title;h+=`<div class="el ${sel==='title'?'sel':''}" id="e_title" style="left:${36+(o.tdx||0)}px;top:384px;width:528px;font:700 ${t.size||38}px/${t.lh||1.12} '${t.font||'Playfair Display'}';color:${t.col||C.caf}">${t.t}${t.caret?'<span style="border-left:2px solid #8b3dff;margin-left:1px"></span>':''}${sel==='title'?handles(528,Math.round((t.size||38)*1.2)):''}</div>`}
  if(o.sub!=null)h+=`<div class="el ${sel==='sub'?'sel':''}" id="e_sub" style="left:36px;top:442px;width:528px;font:500 17px/1.3 Montserrat;color:#5a4a3e">${o.sub}${sel==='sub'?handles(528,24):''}</div>`;
  if(o.cta!=null)h+=`<div class="el ${sel==='cta'?'sel':''}" id="e_cta" style="left:36px;top:494px;height:46px;padding:0 22px;border-radius:23px;background:${C.ter};color:#fff;font:700 16px/46px Montserrat;transform:scale(${o.ctaS??1});transform-origin:0 50%;white-space:nowrap">${o.cta}</div>`;
  if(o.extra)h+=o.extra;return h}

function busy(){return `<div class="el" style="inset:0;background:url(img/m7_hero.jpg) center/cover"></div><div class="el" style="inset:0;background:linear-gradient(160deg,rgba(255,0,140,.35),rgba(0,200,255,.25))"></div>
 <div class="el" style="left:18px;top:14px;font:44px/1 Anton;color:#ffe600;text-shadow:3px 3px 0 #e6007e;transform:rotate(-4deg)">¡¡SÚPER MEGA OFERTA!!</div>

 <div class="el" style="right:20px;top:150px;width:150px;height:150px;border-radius:50%;background:#ff2d2d;color:#fff;display:grid;place-items:center;font:48px Anton;transform:rotate(12deg)">-30%</div>

 <div class="el" style="left:24px;top:260px;width:400px;font:600 12px/1.35 Montserrat;color:#f2f2f2">Envíos a todo Chile · Paga con tarjeta, transferencia o efectivo · Precios válidos hasta agotar stock · Síguenos en redes · Comparte esta publicación · Etiqueta a 3 amigas · Consulta por mayor · Horario de lunes a sábado de 10:00 a 19:00 · Retiro en tienda · Pregunta por colores disponibles</div>
 <div class="el" style="left:24px;top:400px;font:46px 'Bebas Neue';color:#00e5ff;letter-spacing:.04em">¡NO TE LO PIERDAS!</div>
 <div class="el" style="left:24px;top:455px;font:30px 'Dancing Script';color:#ffd84d">casa nativa ♥ ♥ ♥</div>
 <div class="el" style="left:24px;top:520px;font:600 11px Montserrat;color:#ddd">*Condiciones en tienda. Imágenes referenciales. No acumulable con otras promociones.</div>`}

/* editor */
const RAIL=[['🗂️','Diseño'],['✳️','Elementos'],['T','Texto'],['🏷️','Marca'],['☁️','Subidos'],['🛠️','Herramientas'],['📁','Proyectos'],['⊞','Apps']];
function ctxBar(k,o={}){if(k==='text')return `<div class="bx" id="c_font" style="width:230px">${o.font||'Playfair Display'}<span style="margin-left:auto">▾</span></div><div class="bx" id="c_size">− <b style="width:38px;text-align:center">${o.size||38}</b> +</div><div class="ic" id="c_color" style="display:flex;flex-direction:column;align-items:center;line-height:1">A<span style="width:22px;height:5px;background:${o.col||C.caf};margin-top:2px;border:1px solid rgba(0,0,0,.15)"></span></div><span class="ic">B</span><span class="ic" style="font-style:italic">I</span><span class="ic" style="text-decoration:underline">U</span><span class="ic">aA</span><div class="sep"></div><span class="ic">≡</span><span class="ic">☰</span><span class="ic">↕</span><div class="sep"></div><span class="ic" style="font-weight:600">Efectos</span><span class="ic" style="font-weight:600">Animar</span><span class="ic" id="c_pos" style="font-weight:600">Posición</span>`;
  if(k==='img')return `<span class="ic" style="font-weight:600">Editar</span><div class="sep"></div><span class="ic" id="c_crop" style="font-weight:600">✂ Recortar</span><span class="ic" style="font-weight:600">Voltear</span><div class="sep"></div><span class="ic" style="font-weight:600">Animar</span><span class="ic" style="font-weight:600">Posición</span>`;

  return `<span style="color:#80868b">Selecciona un elemento para editarlo</span>`}

   ${o.wextra||''}
   <div class="bb"><span>📝 Notas</span><span style="margin-left:auto">${o.pages||'Página 1 de 1'}</span><div class="zs"><i style="left:${(o.zoom||56)/100*150}px"></i></div><b id="zoomv">${Math.round(o.zoom||56)}%</b><span>⛶</span></div></div></div>`}
const PAL=(ring)=>`<h4 style="margin-top:4px">Paleta de Casa Nativa</h4><div>${[['ter','Terracota'],['oli','Verde oliva'],['lin','Lino'],['caf','Café']].map(([k,n])=>`<span class="sw ${ring===k?'ring':''}" id="sw_${k}" title="${n}" style="background:${C[k]}"></span>`).join('')}</div>`;
