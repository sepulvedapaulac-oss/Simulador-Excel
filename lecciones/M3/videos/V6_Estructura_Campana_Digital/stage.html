<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Cómo se estructura una campaña digital</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:Inter,Arial,sans-serif;color:#1c2b33}
#bg{position:absolute;inset:0;background:linear-gradient(135deg,#0d1b3e 0%,#123a6b 55%,#0f6e72 100%)}
#note{position:absolute;left:40px;top:18px;font-size:19px;color:rgba(255,255,255,.88);background:rgba(0,0,0,.25);padding:7px 16px;border-radius:18px;z-index:5}
#sc{position:absolute;inset:0}
.win{position:absolute;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.wt{height:46px;background:#eef1f4;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid #d9dee2}
.wt i{width:12px;height:12px;border-radius:50%;background:#c9d1d6}
.wt .url{margin-left:12px;flex:1;height:30px;border-radius:15px;background:#fff;border:1px solid #d5dbe0;display:flex;align-items:center;padding:0 14px;font-size:15px;color:#5a6a73}
/* Meta */
.mh{height:58px;background:#fff;border-bottom:1px solid #dadde1;display:flex;align-items:center;gap:16px;padding:0 22px;font-size:18px;font-weight:700;color:#1c2b33}
.mh .mb{width:30px;height:30px;border-radius:8px;background:#0866ff;color:#fff;display:grid;place-items:center;font-size:16px}
.mh .pub{margin-left:auto;background:#0866ff;color:#fff;padding:9px 20px;border-radius:8px;font-size:16px}
.mtree{position:absolute;left:0;top:104px;bottom:0;width:300px;background:#f5f6f7;border-right:1px solid #dadde1;padding:18px 14px;font-size:16px}
.mtree div{padding:12px 12px;border-radius:8px;display:flex;gap:10px;align-items:center}
.mtree div.on{background:#e7f0ff;color:#0a58ca;font-weight:700}
.mform{position:absolute;left:300px;top:104px;right:0;bottom:0;background:#f0f2f5;padding:24px 30px;overflow:hidden}
.mcard{background:#fff;border-radius:10px;border:1px solid #dadde1;padding:20px 24px;margin-bottom:16px}
.mcard h3{font-size:20px;margin-bottom:12px}
.mcard .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:17px;border-top:1px solid #eef0f2}
.chip{display:inline-block;background:#e7f0ff;color:#0a58ca;border-radius:16px;padding:6px 14px;font-size:15px;font-weight:600;margin:4px 6px 4px 0}
.tg{width:46px;height:26px;border-radius:13px;background:#0866ff;position:relative;display:inline-block;vertical-align:middle}.tg:after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.inp{border:1.5px solid #ccd0d5;border-radius:8px;padding:10px 14px;font-size:17px;background:#fff}
.modal{position:absolute;inset:104px 0 0 300px;background:rgba(0,0,0,.35);display:grid;place-items:center}
.mdl{width:820px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.mdl .hd{padding:20px 26px;font-size:22px;font-weight:800;border-bottom:1px solid #e4e6eb}
.obj{display:flex;align-items:center;gap:16px;padding:14px 26px;font-size:20px}
.obj .rd{width:22px;height:22px;border-radius:50%;border:2px solid #8a8d91}
.obj.on{background:#e7f0ff}.obj.on .rd{border:7px solid #0866ff}
.obj .ic{width:44px;height:44px;border-radius:10px;background:#f0f2f5;display:grid;place-items:center;font-size:22px}
/* Google */
.gh{height:60px;background:#fff;border-bottom:1px solid #dadce0;display:flex;align-items:center;gap:14px;padding:0 22px;font:500 20px Arial;color:#3c4043}
.gh .gb{display:flex;gap:2px;font-weight:700}
.gnav{position:absolute;left:0;top:106px;bottom:0;width:250px;border-right:1px solid #dadce0;padding:16px 0;font:15px Arial;color:#3c4043}
.gnav div{padding:12px 24px}.gnav div.on{background:#e8f0fe;color:#1967d2;font-weight:700;border-radius:0 20px 20px 0}
.gmain{position:absolute;left:250px;top:106px;right:0;bottom:0;background:#f8f9fa;padding:26px 34px;font-family:Arial}
.gcard{background:#fff;border:1px solid #dadce0;border-radius:8px;padding:18px 22px;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:17px}
.tbl th{text-align:left;font-size:14px;color:#606770;padding:10px 12px;border-bottom:1px solid #dadde1;font-weight:600;background:#f5f6f7}
.tbl td{padding:13px 12px;border-bottom:1px solid #eef0f2}
.serp{position:absolute;left:250px;top:106px;right:0;bottom:0;background:#fff;padding:24px 40px;font-family:Arial}
/* esquemas */
.node{position:absolute;width:300px;height:250px;border-radius:24px;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.25);color:#fff;text-align:center;padding:26px 18px}
.node.on{background:#fff;color:#0d1b3e;border-color:#ffd60a}
.node .ic{font-size:64px}.node b{display:block;font-size:34px;margin:10px 0 8px}.node span{font-size:22px;opacity:.85}
.arr{position:absolute;color:#ffd60a;font-size:54px;font-weight:800}
.cardw{position:absolute;background:#fff;border-radius:24px;padding:30px 36px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.cardw h3{font-size:38px;margin-bottom:10px}.cardw p{font-size:26px;line-height:1.35;color:#3c4a55}
.chk{display:grid;gap:22px;width:1250px;margin:0 auto}
.ci{font-size:42px;font-weight:700;padding:24px 32px;border-radius:20px;background:rgba(255,255,255,.12);display:flex;gap:24px;align-items:center;color:#fff}
.box{width:58px;height:58px;border-radius:14px;border:4px solid #8fd3ff;display:grid;place-items:center;font-size:38px;color:#0d1b3e;flex:none}.box.on{background:#8fd3ff}
.ci small{margin-left:auto;font-size:26px;font-weight:600;opacity:.8}
.phone{position:absolute;width:390px;height:780px;border-radius:50px;background:#111;padding:14px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.phone .scr{width:100%;height:100%;border-radius:38px;background:#fff;overflow:hidden;position:relative;font-family:Inter}
.pill{position:absolute;background:#fff;color:#1c2b33;font-size:24px;font-weight:700;padding:10px 20px;border-radius:24px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
/* destacado, cursor y subtítulos */
#hl{position:absolute;border:5px solid #ffd60a;border-radius:12px;box-shadow:0 0 0 4000px rgba(5,10,25,.35);z-index:80;display:none}
#hlLabel{position:absolute;background:#ffd60a;color:#1a1a1a;font-weight:800;font-size:23px;padding:8px 18px;border-radius:22px;z-index:81;display:none;white-space:nowrap}
#cursor{position:absolute;z-index:100;width:0;height:0}
#cursor .halo{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;background:rgba(255,214,10,.45);border:3px solid rgba(255,190,0,.9)}
#cursor svg{position:absolute;left:-3px;top:-2px;width:30px;height:40px}
#ripple{position:absolute;z-index:99;border:5px solid #ffbe00;border-radius:50%;display:none}
#sub{position:absolute;left:150px;right:150px;bottom:22px;text-align:center;z-index:120}
#sub span{display:inline-block;background:rgba(6,12,28,.9);color:#fff;font-size:33px;font-weight:600;line-height:1.35;padding:12px 28px;border-radius:16px}
#sub span:empty{display:none}
</style></head>
<body>
<div id="bg"></div>
<div id="note">Recreación de Meta Ads y Google Ads con fines educativos · Casa Nativa es una empresa ficticia</div>
<section id="sc"></section>
<div id="hl"></div><div id="hlLabel"></div><div id="ripple"></div>
<div id="cursor"><div class="halo"></div><svg viewBox="0 0 30 40"><path d="M2 2 L2 32 L10 25 L15 37 L20 35 L15 23 L26 23 Z" fill="#fff" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
<div id="sub"><span></span></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t*t*(3-2*t),seg=(f,a,b)=>clamp((f-a)/(b-a),0,1),lerp=(a,b,t)=>a+(b-a)*t;
const typed=(s,f,a,b)=>s.slice(0,Math.round(s.length*seg(f,a,b)));
/* ventanas */
const W={l:60,t:66,w:1800,h:880};
const win=(url,inner,o=W)=>`<div class="win" style="left:${o.l}px;top:${o.t}px;width:${o.w}px;height:${o.h}px"><div class="wt"><i></i><i></i><i></i><div class="url">🔒 ${url}</div></div>${inner}</div>`;
function meta(tree,form){return win('adsmanager.facebook.com',`<div class="mh"><span class="mb">∞</span>Administrador de anuncios<span style="font-weight:500;color:#606770;font-size:16px">Casa Nativa</span><span class="pub">Publicar</span></div>
 <div class="mtree">${[['📁','Campaña nueva','c'],['🎯','Conjunto de anuncios nuevo','s'],['🖼️','Anuncio nuevo','a']].map(x=>`<div id="t_${x[2]}" class="${tree===x[2]?'on':''}" style="${x[2]==='s'?'margin-left:16px':x[2]==='a'?'margin-left:32px':''}">${x[0]} ${x[1]}</div>`).join('')}</div><div class="mform">${form}</div>`)}
function google(nav,main,serp){return win(serp?'www.google.com/search?q=decoración+para+living+pequeño':'ads.google.com',serp?main:`<div class="gh"><span class="gb"><span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span></span> Ads<span style="margin-left:24px;font-size:16px;color:#5f6368">Casa Nativa · 123-456-7890</span></div>
 <div class="gnav">${['Resumen','Campañas','Grupos de anuncios','Palabras clave','Anuncios','Términos de búsqueda','Estadísticas'].map(x=>`<div class="${nav===x?'on':''}">${x}</div>`).join('')}</div><div class="gmain">${main}</div>`)}
const OBJ=[['📣','Reconocimiento','Muestra tus anuncios a las personas con más probabilidades de recordarlos.'],['🖱️','Tráfico','Envía personas a un destino, como tu sitio web.'],['💬','Interacción','Consigue más mensajes, interacciones o respuestas.'],['🔽','Clientes potenciales','Recopila datos de contacto de posibles clientes.'],['📱','Promoción de la app','Consigue que más personas instalen tu app.'],['🛍️','Ventas','Encuentra personas con probabilidades de comprar.']];
/* utilidades */
let CUR={x:1100,y:600};const PC={};
function pos(sel,dx=.5,dy=.5){const e=typeof sel==='string'?$(sel):sel;const key=sel+'|'+dx+'|'+dy;if(!e)return PC[key]||CUR;const r=e.getBoundingClientRect();return PC[key]={x:r.left+r.width*dx,y:r.top+r.height*dy}}
function path(f,keys){let p=null;for(let i=0;i<keys.length;i++){if(f>=keys[i][0])p=i}
  const Pk=k=>{const s=keys[k][1];return typeof s==='object'&&s&&'x' in s?s:pos(s,keys[k][2]??.5,keys[k][3]??.5)};
  if(p===null)return Pk(0);if(p===keys.length-1)return Pk(p);
  const a=Pk(p),b=Pk(p+1),t0=keys[p][0],t1=keys[p+1][0],m=t0+(t1-t0)*.35;if(f<m)return a;const e=ease(seg(f,m,t1));return {x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e}}
function cursor(p,vis=true,clicks=[],f=0,T=1){CUR=p;const c=$('#cursor');c.style.display=vis?'block':'none';c.style.left=p.x+'px';c.style.top=p.y+'px';
  const r=$('#ripple');r.style.display='none';for(const k of clicks){const dt=(f-k)*T;if(dt>=0&&dt<.45){const s=20+dt*160;r.style.display='block';r.style.width=r.style.height=s+'px';r.style.left=(p.x-s/2)+'px';r.style.top=(p.y-s/2)+'px';r.style.opacity=1-dt/.45}}}
function hl(sel,label,pad=8){const h=$('#hl'),l=$('#hlLabel');const e=sel&&(typeof sel==='string'?$(sel):sel);if(!e){h.style.display=l.style.display='none';return}
  const r=e.getBoundingClientRect();h.style.display='block';h.style.left=(r.left-pad)+'px';h.style.top=(r.top-pad)+'px';h.style.width=(r.width+2*pad)+'px';h.style.height=(r.height+2*pad)+'px';
  if(label){l.style.display='block';l.textContent=label;const lw=l.offsetWidth;let x=r.left-pad,y=r.top-pad-52;if(y<70)y=r.bottom+pad+10;if(x+lw>1890)x=1890-lw;l.style.left=x+'px';l.style.top=y+'px'}else l.style.display='none'}
const pick=(f,arr)=>{let r=null;for(const a of arr)if(f>=a[0]&&f<a[1])r=a;return r};
function sub(t){$('#sub span').textContent=t||''}
const STEPS=[['🎯','Objetivo','¿Qué quiero conseguir?'],['👥','Audiencia','¿A quién quiero llegar?'],['💰','Presupuesto','¿Cuánto y por cuánto tiempo?'],['🖼️','Anuncio','¿Qué mensaje mostraré?'],['📊','Resultado','¿Cómo lo mediré?']];
function chain(on,y=330,sc=1){return STEPS.map((s,i)=>`<div class="node ${on[i]?'on':''}" style="left:${70+i*362}px;top:${y}px;opacity:${on[i]===undefined?1:Math.max(.35,on[i]?1:.35)}"><div class="ic">${s[0]}</div><b>${s[1]}</b><span>${s[2]}</span></div>${i<4?`<div class="arr" style="left:${70+i*362+306}px;top:${y+90}px">→</div>`:''}`).join('')}
const SC={};
/* 1 · sin estructura → estructura */
SC[1]=(f,T)=>{const b=seg(f,.36,.44),t=seg(f,.7,.78);
  $('#sc').innerHTML=`<div style="position:absolute;inset:0;background:url(img/m9_hero.jpg) center/cover;opacity:${1-b}"></div><div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,27,62,.2),rgba(13,27,62,.85));opacity:${1-b}"></div>
  <div class="cardw" style="right:120px;top:190px;width:640px;opacity:${seg(f,.03,.08)*(1-b)}"><h3 style="font-size:30px">Promocionar publicación</h3>
   ${[['Objetivo','¿?'],['Audiencia','¿Todo el mundo?'],['Presupuesto','“Pongamos $100.000”'],['Mensaje','¿?'],['Medición','¿?']].map((r,i)=>`<div style="display:flex;justify-content:space-between;font-size:26px;padding:14px 0;border-top:1px solid #eee;opacity:${seg(f,.08+i*.04,.11+i*.04)}"><span>${r[0]}</span><b style="color:#c62828">${r[1]}</b></div>`).join('')}
   <div style="margin-top:16px;background:#0866ff;color:#fff;text-align:center;border-radius:10px;padding:14px;font-size:24px;font-weight:700">Promocionar ahora</div></div>
  <div style="opacity:${b*(1-t)}">${chain([1,1,1,1,1])}</div>
  <div style="position:absolute;inset:0;background:url(img/m9_metricas.jpg) center/cover;opacity:${t}"></div><div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,27,62,.96),rgba(13,27,62,.8) 60%,rgba(13,27,62,.45));opacity:${t}"></div>
  <div style="position:absolute;left:120px;top:330px;width:1100px;color:#fff;opacity:${t}"><div style="font-size:26px;font-weight:700;color:#8fd3ff;margin-bottom:14px">META ADS · GOOGLE ADS</div><div style="font-size:78px;font-weight:800;line-height:1.06">Cómo se estructura una campaña digital</div><div style="font-size:32px;margin-top:22px;opacity:.9">Objetivo · audiencia · presupuesto · anuncio · medición</div></div>`;
  hl(null);cursor(CUR,false)};
/* 2 · cadena */
SC[2]=(f,T)=>{const th=[.1,.3,.46,.6,.76];
  $('#sc').innerHTML=`<div style="position:absolute;left:0;right:0;top:150px;text-align:center;color:#fff;font-size:50px;font-weight:800">Una campaña es una cadena de decisiones</div>${chain(th.map(x=>f>=x?1:0))}
  <div style="position:absolute;left:0;right:0;top:680px;text-align:center;color:#ffd60a;font-size:30px;font-weight:700;opacity:${seg(f,.88,.94)}">Cada decisión depende de la anterior</div>`;
  hl(null);cursor(CUR,false)};
/* 3 · Meta: niveles y objetivos */
SC[3]=(f,T)=>{const modal=f<.72,sel=f>=.62?2:-1;
  const lv=[['Campaña','Objetivo','c'],['Conjunto de anuncios','Audiencia · ubicaciones · presupuesto · calendario','s'],['Anuncio','Imagen · texto · botón','a']];
  const form=modal?`<div class="mcard"><h3>Campaña nueva</h3><div class="row"><span>Objetivo</span><span style="color:#606770">Sin seleccionar</span></div></div>`:
   `<div class="mcard"><h3>Conjunto de anuncios nuevo</h3><div class="row"><span>Objetivo de la campaña</span><b>💬 Interacción</b></div></div><div class="mcard" id="conv"><h3>Ubicación de la conversión</h3>${['Apps de mensajes','Anuncio en video','Tu perfil o página'].map((x,i)=>`<div class="row"><span><span style="display:inline-block;width:18px;height:18px;border-radius:50%;border:${i===0?'6px solid #0866ff':'2px solid #8a8d91'};vertical-align:middle;margin-right:12px"></span>${x}</span></div>`).join('')}<div style="padding:12px 0 0 30px;font-size:17px"><b>Apps de mensajes</b>: ☐ Messenger · ☐ Instagram · <b style="color:#0a58ca">☑ WhatsApp</b></div></div>`;
  const md=modal?`<div class="modal"><div class="mdl" id="mdl"><div class="hd">Elige un objetivo de campaña</div>${OBJ.map((o,i)=>`<div class="obj ${sel===i?'on':''}" id="ob${i}"><span class="rd"></span><span class="ic">${o[0]}</span><div><b>${o[1]}</b><div style="font-size:15px;color:#606770">${o[2]}</div></div></div>`).join('')}</div></div>`:'';
  $('#sc').innerHTML=meta(f<.36||modal?'c':f<.5?'s':'s',form+'')+md.replace('<div class="modal">','<div class="modal" style="inset:auto;left:360px;top:170px;width:1500px;height:776px;justify-items:start;padding-left:60px">')+
   `<div style="position:absolute;left:1500px;top:110px;width:340px;display:grid;gap:12px;opacity:${seg(f,.02,.06)*(f<.36||f>.36)}">${lv.map((l,i)=>`<div id="lv${i}" style="background:#fff;border-radius:14px;padding:14px 18px;margin-left:${i*18}px;box-shadow:0 8px 20px rgba(0,0,0,.25)"><b style="font-size:21px">${i+1}. ${l[0]}</b><div style="font-size:16px;color:#606770">${l[1]}</div></div>`).join('')}</div>`;
  const h=pick(f,[[.02,.1,'#lv0','1 · Campaña'],[.1,.36,'#mdl','Seis objetivos'],[.36,.5,'#lv1','2 · Conjunto de anuncios'],[.5,.6,'#lv2','3 · Anuncio'],[.62,.72,'#ob2','Interacción → conversaciones'],[.76,1,'#conv','Destino: WhatsApp']]);
  hl(h?h[2]:null,h?h[3]:'');
  const p=path(f,[[0,{x:1200,y:600}],[.58,'#ob2',.3,.5],[.68,'#ob2',.3,.5],[.74,'#conv',.6,.85]]);cursor(p,f>=.56,[.62],f,T)};
/* 4 · audiencia */
SC[4]=(f,T)=>{const form=`<div class="mcard" id="adv"><h3>Audiencia</h3><div class="row"><span><span class="tg"></span> &nbsp;<b>Audiencia Advantage+</b></span><span style="color:#606770;font-size:15px">Activada de forma predeterminada</span></div></div>
  <div class="mcard" id="sug"><h3>Sugerencia de audiencia <span style="font-weight:500;color:#606770;font-size:16px">(opcional · se usa como guía)</span></h3><div class="row"><span>Edad</span><span>25 – 55</span></div><div class="row"><span>Intereses</span><span><span class="chip">Decoración del hogar</span><span class="chip">Diseño de interiores</span></span></div></div>
  <div class="mcard" id="ctl"><h3>Controles de audiencia <span style="font-weight:500;color:#606770;font-size:16px">(límites)</span></h3><div class="row"><span>Ubicación</span><span class="chip">📍 Santiago, Chile + 25 km</span></div><div class="row"><span>Edad mínima</span><span>25</span></div></div>`;
  $('#sc').innerHTML=meta('s',`<div style="width:1000px">${form}</div><div class="mcard" id="def" style="position:absolute;left:1060px;top:24px;width:420px"><h3>Definición de la audiencia</h3><div style="height:14px;border-radius:7px;background:linear-gradient(90deg,#f5b400,#31a24c,#f5b400);position:relative;margin:24px 0 10px"><i style="position:absolute;left:52%;top:-8px;width:6px;height:30px;background:#1c2b33;border-radius:3px"></i></div><div style="display:flex;justify-content:space-between;font-size:15px;color:#606770"><span>Específica</span><span>Amplia</span></div>
   <div style="margin-top:20px;border-radius:10px;overflow:hidden;height:190px;background:url(img/m7_daniela.jpg) center/cover"></div><div style="font-size:16px;margin-top:10px;color:#3c4a55">Audiencia pertinente: personas que renuevan espacios pequeños</div></div>`);
  const h=pick(f,[[.06,.3,'#def','Pertinente, no “todo el mundo”'],[.32,.55,'#adv','Advantage+ por defecto'],[.55,.68,'#sug','Sugerencias, no límites'],[.68,.82,'#ctl','Límites: ubicación y edad mínima'],[.84,1,'#def','Un mensaje claro para esa audiencia']]);hl(h?h[2]:null,h?h[3]:'');cursor(CUR,false)};
