<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Del contacto al seguimiento: recorrido práctico por un CRM</title>
<style>
@font-face{font-family:LD;src:url(fonts/lexend-deca-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:LD;src:url(fonts/lexend-deca-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:LD;src:url(fonts/lexend-deca-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:LD;src:url(fonts/lexend-deca-latin-700-normal.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:LD,Inter,Arial,sans-serif;color:#33475b}
#bg{position:absolute;inset:0;background:linear-gradient(135deg,#1b2a38 0%,#213343 55%,#4a2c22 100%)}
#note{position:absolute;left:40px;top:18px;font-size:19px;color:rgba(255,255,255,.9);background:rgba(0,0,0,.28);padding:7px 16px;border-radius:18px;z-index:5}
#sc{position:absolute;inset:0}
/* ===== interfaz tipo HubSpot ===== */
.app{position:absolute;left:40px;top:66px;width:1840px;height:884px;border-radius:14px;overflow:hidden;background:#f5f8fa;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.top{position:absolute;left:0;right:0;top:0;height:56px;background:#213343;display:flex;align-items:center;gap:18px;padding:0 20px 0 14px;color:#fff}
.logo{width:34px;height:34px;border-radius:50%;background:#ff5c35;display:grid;place-items:center}
.logo i{width:12px;height:12px;border-radius:50%;border:3px solid #fff;display:block}
.srch{width:520px;height:36px;border-radius:6px;background:#2f4558;display:flex;align-items:center;padding:0 14px;font-size:15px;color:#b6c5d3;margin-left:40px}
.top .acc{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:15px;color:#dfe7ee}
.top .acc b{width:34px;height:34px;border-radius:50%;background:#f3ebdd;color:#b5573b;display:grid;place-items:center;font-size:14px}
.rail{position:absolute;left:0;top:56px;bottom:0;width:64px;background:#2d3e50;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:10px}
.rail span{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#b6c5d3;font-size:19px;font-weight:600}
.rail span.on{background:#ff5c35;color:#fff}
.fly{position:absolute;left:64px;top:56px;width:260px;bottom:0;background:#fff;border-right:1px solid #cbd6e2;padding:18px 0;z-index:3}
.fly h5{font-size:13px;letter-spacing:.08em;color:#7c98b6;padding:0 22px 10px}
.fly div{padding:12px 22px;font-size:18px;color:#33475b}
.fly div.on{background:#e5f5f8;border-left:4px solid #00a4bd;font-weight:600}
.main{position:absolute;left:64px;right:0;top:56px;bottom:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:14px;padding:20px 28px 0}
.ph h1{font-size:30px;font-weight:600;color:#213343}
.ph .cnt{font-size:16px;color:#516f90;margin-left:4px}
.btn{border-radius:6px;padding:9px 18px;font-size:16px;font-weight:600;border:1px solid #cbd6e2;background:#fff;color:#33475b;white-space:nowrap}
.btn.pri{background:#ff5c35;border-color:#ff5c35;color:#fff}
.btn.sec{border-color:#ff5c35;color:#ff5c35}
.vtabs{display:flex;gap:4px;padding:16px 28px 0;border-bottom:1px solid #cbd6e2}
.vtabs span{padding:10px 18px;font-size:16px;border:1px solid #cbd6e2;border-bottom:none;border-radius:6px 6px 0 0;background:#eaf0f6;color:#516f90;white-space:nowrap}
.vtabs span.on{background:#fff;color:#213343;font-weight:600;position:relative;top:1px}
.fbar{display:flex;gap:10px;padding:14px 28px;align-items:center;background:#fff;border-bottom:1px solid #dfe3eb}
.fbar .dd{font-size:15px;color:#0091ae;font-weight:600;padding:6px 4px;white-space:nowrap}
.fbar .dd.f{border:1px solid #cbd6e2;border-radius:6px;padding:6px 12px}
.fbar .dd.on{background:#e5f5f8;border-color:#00a4bd}
.fbar .s{width:300px;height:36px;border:1px solid #cbd6e2;border-radius:6px;font-size:15px;color:#7c98b6;display:flex;align-items:center;padding:0 12px}
table.ix{border-collapse:collapse;width:100%;background:#fff;font-size:16px}
table.ix th{background:#f5f8fa;color:#33475b;font-size:13px;letter-spacing:.06em;text-align:left;padding:12px 14px;border-bottom:1px solid #cbd6e2;border-right:1px solid #dfe3eb;white-space:nowrap}
table.ix td{padding:13px 14px;border-bottom:1px solid #dfe3eb;white-space:nowrap}
table.ix td.nm{color:#0091ae;font-weight:600;display:flex;align-items:center;gap:10px}
table.ix tr.hov td{background:#e5f5f8}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:14px;font-weight:600}
.t-rec{background:#e5f8f0;color:#00704d}.t-new{background:#e5f5f8;color:#00708a}.t-int{background:#f5ecff;color:#6a3fb5}.t-ina{background:#fff1e0;color:#a35200}
/* ficha */
.rl{position:absolute;left:0;top:0;bottom:0;width:430px;background:#fff;border-right:1px solid #cbd6e2;padding:16px 22px;overflow:hidden}
.rl .bc{font-size:15px;color:#0091ae;font-weight:600}
.rl .hd{display:flex;gap:14px;align-items:center;margin-top:16px}
.rl .hd .ava{width:64px;height:64px;font-size:22px}
.rl .hd b{display:block;font-size:24px;color:#213343;font-weight:600}
.rl .hd small{display:block;font-size:15px;color:#516f90;margin-top:3px}
.acts{display:flex;justify-content:space-between;margin:18px 4px 6px}
.acts div{text-align:center;font-size:13px;color:#33475b;width:58px}
.acts div i{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 5px;border-radius:50%;border:1px solid #cbd6e2;background:#f5f8fa;font-style:normal;font-size:18px;color:#516f90}
.acts div.on i{background:#ff5c35;border-color:#ff5c35;color:#fff}
.sect{margin-top:12px;border-top:1px solid #dfe3eb;padding-top:12px}
.sect h4{font-size:16px;color:#213343;font-weight:600;margin-bottom:6px}
.prop{padding:7px 8px;border-radius:6px}
.prop small{display:block;font-size:13px;color:#516f90}
.prop div{font-size:16px;color:#213343;margin-top:2px;min-height:22px}
.prop.ed{background:#e5f5f8;outline:2px solid #00a4bd}
.rm{position:absolute;left:430px;right:350px;top:0;bottom:0;padding:16px 26px;overflow:hidden}
.rtabs{display:flex;gap:28px;border-bottom:2px solid #dfe3eb;font-size:17px}
.rtabs span{padding:8px 2px;color:#516f90}
.rtabs span.on{color:#213343;font-weight:600;border-bottom:3px solid #213343;margin-bottom:-2px}
.chips{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.chips span{font-size:14px;padding:5px 12px;border-radius:14px;background:#eaf0f6;color:#33475b}
.chips span.on{background:#213343;color:#fff}
.tl h6{font-size:14px;color:#516f90;letter-spacing:.05em;margin:14px 0 8px;font-weight:600}
.ev{background:#fff;border:1px solid #dfe3eb;border-radius:8px;padding:12px 16px;margin-bottom:10px;font-size:16px;line-height:1.4;color:#33475b}
.ev small{display:flex;justify-content:space-between;font-size:14px;color:#516f90;margin-bottom:4px}
.ev small b{color:#213343;font-weight:600}
.ev.new{border-color:#00a4bd;box-shadow:0 0 0 3px rgba(0,164,189,.18)}
.ev.task{border-left:5px solid #ff5c35}
.rr{position:absolute;right:0;top:0;bottom:0;width:350px;background:#fff;border-left:1px solid #cbd6e2;padding:18px 20px}
.rr .card{border-bottom:1px solid #dfe3eb;padding:12px 0;font-size:15px;color:#33475b;line-height:1.45}
.rr .card h4{font-size:15px;color:#213343;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.rr .card h4 span{color:#0091ae}
/* paneles flotantes (nota / tarea) */
.dock{position:absolute;right:30px;bottom:0;width:700px;background:#fff;border-radius:8px 8px 0 0;box-shadow:0 -6px 40px rgba(0,0,0,.28);overflow:hidden;z-index:6}
.dock .dh{height:52px;background:#213343;color:#fff;display:flex;align-items:center;padding:0 18px;font-size:18px;font-weight:600}
.dock .dh span{margin-left:auto;font-weight:400;opacity:.8}
.dock .db{padding:16px 20px;font-size:16px}
.dock .to{font-size:15px;color:#516f90;padding-bottom:10px;border-bottom:1px solid #dfe3eb}
.dock .to b{background:#eaf0f6;color:#33475b;border-radius:12px;padding:3px 10px;font-weight:500}
.dock .ta{min-height:110px;padding:14px 2px;font-size:19px;color:#213343;line-height:1.45}
.dock .ta.ph0{color:#99afc4}
.dock .tb{display:flex;gap:16px;color:#516f90;font-size:15px;padding:8px 0;border-top:1px solid #dfe3eb}
.dock .df{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid #dfe3eb;background:#f5f8fa;font-size:15px}
.fi{border:1px solid #cbd6e2;border-radius:6px;padding:10px 12px;font-size:17px;color:#213343;background:#fff;min-height:44px}
.fl{font-size:13px;color:#516f90;margin:10px 0 4px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.caret{display:inline-block;width:2px;height:22px;background:#213343;vertical-align:-4px;margin-left:1px}
/* panel de filtros */
.drw{position:absolute;right:0;top:0;bottom:0;width:560px;background:#fff;border-left:1px solid #cbd6e2;box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:5}
.drw .dh{height:60px;background:#213343;color:#fff;display:flex;align-items:center;padding:0 22px;font-size:20px;font-weight:600}
.drw .dh span{margin-left:auto;opacity:.8;font-weight:400}
.drw .db{padding:18px 22px}
.drw .grp{border:1px solid #cbd6e2;border-radius:8px;padding:14px;margin-bottom:12px}
.drw .grp h6{font-size:14px;color:#516f90;font-weight:600;margin-bottom:10px}
.cond{background:#f5f8fa;border:1px solid #dfe3eb;border-radius:6px;padding:12px 14px;font-size:16px;color:#213343;line-height:1.4;margin-bottom:8px}
.cond b{font-weight:600}
.and{font-size:13px;font-weight:700;color:#516f90;margin:4px 0 8px 4px}
.plist div{padding:11px 12px;font-size:17px;border-bottom:1px solid #eef2f6;color:#33475b}
.plist div.on{background:#e5f5f8;color:#00708a;font-weight:600}
/* escenas de concepto */
.cardw{position:absolute;background:#fff;border-radius:22px;padding:28px 32px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.cardw h3{font-size:34px;color:#213343;margin-bottom:10px;font-weight:600}
.cardw p{font-size:24px;line-height:1.4;color:#33475b}
.callout{position:absolute;background:#213343;color:#fff;border-radius:16px;padding:18px 24px;font-size:24px;line-height:1.35;box-shadow:0 14px 30px rgba(0,0,0,.35);z-index:7}
.callout b{color:#ffb199}
/* destacado, cursor y subtítulos */
#hl{position:absolute;border:5px solid #ffd60a;border-radius:12px;box-shadow:0 0 0 4000px rgba(10,18,26,.30);z-index:80;display:none}
#hlLabel{position:absolute;background:#ffd60a;color:#1a1a1a;font-weight:700;font-size:23px;padding:8px 18px;border-radius:22px;z-index:81;display:none;white-space:nowrap}
#cursor{position:absolute;z-index:100;width:0;height:0;display:none}
#cursor svg{position:absolute;left:-4px;top:-2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#cursor .halo{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;background:rgba(255,214,10,.35)}
#ripple{position:absolute;z-index:99;border:5px solid #ffbe00;border-radius:50%;display:none}
#sub{position:absolute;left:150px;right:150px;bottom:22px;text-align:center;z-index:120}
#sub span{display:inline-block;background:rgba(10,18,26,.9);color:#fff;font-size:33px;font-weight:500;line-height:1.35;padding:12px 28px;border-radius:16px}
#sub span:empty{display:none}
</style></head>
<body>
<div id="bg"></div>
<div id="note">Recreación de HubSpot con fines educativos · contactos ficticios · Casa Nativa es una empresa ficticia</div>
<section id="sc"></section>
<div id="hl"></div><div id="hlLabel"></div><div id="ripple"></div>
<div id="cursor"><div class="halo"></div><svg width="30" height="38" viewBox="0 0 30 38"><path d="M2 2 L2 30 L9 23 L14 35 L19 33 L14 21 L24 21 Z" fill="#fff" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
<div id="sub"><span></span></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ease=t=>t*t*(3-2*t),seg=(f,a,b)=>clamp((f-a)/(b-a),0,1),lerp=(a,b,t)=>a+(b-a)*t;
const typed=(s,f,a,b)=>s.slice(0,Math.round(s.length*seg(f,a,b)));
/* contactos ficticios (datos inventados: correos de dominio de ejemplo y teléfonos 0000) */
const C=[
 {n:'Daniela Soto',i:'DS',c:'#00a4bd',e:'daniela.soto@ejemplo.cl',p:'+56 9 0000 0101',t:'Cliente recurrente',k:'rec',x:'Decoración infantil',u:'Consultó nueva colección',a:'Contactar viernes'},
 {n:'Andrés Pérez',i:'AP',c:'#7fd1de',e:'andres.perez@ejemplo.cl',p:'+56 9 0000 0102',t:'Cliente nuevo',k:'new',x:'Iluminación',u:'Primera compra',a:'Consultar satisfacción'},
 {n:'Carla Muñoz',i:'CM',c:'#a35dd9',e:'carla.munoz@ejemplo.cl',p:'+56 9 0000 0103',t:'Interesada',k:'int',x:'Decoración living',u:'Solicitó información',a:'Enviar catálogo'},
 {n:'Fernanda Rojas',i:'FR',c:'#f2a541',e:'fernanda.rojas@ejemplo.cl',p:'+56 9 0000 0104',t:'Cliente inactivo',k:'ina',x:'Textiles',u:'Compra hace 7 meses',a:'Acción de reactivación'},
 {n:'Tomás Herrera',i:'TH',c:'#00bda5',e:'tomas.herrera@ejemplo.cl',p:'+56 9 0000 0105',t:'Cliente recurrente',k:'rec',x:'Decoración infantil',u:'Compró repisas infantiles',a:'Avisar novedades'},
 {n:'Josefina Lagos',i:'JL',c:'#516f90',e:'josefina.lagos@ejemplo.cl',p:'+56 9 0000 0106',t:'Cliente nuevo',k:'new',x:'Textiles',u:'Primera compra',a:'Consultar satisfacción'},
 {n:'Matías Fuentes',i:'MF',c:'#e66e50',e:'matias.fuentes@ejemplo.cl',p:'+56 9 0000 0107',t:'Cliente recurrente',k:'rec',x:'Iluminación',u:'Tercera compra',a:'Enviar novedades'},
 {n:'Valeria Núñez',i:'VN',c:'#99afc4',e:'valeria.nunez@ejemplo.cl',p:'+56 9 0000 0108',t:'Cliente inactivo',k:'ina',x:'Decoración living',u:'Compra hace 9 meses',a:'Acción de reactivación'}];
function shell(inner,{rail='crm',fly=null}={}){
 const R=[['⌂','home'],['✉','mk'],['👥','crm'],['☰','rep'],['⚙','cfg']].map(([g,id])=>`<span class="${id===rail?'on':''}" ${id==='crm'?'id="railcrm"':''}>${g}</span>`).join('');
 const F=fly?`<div class="fly"><h5>CRM</h5><div id="flist" style="padding:0">${['Contactos','Empresas','Negocios','Tickets','Segmentos','Tareas','Bandeja de entrada'].map(x=>`<div class="${x===fly?'on':''}" id="fl_${x.split(' ')[0]}">${x}</div>`).join('')}</div></div>`:'';
 return `<div class="app"><div class="top"><div class="logo"><i></i></div><div class="srch">🔍&nbsp; Buscar en HubSpot</div><div class="acc">Casa Nativa <b>MA</b></div></div><div class="rail">${R}</div>${F}<div class="main" ${fly?'style="left:324px"':''}>${inner}</div></div>`}
function table(rows,hov=-1){return `<table class="ix" id="tbl"><tr id="thr"><th style="width:44px">☐</th><th>NOMBRE</th><th>CORREO</th><th>NÚMERO DE TELÉFONO</th><th>TIPO DE CLIENTE</th><th>INTERÉS PRINCIPAL</th><th>ÚLTIMA ACTIVIDAD</th><th>PRÓXIMA ACCIÓN</th></tr>
 ${rows.map((c,j)=>`<tr class="${j===hov?'hov':''}" id="r_${c.i}"><td>☐</td><td class="nm"><span class="ava" style="background:${c.c}">${c.i}</span>${c.n}</td><td>${c.e}</td><td>${c.p}</td><td><span class="tag t-${c.k}">${c.t}</span></td><td>${c.x}</td><td>${c.u}</td><td>${c.a}</td></tr>`).join('')}</table>`}
function index(rows,{tabs=['Todos los contactos','Mis contactos','Recurrentes · Infantil'],on=0,n=rows.length,fon=false,showTab3=false,hov=-1}={}){
 const T=tabs.filter((x,j)=>j<2||showTab3).map((x,j)=>`<span class="${j===on?'on':''}" id="vt${j}">${x}</span>`).join('')+'<span style="background:none;border:none;color:#0091ae">+ Añadir vista</span>';
 return `<div class="ph"><h1>Contactos</h1><span class="cnt">${n} registros</span><span style="margin-left:auto"></span><span class="btn">Acciones ▾</span><span class="btn">Importar</span><span class="btn pri">Crear contacto</span></div>
 <div class="vtabs">${T}</div>
 <div class="fbar"><span class="s">🔍 Buscar nombre, teléfono, correo…</span><span class="dd f">Propietario del contacto ▾</span><span class="dd f">Tipo de cliente ▾</span><span class="dd f">Interés principal ▾</span><span class="dd f">Última actividad ▾</span><span class="dd f ${fon?'on':''}" id="fadv">☷ Filtros avanzados${fon?' (2)':''}</span><span style="margin-left:auto" class="dd">Editar columnas</span></div>
 <div style="padding:0 28px">${table(rows,hov)}</div>`}
/* ficha de Daniela */
const EV0=[
 ['📝 Nota','2 sep 2026','<b>Marcela</b> · Compró un móvil de fieltro para cuna. Pidió que le avisemos cuando lleguen piezas en tonos pastel.'],
 ['✉ Correo','14 ago 2026','Confirmación de compra · Pedido CN-1009 · Lámpara infantil de cerámica'],
 ['📞 Llamada registrada','3 jun 2026','Consultó plazos de despacho. Prefiere coordinar por WhatsApp.'],
 ['👤 Contacto creado','12 mar 2026','Origen: formulario de la tienda en línea']];
function record({tab=1,editI=0,editT=0,newNote=0,task=0,actOn=null,chip=0,props=true}={}){
 const D=C[0];
 const ints=editI<1?(editI>0?'':'—'):'Decoración infantil',tip=editT<1?'—':'Cliente recurrente';
 const ev=[];
 if(task)ev.push(`<h6>PRÓXIMAS</h6><div class="ev task ${task===2?'new':''}" id="evtask"><small><b>☑ Tarea · Por hacer</b><span>Vence: vie 16 oct 2026, 10:00</span></small>Contactar a Daniela el viernes · enviarle información cuando la colección esté disponible <span style="color:#516f90">· Asignada a Marcela</span></div>`);
 ev.push('<h6>OCTUBRE 2026</h6>');
 if(newNote)ev.push(`<div class="ev ${newNote===2?'new':''}" id="evnote"><small><b>📝 Nota</b><span>9 oct 2026 · Marcela</span></small>Consultó por nueva colección infantil.</div>`);
 else ev.push(`<div class="ev" style="color:#7c98b6;border-style:dashed">Sin actividades este mes</div>`);
 ev.push('<h6>ANTERIORES</h6>');
 EV0.forEach(([a,b,c],j)=>ev.push(`<div class="ev" ${j===0?'id="ev0"':''}><small><b>${a}</b><span>${b}</span></small>${c}</div>`));
 const P=(id,l,v,cls='')=>`<div class="prop ${cls}" id="${id}"><small>${l}</small><div>${v}</div></div>`;
 return `<div class="rl"><div class="bc">‹ Contactos</div><div class="hd"><span class="ava" style="background:${D.c}">${D.i}</span><div><b>${D.n}</b><small>${D.e}</small><small>${D.p}</small></div></div>
  <div class="acts" id="acts">${[['✎','Nota'],['✉','Correo'],['☏','Llamada'],['☑','Tarea'],['▦','Reunión'],['⋯','Más']].map(([g,l])=>`<div class="${actOn===l?'on':''}" id="a_${l}"><i>${g}</i>${l}</div>`).join('')}</div>
  <div class="sect" id="about"><h4>⌄ Acerca de este contacto</h4>
  <div id="basic">${P('pe','Correo',D.e)}${P('pp','Número de teléfono',D.p)}${P('po','Propietario del contacto','Marcela · Casa Nativa')}</div>
  ${P('pl','Etapa del ciclo de vida','Cliente')}
  <div id="custom">${P('pt','Tipo de cliente',tip+(editT>0&&editT<1?'<span class="caret"></span>':''),editT>0&&editT<1.5?'ed':'')}${P('pi','Interés principal',(editI>0&&editI<1?typed('Decoración infantil',editI,0,1)+'<span class="caret"></span>':ints),editI>0&&editI<1.5?'ed':'')}${P('pn','Número de compras','3')}</div>
  ${P('pc','Canal preferido','WhatsApp')}</div></div>
 <div class="rm"><div class="rtabs"><span class="${tab===0?'on':''}">Resumen</span><span class="${tab===1?'on':''}">Actividades</span><span>Ingresos</span></div>
